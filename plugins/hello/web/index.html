<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello 插件</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'PingFang SC', 'Microsoft YaHei', 'system-ui', 'sans-serif'] } } } };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="flex h-screen items-center justify-center bg-gradient-to-br from-pink-50 via-white to-indigo-50 p-6 font-sans text-slate-700 antialiased">
  <div class="w-full max-w-xl rounded-3xl border border-white bg-white/80 p-8 shadow-[0_30px_80px_-40px_rgba(15,23,42,0.45)] backdrop-blur">
    <div class="flex items-center gap-4">
      <div class="grid h-14 w-14 place-items-center rounded-2xl bg-gradient-to-br from-pink-500 to-rose-400 text-white shadow-lg shadow-pink-500/25">
        <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4L12 3Z"/></svg>
      </div>
      <div>
        <h1 class="text-xl font-semibold tracking-tight text-slate-900">Hello, DevOS</h1>
        <p class="text-xs text-slate-500">这是一个运行时 Web 插件，没有后端代码</p>
      </div>
    </div>

    <div class="mt-6 grid grid-cols-2 gap-3 text-xs">
      <div class="rounded-xl border border-slate-200 bg-white p-3">
        <div class="text-[10px] uppercase tracking-wide text-slate-400">主机</div>
        <div id="host" class="mt-1 font-medium text-slate-800">—</div>
      </div>
      <div class="rounded-xl border border-slate-200 bg-white p-3">
        <div class="text-[10px] uppercase tracking-wide text-slate-400">已装载应用</div>
        <div id="count" class="mt-1 font-medium text-slate-800">—</div>
      </div>
    </div>

    <div class="mt-5 rounded-xl bg-slate-900 p-4 font-mono text-[11px] leading-relaxed text-slate-200">
      <div class="text-slate-500"># 把插件目录放进下面任一位置，重启 DevOS 后即可出现：</div>
      <div class="mt-1 text-emerald-300">%APPDATA%\DevOS\plugins\hello\</div>
      <div class="text-emerald-300">&lt;DevOS 可执行文件目录&gt;\plugins\hello\</div>
      <div class="text-slate-500"># 结构：plugin.json + web/index.html</div>
    </div>

    <div class="mt-5 flex items-center justify-between">
      <p class="text-[11px] text-slate-400">点击次数（本地存储）：<span id="clicks" class="font-semibold text-slate-700">0</span></p>
      <button id="clickBtn" class="rounded-xl bg-slate-900 px-4 py-2 text-xs font-medium text-white transition hover:bg-slate-700">点我一下</button>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    fetch("/api/system").then((r) => r.json()).then((sys) => {
      $("host").textContent = sys.hostname;
      $("count").textContent = sys.apps + " 个";
    }).catch(() => {});

    let clicks = Number(localStorage.getItem("devos.hello.clicks") || 0);
    function render() { $("clicks").textContent = clicks; }
    $("clickBtn").addEventListener("click", () => {
      clicks += 1;
      localStorage.setItem("devos.hello.clicks", String(clicks));
      render();
    });
    render();
  </script>
</body>
</html>
