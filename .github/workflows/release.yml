name: Release

# 创建 v* 标签时触发，构建各平台安装包并发布到 GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            name: windows-x64
            ext: .exe
          - goos: windows
            goarch: arm64
            name: windows-arm64
            ext: .exe
          - goos: linux
            goarch: amd64
            name: linux-amd64
            ext: ''
          - goos: linux
            goarch: arm64
            name: linux-arm64
            ext: ''
          - goos: darwin
            goarch: arm64
            name: macos-arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            name: macos-intel
            ext: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          ldflags="-s -w -X devos/internal/kernel.Version=${version}"
          # Windows 使用 GUI 子系统，双击启动时不再弹出终端窗口。
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ldflags="${ldflags} -H windowsgui"
          fi
          mkdir -p dist/stage
          go build -trimpath -ldflags "${ldflags}" \
            -o "dist/stage/devos${{ matrix.ext }}" .
          cp README.md README.zh-CN.md LICENSE dist/stage/
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Package archive
        env:
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          base="devos_${VERSION}_${{ matrix.name }}"
          cd dist/stage
          case "${{ matrix.goos }}" in
            windows)
              zip -q "../${base}.zip" "devos${EXT}" README.md README.zh-CN.md LICENSE
              ;;
            darwin)
              # 打包为 .app，双击即可从 Finder 启动并自动打开浏览器。
              mkdir -p DevOS.app/Contents/MacOS
              mv devos DevOS.app/Contents/MacOS/DevOS
              cat > DevOS.app/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>DevOS</string>
            <key>CFBundleDisplayName</key><string>DevOS</string>
            <key>CFBundleIdentifier</key><string>dev.devos.app</string>
            <key>CFBundleExecutable</key><string>DevOS</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
              chmod +x DevOS.app/Contents/MacOS/DevOS
              tar -czf "../${base}.tar.gz" DevOS.app README.md README.zh-CN.md LICENSE
              ;;
            *)
              chmod +x devos
              tar -czf "../${base}.tar.gz" devos README.md README.zh-CN.md LICENSE
              ;;
          esac
          cd ..
          rm -rf stage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
