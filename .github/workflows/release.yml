name: Release

# 创建 v* 标签时触发，构建各平台安装包并发布到 GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            name: windows-x64
            ext: .exe
          - goos: windows
            goarch: arm64
            name: windows-arm64
            ext: .exe
          - goos: linux
            goarch: amd64
            name: linux-amd64
            ext: ''
          - goos: linux
            goarch: arm64
            name: linux-arm64
            ext: ''
          - goos: darwin
            goarch: arm64
            name: macos-arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            name: macos-intel
            ext: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          ldflags="-s -w -X devos/internal/kernel.Version=${version} -X devos/internal/kernel.BuildRelease=1"
          # Windows 使用 GUI 子系统，双击启动时不再弹出终端窗口。
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ldflags="${ldflags} -H windowsgui"
          fi
          mkdir -p dist/stage
          go build -trimpath -ldflags "${ldflags}" \
            -o "dist/stage/devos${{ matrix.ext }}" .
          cp README.md README.zh-CN.md LICENSE dist/stage/
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Package archive
        env:
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          base="devos_${VERSION}_${{ matrix.name }}"
          cd dist/stage
          case "${{ matrix.goos }}" in
            windows)
              zip -q "../${base}.zip" "devos${EXT}" README.md README.zh-CN.md LICENSE
              # 自动更新专用：Wails 更新器要求归档内只有一个顶层条目，
              # 因此额外发布裸 exe 资产（与 zip 同名同架构）。
              cp "devos${EXT}" "../${base}.exe"
              ;;
            darwin)
              # 打包为 .app，双击即可从 Finder 启动并自动打开浏览器。
              mkdir -p DevOS.app/Contents/MacOS
              mv devos DevOS.app/Contents/MacOS/DevOS
              cat > DevOS.app/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>DevOS</string>
            <key>CFBundleDisplayName</key><string>DevOS</string>
            <key>CFBundleIdentifier</key><string>dev.devos.app</string>
            <key>CFBundleExecutable</key><string>DevOS</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
              chmod +x DevOS.app/Contents/MacOS/DevOS
              tar -czf "../${base}.tar.gz" DevOS.app README.md README.zh-CN.md LICENSE
              ;;
            *)
              chmod +x devos
              tar -czf "../${base}.tar.gz" devos README.md README.zh-CN.md LICENSE
              ;;
          esac
          cd ..
          rm -rf stage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  web:
    name: Build web (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          ldflags="-s -w -X devos/internal/kernel.Version=${version}"
          mkdir -p dist/stage
          # Web 版使用 Wails v3 的 server 构建标签（无 GUI），配合运行时 -web 参数：
          # 只提供 HTTP 服务，不创建窗口与托盘，页面通过浏览器访问。
          go build -trimpath -tags server -ldflags "${ldflags}" \
            -o dist/stage/devos .
          cp README.md README.zh-CN.md LICENSE dist/stage/
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Package archive
        run: |
          set -euo pipefail
          base="devos_${VERSION}_web-linux-${{ matrix.arch }}"
          tar -czf "dist/${base}.tar.gz" -C dist/stage devos README.md README.zh-CN.md LICENSE
          rm -rf dist/stage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  linux-legacy:
    name: Build linux-${{ matrix.arch }} (legacy)
    # 旧版发行版兼容包：在与 Ubuntu 20.04/Debian 11 同代的 ubuntu-22.04 环境中编译，
    # 与默认 ubuntu-latest 构建分开产出，方便按目标环境选择安装包。
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          ldflags="-s -w -X devos/internal/kernel.Version=${version}"
          mkdir -p dist/stage
          # 关闭 cgo 得到纯 Go 静态二进制，不依赖目标机的 glibc/GTK。
          go build -trimpath -ldflags "${ldflags}" -o dist/stage/devos .
          cp README.md README.zh-CN.md LICENSE dist/stage/
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Package archive
        run: |
          set -euo pipefail
          base="devos_${VERSION}_linux-${{ matrix.arch }}-legacy"
          chmod +x dist/stage/devos
          tar -czf "dist/${base}.tar.gz" -C dist/stage devos README.md README.zh-CN.md LICENSE
          rm -rf dist/stage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-legacy-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, web, linux-legacy]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
