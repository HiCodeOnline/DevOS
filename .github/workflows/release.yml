name: Release

# 创建 v* 标签时触发，构建各平台安装包并发布到 GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            name: windows-x64
            ext: .exe
          - goos: windows
            goarch: arm64
            name: windows-arm64
            ext: .exe
          - goos: linux
            goarch: amd64
            name: linux-amd64
            ext: ''
          - goos: linux
            goarch: arm64
            name: linux-arm64
            ext: ''
          - goos: darwin
            goarch: arm64
            name: macos-arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            name: macos-intel
            ext: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          mkdir -p dist/stage
          go build -trimpath \
            -ldflags "-s -w -X devos/internal/kernel.Version=${version}" \
            -o "dist/stage/devos${{ matrix.ext }}" .
          cp README.md README.zh-CN.md LICENSE dist/stage/
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Package archive
        env:
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          base="devos_${VERSION}_${{ matrix.name }}"
          cd dist/stage
          if [ "${EXT}" = ".exe" ]; then
            zip -q "../${base}.zip" "devos${EXT}" README.md README.zh-CN.md LICENSE
          else
            chmod +x devos
            tar -czf "../${base}.tar.gz" devos README.md README.zh-CN.md LICENSE
          fi
          cd ..
          rm -rf stage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
