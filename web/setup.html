<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DevOS</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        color: #0f172a;
        font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        background:
          radial-gradient(880px 520px at 10% -12%, rgba(167, 243, 208, 0.5) 0%, rgba(167, 243, 208, 0) 62%),
          radial-gradient(760px 460px at 94% 2%, rgba(191, 219, 254, 0.5) 0%, rgba(191, 219, 254, 0) 60%),
          linear-gradient(180deg, #f8fafc, #eef2f7);
      }
      .card {
        width: min(564px, 100%);
        padding: 32px 34px 28px;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.9);
        background: #fff;
        box-shadow: 0 40px 90px -44px rgba(15, 23, 42, 0.5);
        animation: setupIn 0.22s ease;
      }
      @keyframes setupIn {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo {
        display: grid;
        place-items: center;
        height: 38px;
        width: 38px;
        flex: none;
        border-radius: 12px;
        color: #fff;
        background: linear-gradient(145deg, #34d399, #10b981);
        box-shadow: 0 12px 26px -14px rgba(16, 185, 129, 0.8);
      }
      .logo svg {
        height: 20px;
        width: 20px;
      }
      .brand-name {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .brand-sub {
        margin-top: 2px;
        font-size: 10.5px;
        color: #94a3b8;
      }
      h1 {
        margin: 26px 0 0;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .desc {
        margin: 8px 0 0;
        font-size: 12px;
        line-height: 1.7;
        color: #64748b;
      }
      .field {
        margin-top: 22px;
      }
      .field-label {
        display: block;
        margin-bottom: 7px;
        font-size: 11px;
        font-weight: 600;
        color: #334155;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .dir-input {
        flex: 1;
        min-width: 0;
        height: 42px;
        padding: 0 12px;
        border: 1px solid #e2e8f0;
        border-radius: 11px;
        background: #fbfcfe;
        color: #0f172a;
        font-family: "JetBrains Mono", Consolas, ui-monospace, monospace;
        font-size: 12px;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      }
      .dir-input:focus {
        border-color: #10b981;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.14);
      }
      .browse-btn {
        height: 42px;
        padding: 0 14px;
        border: 1px solid #e2e8f0;
        border-radius: 11px;
        background: #fff;
        color: #475569;
        font-size: 11.5px;
        white-space: nowrap;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .browse-btn:hover {
        background: #f8fafc;
        color: #0f172a;
      }
      .browse-btn:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .hint {
        margin: 8px 0 0;
        font-size: 10.5px;
        line-height: 1.6;
        color: #94a3b8;
      }
      .note {
        margin-top: 20px;
        padding: 11px 13px;
        border: 1px solid #eef2f7;
        border-radius: 11px;
        background: #f8fafc;
        font-size: 10.5px;
        line-height: 1.7;
        color: #94a3b8;
      }
      .error {
        display: none;
        margin: 14px 0 0;
        font-size: 11px;
        color: #e11d48;
      }
      .error.show {
        display: block;
      }
      .status {
        display: none;
        margin: 14px 0 0;
        font-size: 11px;
        color: #047857;
      }
      .status.show {
        display: block;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 24px;
      }
      .primary {
        height: 42px;
        padding: 0 22px;
        border: none;
        border-radius: 11px;
        background: #0f172a;
        color: #fff;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s ease, opacity 0.15s ease;
      }
      .primary:hover {
        background: #1e293b;
      }
      .primary:disabled {
        opacity: 0.6;
        cursor: default;
      }
    </style>
  </head>

          </svg>
        </span>
        <div>
          <div class="brand-name">DevOS</div>
          <div class="brand-sub">Developer Workspace</div>
        </div>
      </div>

      <h1 data-i18n="title"></h1>
      <p class="desc" data-i18n="desc"></p>

      <div class="field">
        <label class="field-label" for="dir" data-i18n="label"></label>
        <div class="row">
          <input id="dir" class="dir-input" type="text" spellcheck="false" autocomplete="off" />
          <button id="browse" class="browse-btn" type="button" data-i18n="browse"></button>
        </div>
        <p class="hint" data-i18n="hint"></p>
      </div>

      <p class="note" data-i18n="note"></p>
      <p id="error" class="error"></p>
      <p id="status" class="status"></p>

      <div class="actions">
        <button id="confirm" class="primary" type="button" data-i18n="confirm"></button>
      </div>
    </main>

              browse_unsupported: "폴더 선택기를 열 수 없습니다. 경로를 직접 입력하세요",
              network: "DevOS 서비스에 연결할 수 없습니다. 앱이 실행 중인지 확인하세요",
              unknown: "초기화에 실패했습니다. 다시 시도하세요"
            }
          },
          ja: {
            title: "アプリのデータフォルダーを選択",
            desc: "DevOS は設定、暗号化された認証情報、壁紙、プラグインデータをこのフォルダーに保存します。既定の場所を使うか、別のフォルダーを選択してください。",
            label: "データフォルダー",
            browse: "参照…",
            hint: "このコンピューターで書き込み可能な絶対パスを入力してください。フォルダーが存在しない場合は自動的に作成されます。",
            note: "このフォルダー内の設定ファイル、暗号化キー、接続情報は保護されています。フォルダーを変更しても既存データは自動的に移行されません。",
            confirm: "確認して初期化",
            initializing: "初期化しています…",
            done: "初期化が完了しました。DevOS を起動しています…",
            errors: {
              empty: "データフォルダーを入力してください",
              not_abs: "絶対パスを入力してください（例: D:\\DevOSData）",
              volume_root: "ドライブのルートは直接使用できません。その中のフォルダーを選択してください",
              mkdir_failed: "このフォルダーを作成できません。パスを確認してください",
              not_writable: "このフォルダーは書き込みできません。別の場所を選択してください",
              save_failed: "フォルダー設定を保存できませんでした。もう一度お試しください",
              parse_failed: "無効なリクエストです",
              browse_unsupported: "フォルダー選択画面を開けません。パスを直接入力してください",
              network: "DevOS サービスに接続できません。アプリが実行中であることを確認してください",
              unknown: "初期化に失敗しました。もう一度お試しください"
            }
          }
        };

        function detectLocale() {
          var lang = (navigator.language || "en").toLowerCase();
          if (lang.indexOf("zh-tw") === 0 || lang.indexOf("zh-hant") === 0 || lang.indexOf("zh-hk") === 0) {
            return "zh-TW";
          }
          if (lang.indexOf("zh") === 0) {
            return "zh-CN";
          }
          if (lang.indexOf("ja") === 0) return "ja";
          if (lang.indexOf("ko") === 0) return "ko";
          if (lang.indexOf("fr") === 0) return "fr";
          if (lang.indexOf("de") === 0) return "de";
          if (lang.indexOf("ru") === 0) return "ru";
          if (lang.indexOf("hi") === 0) return "hi";
          return "en";
        }

        var locale = detectLocale();
        var dict = DICT[locale] || DICT.en;
        document.documentElement.lang = locale;

        function applyText() {
          var nodes = document.querySelectorAll("[data-i18n]");
          for (var i = 0; i < nodes.length; i++) {
            var key = nodes[i].getAttribute("data-i18n");
            if (dict[key]) {
              nodes[i].textContent = dict[key];
            }
          }
        }
        applyText();

        var dirInput = document.getElementById("dir");
        var browseBtn = document.getElementById("browse");
        var confirmBtn = document.getElementById("confirm");
        var errorBox = document.getElementById("error");
        var statusBox = document.getElementById("status");
        var baseURL = location.origin;
        var busy = false;

        function showError(code, fallback) {
          var message = (dict.errors && dict.errors[code]) || fallback || dict.errors.unknown;
          errorBox.textContent = message;
          errorBox.classList.add("show");
          statusBox.classList.remove("show");
        }

        function clearError() {
          errorBox.classList.remove("show");
        }

        function setBusy(next) {
          busy = next;
          confirmBtn.disabled = next;
          browseBtn.disabled = next;
          dirInput.disabled = next;
          confirmBtn.textContent = next ? dict.initializing : dict.confirm;
        }

        var headers = { "X-DevOS-Request": "1" };

        fetch("/api/setup/status", { headers: headers, cache: "no-store" })
          .then(function (res) {
            return res.ok ? res.json() : null;
          })
          .then(function (data) {
            if (data && data.dataDir && !dirInput.value) {
              dirInput.value = data.dataDir;
            }
          })
          .catch(function () {});

        browseBtn.addEventListener("click", function () {
          if (busy) return;
          clearError();
          browseBtn.disabled = true;
          var startDir = (dirInput.value || "").trim();
          fetch("/api/setup/browse", {
            method: "POST",
            headers: Object.assign({ "Content-Type": "application/json" }, headers),
            body: JSON.stringify({ dir: startDir })
          })
            .then(function (res) {
              return res.json().then(function (data) {
                return { ok: res.ok, data: data };
              });
            })
            .then(function (result) {
              if (result.ok && result.data.dir) {
                dirInput.value = result.data.dir;
              } else {
                showError(result.data.code, result.data.error);
              }
            })
            .catch(function () {
              showError("browse_unsupported");
            })
            .finally(function () {
              browseBtn.disabled = false;
            });
        });

        function waitForBoot(url, attempt) {
          var tries = attempt || 0;
          fetch("/api/health", { cache: "no-store" })
            .then(function (res) {
              if (res.ok) {
                location.replace(url);
                return;
              }
              throw new Error("not ready");
            })
            .catch(function () {
              if (tries > 50) {
                location.replace(url);
                return;
              }
              setTimeout(function () {
                waitForBoot(url, tries + 1);
              }, 400);
            });
        }

        confirmBtn.addEventListener("click", function () {
          if (busy) return;
          clearError();
          setBusy(true);
          fetch("/api/setup/choose", {
            method: "POST",
            headers: Object.assign({ "Content-Type": "application/json" }, headers),
            body: JSON.stringify({ dir: dirInput.value.trim() })
          })
            .then(function (res) {
              return res.json().then(function (data) {
                return { ok: res.ok, data: data };
              });
            })
            .then(function (result) {
              if (!result.ok) {
                setBusy(false);
                showError(result.data.code, result.data.error);
                return;
              }
              statusBox.textContent = dict.done;
              statusBox.classList.add("show");
              setTimeout(function () {
                waitForBoot(result.data.url || baseURL, 0);
              }, 300);
            })
            .catch(function () {
              setBusy(false);
              showError("network");
            });
        });

        dirInput.addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            event.preventDefault();
            confirmBtn.click();
          }
        });
      })();
    </script>
  </body>
</html>
