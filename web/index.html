﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="app.title">DevOS · 开发者工作台</title>
  <script src="/assets/vendor/tailwind.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'PingFang SC', 'Microsoft YaHei', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'Cascadia Code', 'Consolas', 'monospace']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/assets/vendor/fonts.css" />
  <link rel="stylesheet" href="/assets/ui.css?v=2" />
  <link rel="stylesheet" href="/assets/desktop.css?v=10" />
  <link rel="stylesheet" href="/assets/lock.css?v=2" />
  <link rel="stylesheet" href="/assets/settings.css?v=4" />
  <link rel="stylesheet" href="/assets/titlebar.css?v=1" />
  <script defer src="/assets/i18n.js?v=4"></script>
  <script defer src="/assets/locales/zh-CN.js?v=4"></script>
  <script defer src="/assets/locales/zh-TW.js?v=4"></script>
  <script defer src="/assets/locales/en.js?v=4"></script>
  <script defer src="/assets/locales/ja.js?v=2"></script>
  <script defer src="/assets/locales/ko.js?v=2"></script>
  <script defer src="/assets/locales/fr.js?v=2"></script>
  <script defer src="/assets/locales/de.js?v=2"></script>
  <script defer src="/assets/locales/ru.js?v=2"></script>
  <script defer src="/assets/locales/hi.js?v=2"></script>
  <script defer src="/assets/lock.js?v=2"></script>
  <script defer src="/assets/settings.js?v=7"></script>
  <script defer src="/assets/desktop.js?v=12"></script>
  <script defer src="/assets/titlebar.js?v=1"></script>
</head>
<body class="h-screen overflow-hidden font-sans text-slate-800 antialiased">
  <!-- 自绘标题栏：不使用系统标题栏，仅提供最小化 / 最大化 / 关闭 -->
  <header id="appTitlebar" class="titlebar" data-platform="windows">
    <div class="titlebar-brand">
      <span class="titlebar-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 7l5 5-5 5" /><path d="M13 17h6" />
        </svg>
      </span>
      <span class="titlebar-name">DevOS</span>
      <span class="titlebar-sep"></span>
      <span class="titlebar-sub" data-i18n="start.subtitle">开发者工作台</span>
    </div>
    <div class="titlebar-drag"></div>
    <div class="titlebar-controls">
      <button class="tb-btn tb-min" type="button" data-window-action="minimize" title="最小化" aria-label="最小化">
        <svg class="tb-icon-min" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1">
          <path d="M0 5h10" />
        </svg>
      </button>
      <button class="tb-btn tb-max" type="button" data-window-action="maximize" title="最大化" aria-label="最大化">
        <svg class="tb-icon-max" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1">
          <rect x="0.5" y="0.5" width="9" height="9" />
        </svg>
        <svg class="tb-icon-restore" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1">
          <rect x="0.5" y="2.5" width="7" height="7" />
          <path d="M2.5 2.5V0.5h7v7h-2" />
        </svg>
      </button>
      <button class="tb-btn tb-close" type="button" data-window-action="close" title="关闭" aria-label="关闭">
        <svg class="tb-icon-close" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1">
          <path d="M0 0l10 10M10 0L0 10" />
        </svg>
      </button>
    </div>
  </header>
  <div id="wallpaper" class="wallpaper preset-aurora"></div>

  <!-- 开机启动页 -->
  <div id="boot" class="boot">
    <div class="boot-inner">
      <div class="boot-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 7l5 5-5 5" /><path d="M13 17h6" />
        </svg>
      </div>
      <div class="mt-5 text-2xl font-semibold tracking-tight text-slate-900">DevOS</div>
      <div class="mt-1 text-sm text-slate-500" data-i18n="boot.starting">正在启动开发者工作台</div>
      <div class="boot-progress"><span></span></div>
    </div>
  </div>

  <!-- 锁屏：设置应用密码后，启动与手动锁定都会回到这里 -->
  <div id="lockScreen" class="lock-screen hidden">
    <div class="lock-panel">
      <div class="lock-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 7l5 5-5 5" /><path d="M13 17h6" />
        </svg>
      </div>
      <div id="lockClock" class="lock-clock">
        <span class="lock-time">--:--</span>
        <span class="lock-date"></span>
      </div>
      <h1 class="lock-title" data-i18n="lock.title">DevOS 已锁定</h1>
      <p class="lock-subtitle" data-i18n="lock.subtitle">输入应用密码以进入桌面</p>
      <form id="lockForm" class="lock-form" autocomplete="off">
        <div class="lock-input-wrap">
          <svg class="lock-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="10" rx="2.5" /><path d="M8 10V7a4 4 0 0 1 8 0v3" />
          </svg>
          <input id="lockPassword" type="password" placeholder="应用密码" data-i18n-placeholder="lock.placeholder" autocomplete="current-password" spellcheck="false" />
        </div>
        <button id="lockSubmit" type="submit" class="lock-submit" data-i18n="lock.unlock">解锁</button>
      </form>
      <p id="lockError" class="lock-error hidden"></p>
      <p class="lock-hint" data-i18n="lock.hint">应用密码至少 6 个字符，可在设置中修改</p>
    </div>
  </div>

  <!-- 桌面 -->
  <main id="desktop" class="absolute left-0 right-0 top-0 bottom-[84px]">
    <div id="icons" class="desktop-icons"></div>
    <div id="windowLayer" class="absolute inset-0 pointer-events-none"></div>
  </main>

  <!-- 任务栏 -->
  <footer id="taskbar" class="taskbar">
    <button id="startBtn" class="start-btn" title="打开应用列表" data-i18n-title="start.openApps">
      <span class="start-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 7l5 5-5 5" /><path d="M13 17h6" />
        </svg>
      </span>
      <span class="hidden sm:block text-sm font-semibold tracking-tight">DevOS</span>
    </button>

    <div class="taskbar-divider"></div>
    <div id="tasks" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar"></div>

    <div class="ml-auto flex items-center gap-3 pr-1">
      <div id="clock" class="clock"></div>
    </div>
  </footer>

  <!-- 开始菜单 -->
  <div id="startMenu" class="start-menu hidden">
    <div class="flex items-center gap-3 px-5 pt-5">
      <div class="h-9 w-9 rounded-xl bg-gradient-to-br from-indigo-500 to-sky-400 text-white flex items-center justify-center shadow-lg shadow-indigo-500/20">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 7l5 5-5 5" /><path d="M13 17h6" />
        </svg>
      </div>
      <div>
        <div class="text-sm font-semibold text-slate-900">DevOS</div>
        <div class="text-[11px] text-slate-500" data-i18n="start.subtitle">开发者工作台</div>
      </div>
      <div class="ml-auto flex items-center gap-1.5">
        <button id="refreshApps" class="start-icon-btn" data-i18n-title="start.refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 12a8 8 0 1 1-2.34-5.66" /><path d="M20 4v4h-4" />
          </svg>
        </button>
        <button id="openSettings" class="start-icon-btn" data-i18n-title="start.settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3.2" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.36.68 1.06 1.13 1.82 1.13H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z" />
          </svg>
        </button>
        <button id="lockNow" class="start-icon-btn" data-i18n-title="start.lock">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="10" rx="2.5" /><path d="M8 10V7a4 4 0 0 1 8 0v3" />
          </svg>
        </button>
      </div>
    </div>

    <div class="px-5 pt-4">
      <div class="relative">
        <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
        </svg>
        <input id="appSearch" type="text" placeholder="搜索应用…" data-i18n-placeholder="start.search" class="w-full rounded-xl border border-slate-200 bg-white/80 py-2.5 pl-9 pr-3 text-sm outline-none transition focus:border-slate-300 focus:ring-4 focus:ring-slate-200/50" />
      </div>
    </div>

    <div id="startApps" class="start-apps"></div>

    <div class="mt-2 flex items-center justify-between border-t border-slate-200/70 px-5 py-3 text-[11px] text-slate-500">
      <span id="startMeta" data-i18n="start.meta.loading">正在读取系统信息…</span>
      <span class="flex items-center gap-1.5">
        <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
        <span data-i18n="start.meta.running">服务运行中</span>
      </span>
    </div>
  </div>

  <div id="toasts" class="fixed bottom-24 left-1/2 z-[9999] flex -translate-x-1/2 flex-col items-center gap-2"></div>
</body>
</html>
