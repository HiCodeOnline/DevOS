<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>密钥库</title>
  <link rel="stylesheet" href="/assets/vendor/fonts.css" />
  <link rel="stylesheet" href="/assets/ui.css?v=2" />
  <script src="/assets/app-i18n.js?v=3"></script>
  <script src="/assets/locales/apps/vault.js?v=1"></script>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --side: #fbfbfe;
      --border: #e8eaf2;
      --border-strong: #d8dbe8;
      --text: #1f2433;
      --muted: #8a90a6;
      --muted-2: #5f6579;
      --hover: #f1f2f9;
      --accent: #6366f1;
      --accent-strong: #4f46e5;
      --accent-soft: #eef0ff;
      --danger: #e11d48;
      --danger-soft: #fff1f2;
      --ok: #10b981;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(20, 24, 40, .04), 0 10px 28px -18px rgba(20, 24, 40, .22);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
    input, textarea, select { font: inherit; color: inherit; }
    input:focus, textarea:focus { outline: none; }
    ::selection { background: #dbe2ff; }
    .hidden { display: none !important; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 32px; padding: 0 13px; border-radius: 8px;
      background: var(--accent); color: #fff; font-size: 12px; font-weight: 500;
      transition: background .15s ease, transform .1s ease;
    }
    .btn-primary:hover { background: var(--accent-strong); }
    .btn-primary:active { transform: translateY(1px); }
    .btn-primary:disabled { opacity: .6; cursor: default; }
    .btn-primary svg { width: 14px; height: 14px; }
    .btn-plain {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 32px; padding: 0 12px; border-radius: 8px;
      border: 1px solid var(--border); background: #fff; color: var(--muted-2); font-size: 12px;
    }
    .btn-plain:hover { background: var(--hover); color: var(--text); }
    .btn-danger {
      display: inline-flex; align-items: center; justify-content: center;
      height: 32px; padding: 0 12px; border-radius: 8px;
      border: 1px solid #fecdd3; background: #fff; color: var(--danger); font-size: 12px;
    }
    .btn-danger:hover { background: var(--danger-soft); }
    .icon-btn {
      display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px;
      color: var(--muted); flex: none; transition: background .12s ease, color .12s ease;
    }
    .icon-btn:hover { background: var(--hover); color: var(--text); }
    .icon-btn svg { width: 15px; height: 15px; }
    .field-label { display: block; margin: 0 0 5px; font-size: 11px; font-weight: 600; color: var(--muted-2); }
    .text-input, .text-area {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 8px; background: #fff; font-size: 12.5px; color: var(--text);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .text-input:focus, .text-area:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
    .text-area { resize: vertical; min-height: 64px; line-height: 1.6; }

    /* ---------- 解锁 / 初始化 ---------- */
    .lock-view {
      height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background:
        radial-gradient(900px 460px at 50% -20%, #e2e7ff 0%, rgba(226,231,255,0) 65%),
        radial-gradient(700px 420px at 88% 110%, #dff7f0 0%, rgba(223,247,240,0) 60%),
        linear-gradient(180deg, #f9fafd 0%, #f1f3fb 100%);
    }
    .lock-card {
      width: min(372px, 100%); padding: 30px 28px 24px; background: var(--panel);
      border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 24px 64px -28px rgba(31,36,51,.35), 0 2px 8px rgba(31,36,51,.04);
    }
    .lock-badge {
      display: grid; place-items: center; width: 46px; height: 46px; margin-bottom: 16px;
      border-radius: 13px; background: var(--accent-soft); color: var(--accent-strong);
    }
    .lock-badge svg { width: 22px; height: 22px; }
    .lock-card h1 { margin: 0 0 6px; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
    .lock-desc { margin: 0 0 20px; font-size: 11.5px; line-height: 1.65; color: var(--muted); }
    .pw-wrap { position: relative; }
    .pw-wrap .text-input { height: 38px; padding-right: 38px; font-size: 13px; }
    .pw-eye {
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      display: grid; place-items: center; width: 30px; height: 30px; border-radius: 6px; color: var(--muted);
    }
    .pw-eye:hover { color: var(--text); background: var(--hover); }
    .pw-eye svg { width: 15px; height: 15px; }
    .lock-field { margin-bottom: 11px; }
    .lock-hint { margin: 2px 0 12px; padding: 8px 10px; border-radius: 8px; background: #f8fafe; border: 1px solid var(--border); font-size: 10.5px; line-height: 1.6; color: var(--muted); }
    .lock-hint b { color: var(--muted-2); font-weight: 600; }
    .lock-error { margin: 0 0 10px; padding: 7px 10px; border-radius: 7px; background: var(--danger-soft); color: #be123c; font-size: 11px; line-height: 1.5; }
    .lock-submit { width: 100%; height: 38px; margin-top: 9px; font-size: 13px; }
    .lock-foot { margin: 16px 0 0; padding-top: 14px; border-top: 1px solid var(--border); font-size: 10.5px; line-height: 1.6; color: var(--muted); text-align: center; }
    .shake { animation: shake .32s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* ---------- 主界面 ---------- */
    .app { display: flex; height: 100vh; overflow: hidden; }
    .side {
      width: 238px; flex: none; display: flex; flex-direction: column;
      background: var(--side); border-right: 1px solid var(--border);
    }
    .side-head { display: flex; align-items: center; gap: 8px; padding: 13px 10px 9px 13px; }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .brand-mark {
      display: grid; place-items: center; width: 24px; height: 24px; flex: none;
      border-radius: 7px; background: var(--accent-soft); color: var(--accent-strong);
    }
    .brand-mark svg { width: 14px; height: 14px; }
    .brand-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .side-search { position: relative; margin: 0 10px 6px; }
    .side-search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; color: var(--muted); pointer-events: none; }
    .side-search input {
      width: 100%; height: 31px; padding: 0 9px 0 28px; border: 1px solid var(--border);
      border-radius: 8px; background: #fff; font-size: 11.5px;
    }
    .side-search input:focus { border-color: #c7cbf5; box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
    .side-search input::placeholder { color: #b3b8ca; }
    .side-scroll { flex: 1; overflow-y: auto; padding: 6px 0 10px; scrollbar-width: thin; scrollbar-color: #dcdfea transparent; }
    .side-scroll::-webkit-scrollbar { width: 7px; }
    .side-scroll::-webkit-scrollbar-thumb { background: #dcdfea; border-radius: 6px; }
    .side-section { margin-bottom: 12px; }
    .section-title {
      display: flex; align-items: center; gap: 4px; padding: 3px 10px 3px 14px;
      font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
    }
    .section-title .sec-add { margin-left: auto; display: grid; place-items: center; width: 19px; height: 19px; border-radius: 5px; color: var(--muted-2); opacity: .5; transition: opacity .12s ease; }
    .section-title .sec-add:hover { opacity: 1; }
    .side-section:hover .sec-add { opacity: 1; }
    .section-title .sec-add svg { width: 12px; height: 12px; }
    .section-title .sec-clear { margin-left: auto; font-size: 9.5px; color: var(--accent); padding: 1px 5px; border-radius: 4px; }
    .section-title .sec-clear:hover { background: var(--accent-soft); }

    .group-row {
      display: flex; align-items: center; gap: 3px; margin: 1px 7px;
      border-radius: 7px; padding: 1px;
    }
    .group-row:hover { background: var(--hover); }
    .group-row.is-active { background: var(--accent-soft); }
    .group-main { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; padding: 5px 7px; text-align: left; border-radius: 6px; }
    .group-dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
    .group-name { flex: 1; min-width: 0; font-size: 11.5px; color: var(--muted-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .group-row.is-active .group-name { color: var(--accent-strong); font-weight: 600; }
    .group-count { font-size: 9.5px; color: var(--muted); background: rgba(255,255,255,.7); border-radius: 999px; padding: 1px 6px; flex: none; }
    .group-edit { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; color: var(--muted); opacity: 0; flex: none; }
    .group-row:hover .group-edit { opacity: 1; }
    .group-edit:hover { background: rgba(0,0,0,.06); color: var(--text); }
    .group-edit svg { width: 12px; height: 12px; }
    .side-empty { padding: 4px 15px; font-size: 10.5px; color: var(--muted); }
    .tag-cloud { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 13px 0; }
    .tag-chip {
      display: inline-flex; align-items: center; gap: 4px; height: 21px; padding: 0 7px;
      border-radius: 6px; border: 1px solid var(--border); background: #fff;
      font-size: 10px; color: var(--muted-2); transition: all .12s ease;
    }
    .tag-chip:hover { border-color: #c7cbf5; color: var(--accent-strong); }
    .tag-chip.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tag-chip .tag-n { opacity: .6; font-size: 9px; }
    .tag-chip.is-active .tag-n { opacity: .8; }

    .side-foot { border-top: 1px solid var(--border); padding: 8px 9px; display: flex; align-items: center; gap: 4px; }
    .side-menu-btn { display: flex; align-items: center; gap: 7px; flex: 1; padding: 5px 7px; border-radius: 6px; font-size: 11px; color: var(--muted-2); }
    .side-menu-btn:hover { background: var(--hover); color: var(--text); }
    .side-menu-btn svg { width: 14px; height: 14px; }
    .enc-badge { display: flex; align-items: center; gap: 3px; font-size: 9px; color: var(--ok); flex: none; }
    .enc-badge svg { width: 11px; height: 11px; }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
    .topbar {
      display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 20px;
      border-bottom: 1px solid var(--border); background: rgba(255,255,255,.75); backdrop-filter: blur(6px); flex: none;
    }
    .top-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .top-title h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .count-pill { font-size: 10px; color: var(--muted); background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; flex: none; }
    .topbar .btn-primary { margin-left: auto; }
    .filter-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; padding: 9px 20px 0; flex: none; }
    .filter-bar .filter-label { font-size: 10.5px; color: var(--muted); margin-right: 2px; }
    .filter-chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-strong); font-size: 10.5px; }
    .filter-chip button { display: grid; place-items: center; width: 14px; height: 14px; border-radius: 3px; color: inherit; opacity: .65; }
    .filter-chip button:hover { opacity: 1; background: rgba(99,102,241,.14); }
    .filter-chip svg { width: 9px; height: 9px; }

    .list-scroll { flex: 1; overflow-y: auto; padding: 16px 20px 40px; scrollbar-width: thin; scrollbar-color: #dcdfea transparent; }
    .list-scroll::-webkit-scrollbar { width: 9px; }
    .list-scroll::-webkit-scrollbar-thumb { background: #dcdfea; border-radius: 6px; }
    .secret-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); gap: 10px; }
    .secret-card {
      position: relative; display: flex; flex-direction: column; gap: 7px;
      padding: 12px 13px 10px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 11px; box-shadow: var(--shadow); cursor: pointer;
      transition: border-color .14s ease, box-shadow .14s ease, transform .14s ease;
    }
    .secret-card:hover { border-color: #c9cdf6; box-shadow: 0 3px 8px rgba(31,36,51,.05), 0 16px 36px -22px rgba(31,36,51,.32); transform: translateY(-1px); }
    .card-top { display: flex; align-items: center; gap: 7px; }
    .card-dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
    .card-name { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-action {
      display: grid; place-items: center; width: 23px; height: 23px; border-radius: 5px;
      color: var(--muted); opacity: 0; flex: none; transition: opacity .12s ease, background .12s ease;
    }
    .secret-card:hover .card-action { opacity: 1; }
    .card-action:hover { background: var(--hover); color: var(--text); }
    .card-action svg { width: 12.5px; height: 12.5px; }
    .card-key { min-height: 15px; font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-value {
      display: flex; align-items: center; gap: 5px; padding: 4px 6px; border-radius: 6px;
      background: #f7f8fd; border: 1px solid #eef0f8; font-size: 11px; color: var(--muted-2);
      white-space: nowrap; overflow: hidden;
    }
    .card-value .val-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; letter-spacing: .04em; }
    .card-value .val-text.is-marked { letter-spacing: .1em; }
    .card-value button { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 4px; color: var(--muted); flex: none; }
    .card-value button:hover { background: #fff; color: var(--accent-strong); }
    .card-value svg { width: 12px; height: 12px; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 3px; min-height: 0; }
    .mini-tag { font-size: 9.5px; color: #5b6478; background: #f1f2f9; border-radius: 4px; padding: 1px 5px; }
    .card-foot { display: flex; align-items: center; gap: 5px; margin-top: 1px; font-size: 9.5px; color: #a6abbe; }
    .card-foot svg { width: 10px; height: 10px; }

    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 86px 20px; color: var(--muted); text-align: center; }
    .empty-state .empty-icon { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 16px; background: var(--accent-soft); color: #9ba3f5; }
    .empty-state .empty-icon svg { width: 26px; height: 26px; }
    .empty-state h2 { margin: 4px 0 0; font-size: 13px; font-weight: 600; color: var(--muted-2); }
    .empty-state p { margin: 0; max-width: 320px; font-size: 11px; line-height: 1.65; }
    .empty-state .btn-primary { margin-top: 8px; }

    /* ---------- 密钥详情 ---------- */
    .modal.detail { max-width: 560px; }
    .detail-text {
      min-height: 30px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px;
      background: #fbfcfe; font-size: 11.5px; line-height: 1.6; color: var(--text); word-break: break-all;
    }
    .detail-text.mono { font-family: "JetBrains Mono", Consolas, monospace; }
    .detail-text.is-empty { color: var(--muted); }
    .detail-inline { display: flex; align-items: center; gap: 4px; }
    .detail-inline .detail-text { flex: 1; min-width: 0; }
    .detail-label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
    .detail-label-row .field-label { margin: 0; }
    .detail-copy {
      display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px;
      border-radius: 6px; font-size: 10.5px; color: var(--accent-strong);
    }
    .detail-copy:hover { background: var(--accent-soft); }
    .detail-copy svg { width: 11px; height: 11px; }
    /* 密钥值可能很长，详情区给足高度并在超出时滚动 */
    .detail-value {
      min-height: 220px; max-height: 46vh; overflow: auto; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: 8px; background: #f7f8fd;
      font-family: "JetBrains Mono", Consolas, monospace; font-size: 11.5px; line-height: 1.75;
      color: var(--text); white-space: pre-wrap; word-break: break-all;
    }

    /* ---------- 浮层 ---------- */
    .overlay {
      position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-start; justify-content: center;
      padding: 8vh 16px 16px; background: rgba(22,26,40,.3); backdrop-filter: blur(3px);
      animation: fade .14s ease;
    }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      width: 100%; max-width: 520px; max-height: 82vh; display: flex; flex-direction: column;
      background: #fff; border-radius: 14px; overflow: hidden;
      box-shadow: 0 28px 70px -24px rgba(22,26,40,.45), 0 2px 8px rgba(22,26,40,.06);
      animation: rise .16s ease;
    }
    @keyframes rise { from { transform: translateY(8px); opacity: .6; } to { transform: translateY(0); opacity: 1; } }
    .modal.small { max-width: 392px; }
    .modal-head { display: flex; align-items: center; gap: 8px; padding: 15px 17px 11px; flex: none; }
    .modal-title { font-size: 13px; font-weight: 700; }
    .modal-head .icon-btn { margin-left: auto; }
    .modal-body { padding: 2px 17px 16px; overflow-y: auto; }
    .modal-foot { display: flex; align-items: center; gap: 8px; padding: 11px 17px 14px; border-top: 1px solid var(--border); flex: none; }
    .modal-foot .spacer { flex: 1; }
    .form-row { margin-bottom: 11px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-error { margin-top: 4px; padding: 6px 9px; border-radius: 6px; background: var(--danger-soft); color: #be123c; font-size: 10.5px; line-height: 1.5; }
    .form-note { margin-top: 5px; font-size: 10px; color: var(--muted); line-height: 1.5; }
    .value-box { position: relative; }
    .value-box .text-area { padding-right: 36px; min-height: 78px; font-family: "JetBrains Mono", Consolas, monospace; font-size: 11.5px; }
    .value-tools { position: absolute; right: 5px; top: 6px; display: flex; gap: 2px; }
    .value-tools button { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; color: var(--muted); }
    .value-tools button:hover { background: var(--hover); color: var(--accent-strong); }
    .value-tools svg { width: 12px; height: 12px; }
    .tag-editor { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-height: 34px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
    .tag-editor:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
    .tag-editor input { flex: 1; min-width: 90px; height: 24px; padding: 0 3px; border: 0; background: transparent; font-size: 11.5px; }
    .editor-tag { display: inline-flex; align-items: center; gap: 3px; height: 21px; padding: 0 5px 0 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent-strong); font-size: 10px; }
    .editor-tag button { display: grid; place-items: center; width: 13px; height: 13px; border-radius: 3px; color: inherit; opacity: .65; }
    .editor-tag button:hover { opacity: 1; background: rgba(99,102,241,.16); }
    .editor-tag svg { width: 8px; height: 8px; }
    .select-trigger {
      display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 9px 0 10px;
      text-align: left; font-size: 12.5px; color: var(--text); cursor: pointer;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .select-trigger:hover { border-color: var(--border-strong); }
    .select-trigger:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
    .select-trigger[aria-expanded="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
    .select-trigger > svg { width: 13px; height: 13px; margin-left: auto; flex: none; color: var(--muted); transition: transform .16s ease, color .16s ease; }
    .select-trigger[aria-expanded="true"] > svg { transform: rotate(180deg); color: var(--accent-strong); }
    .select-dot { width: 8px; height: 8px; border-radius: 3px; flex: none; background: var(--accent); }
    .select-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .popover.is-select { padding: 4px; max-height: 224px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #dcdfea transparent; }
    .popover.is-select::-webkit-scrollbar { width: 7px; }
    .popover.is-select::-webkit-scrollbar-thumb { background: #dcdfea; border-radius: 6px; }
    .select-option { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 6px; font-size: 11.5px; color: var(--text); text-align: left; }
    .select-option:hover { background: var(--hover); }
    .select-option.is-active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
    .select-option .opt-dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
    .select-option .opt-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .select-option .opt-check { display: grid; place-items: center; width: 13px; height: 13px; flex: none; color: var(--accent-strong); }
    .select-option .opt-check svg { width: 13px; height: 13px; }
    .color-row { display: flex; gap: 7px; flex-wrap: wrap; }
    .color-swatch { position: relative; width: 26px; height: 26px; border-radius: 8px; border: 2px solid transparent; transition: transform .12s ease; }
    .color-swatch:hover { transform: scale(1.08); }
    .color-swatch.is-active { border-color: var(--text); }
    .color-swatch.is-active::after { content: ""; position: absolute; inset: 4px; border-radius: 4px; background: rgba(255,255,255,.55); }

    .popover {
      position: fixed; z-index: 80; width: 190px; padding: 5px; background: #fff;
      border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 20px 48px -18px rgba(22,26,40,.4), 0 2px 8px rgba(22,26,40,.06);
    }
    .menu-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 8px; border-radius: 6px; font-size: 11.5px; color: var(--text); text-align: left; }
    .menu-item:hover { background: var(--hover); }
    .menu-item .mi-icon { display: grid; place-items: center; width: 18px; height: 18px; color: var(--muted); flex: none; }
    .menu-item svg { width: 13px; height: 13px; }
    .menu-item .mi-label { flex: 1; min-width: 0; }
    .menu-sep { height: 1px; background: var(--border); margin: 4px 2px; }
    .menu-hint { padding: 6px 8px 4px; font-size: 9.5px; line-height: 1.5; color: var(--muted); }

    .toast {
      position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 100;
      padding: 8px 14px; border-radius: 8px; background: rgba(26,31,46,.92); color: #fff;
      font-size: 11.5px; box-shadow: 0 12px 32px -12px rgba(22,26,40,.55); max-width: 80vw;
      animation: toastIn .18s ease;
    }
    .toast.is-error { background: #9f1239; }
    @keyframes toastIn { from { transform: translateX(-50%) translateY(6px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }

    @media (max-width: 760px) {
      .side { width: 204px; }
      .secret-grid { grid-template-columns: 1fr; }
      .list-scroll { padding: 14px 14px 36px; }
      .topbar { padding: 0 14px; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="lockView" class="lock-view hidden">
    <form id="lockForm" class="lock-card" autocomplete="off">
      <div class="lock-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1.4"/></svg>
      </div>
      <h1 id="lockTitle">解锁密钥库</h1>
      <p id="lockDesc" class="lock-desc"></p>
      <div class="lock-field">
        <div class="pw-wrap">
          <input id="lockPassword" class="text-input" type="password" autocomplete="current-password" spellcheck="false" />
          <button type="button" class="pw-eye" data-eye="lockPassword" data-i18n-title="vault.secret.reveal" title="显示">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>
          </button>
        </div>
      </div>
      <div id="lockConfirmWrap" class="lock-field hidden">
        <div class="pw-wrap">
          <input id="lockConfirm" class="text-input" type="password" autocomplete="new-password" spellcheck="false" data-i18n-placeholder="vault.lock.confirmPlaceholder" placeholder="再次输入密码" />
          <button type="button" class="pw-eye" data-eye="lockConfirm" data-i18n-title="vault.secret.reveal" title="显示">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>
          </button>
        </div>
      </div>
      <div id="lockHint" class="lock-hint hidden">
        <b data-i18n="vault.lock.hintTitle">本地加密</b>
        <span data-i18n="vault.lock.hintBody">密码只在本机校验，用于派生加密密钥。请务必牢记，忘记后无法找回。</span>
      </div>
      <div id="lockError" class="lock-error hidden"></div>
      <button id="lockSubmit" class="btn-primary lock-submit" type="submit">解锁</button>
      <p class="lock-foot" data-i18n="vault.lock.foot">所有配置均以 AES-256-GCM 加密保存在本机</p>
    </form>
  </div>

  <div id="appView" class="app hidden">
    <aside class="side">
      <div class="side-head">
        <div class="brand">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4"/><path d="M11 11l8.5 8.5M16 16l2-2M19 19l2-2"/></svg>
          </span>
          <span class="brand-name" data-i18n="vault.app.name">密钥库</span>
        </div>
        <button id="lockBtn" class="icon-btn" data-i18n-title="vault.menu.lock" title="锁定">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        </button>
      </div>
      <div class="side-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.6-3.6"/></svg>
        <input id="searchInput" data-i18n-placeholder="vault.search.placeholder" placeholder="搜索名称、账号、备注…" autocomplete="off" spellcheck="false" />
      </div>
      <div class="side-scroll">
        <section class="side-section">
          <div class="section-title">
            <span data-i18n="vault.group.title">分组</span>
            <button id="addGroupBtn" class="sec-add" data-i18n-title="vault.group.new" title="新建分组">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
          <div id="groupList"></div>
        </section>
        <section class="side-section">
          <div class="section-title">
            <span data-i18n="vault.tags.title">标签</span>
            <button id="clearTagsBtn" class="sec-clear hidden" data-i18n="vault.tags.clear">清除</button>
          </div>
          <div id="tagList" class="tag-cloud"></div>
          <div id="tagEmpty" class="side-empty" data-i18n="vault.tags.empty">暂无标签</div>
        </section>
      </div>
      <div class="side-foot">
        <button id="menuBtn" class="side-menu-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          <span data-i18n="vault.menu.more">更多</span>
        </button>
        <span class="enc-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6l7-3Z"/><path d="M9 12l2 2 4-4"/></svg>
          <span data-i18n="vault.encrypted">已加密</span>
        </span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="top-title">
          <h1 id="viewTitle">全部密钥</h1>
          <span id="viewCount" class="count-pill"></span>
        </div>
        <button id="addSecretBtn" class="btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span data-i18n="vault.secret.new">新建密钥</span>
        </button>
      </header>
      <div id="filterBar" class="filter-bar hidden"></div>
      <div id="listScroll" class="list-scroll">
        <div id="secretGrid" class="secret-grid"></div>
        <div id="emptyState" class="empty-state hidden">
          <span class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4"/><path d="M11 11l8.5 8.5M16 16l2-2M19 19l2-2"/></svg>
          </span>
          <h2 id="emptyTitle" data-i18n="vault.empty.title">还没有密钥</h2>
          <p id="emptyDesc" data-i18n="vault.empty.desc">把 API Key、密码和配置收进这里，按分组与标签整理。</p>
          <button id="emptyAction" class="btn-primary" data-i18n="vault.secret.new">新建密钥</button>
        </div>
      </div>
    </main>
  </div>

  <div id="entryOverlay" class="overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <span id="entryTitle" class="modal-title" data-i18n="vault.secret.new">新建密钥</span>
        <button type="button" class="icon-btn" data-close="entryOverlay">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <label class="field-label" for="entryName" data-i18n="vault.secret.name">名称</label>
          <input id="entryName" class="text-input" data-i18n-placeholder="vault.secret.namePlaceholder" placeholder="例如 GitHub 部署密钥" autocomplete="off" spellcheck="false" />
        </div>
        <div class="form-grid">
          <div class="form-row">
            <label class="field-label" data-i18n="vault.secret.group">分组</label>
            <button type="button" id="entryGroupTrigger" class="text-input select-trigger" aria-haspopup="listbox" aria-expanded="false">
              <span id="entryGroupDot" class="select-dot"></span>
              <span id="entryGroupLabel" class="select-label"></span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5"/></svg>
            </button>
          </div>
          <div class="form-row">
            <label class="field-label" for="entryKey" data-i18n="vault.secret.key">账号 / Key ID</label>
            <input id="entryKey" class="text-input" data-i18n-placeholder="vault.secret.keyPlaceholder" placeholder="选填" autocomplete="off" spellcheck="false" />
          </div>
        </div>
        <div class="form-row">
          <label class="field-label" for="entryValue" data-i18n="vault.secret.value">密钥值</label>
          <div class="value-box">
            <textarea id="entryValue" class="text-area" data-i18n-placeholder="vault.secret.valuePlaceholder" placeholder="粘贴密钥、密码或配置内容" spellcheck="false"></textarea>
            <div class="value-tools">
              <button type="button" class="icon-btn" id="entryCopy" data-i18n-title="vault.secret.copy" title="复制">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 5H6a1 1 0 0 0-1 1v9"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="form-row">
          <label class="field-label" for="entryNote" data-i18n="vault.secret.note">备注</label>
          <textarea id="entryNote" class="text-area" data-i18n-placeholder="vault.secret.notePlaceholder" placeholder="用途、有效期或轮换说明（选填）" spellcheck="false"></textarea>
        </div>
        <div class="form-row">
          <label class="field-label" data-i18n="vault.secret.tags">标签</label>
          <div class="tag-editor" id="entryTags">
            <input id="entryTagInput" data-i18n-placeholder="vault.secret.tagPlaceholder" placeholder="输入后按回车添加" autocomplete="off" spellcheck="false" />
          </div>
          <div class="form-note" data-i18n="vault.secret.tagHint">标签用于快速筛选，最多 12 个。</div>
        </div>
        <div id="entryError" class="form-error hidden"></div>
      </div>
      <div class="modal-foot">
        <button type="button" id="entryDelete" class="btn-danger hidden" data-i18n="vault.secret.delete">删除</button>
        <span class="spacer"></span>
        <button type="button" class="btn-plain" data-close="entryOverlay" data-i18n="vault.common.cancel">取消</button>
        <button type="button" id="entrySave" class="btn-primary" data-i18n="vault.common.save">保存</button>
      </div>
    </div>
  </div>

  <div id="detailOverlay" class="overlay hidden">
    <div class="modal detail">
      <div class="modal-head">
        <span id="detailDot" class="card-dot"></span>
        <span id="detailTitle" class="modal-title"></span>
        <button type="button" class="icon-btn" data-close="detailOverlay">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-row">
            <span class="field-label" data-i18n="vault.secret.group">分组</span>
            <div id="detailGroup" class="detail-text"></div>
          </div>
          <div class="form-row">
            <span class="field-label" data-i18n="vault.secret.key">账号 / Key ID</span>
            <div class="detail-inline">
              <span id="detailKey" class="detail-text mono"></span>
              <button type="button" class="icon-btn" id="detailKeyCopy" data-i18n-title="vault.secret.copy" title="复制">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 5H6a1 1 0 0 0-1 1v9"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="form-row">
          <div class="detail-label-row">
            <span class="field-label" data-i18n="vault.secret.value">密钥值</span>
            <button type="button" class="detail-copy" id="detailCopy">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 5H6a1 1 0 0 0-1 1v9"/></svg>
              <span data-i18n="vault.secret.copy">复制</span>
            </button>
          </div>
          <div id="detailValue" class="detail-value"></div>
        </div>
        <div class="form-row hidden" id="detailNoteRow">
          <span class="field-label" data-i18n="vault.secret.note">备注</span>
          <div id="detailNote" class="detail-text"></div>
        </div>
        <div class="form-row hidden" id="detailTagsRow">
          <span class="field-label" data-i18n="vault.secret.tags">标签</span>
          <div id="detailTags" class="card-tags"></div>
        </div>
        <div id="detailUpdated" class="form-note"></div>
      </div>
      <div class="modal-foot">
        <span class="spacer"></span>
        <button type="button" class="btn-plain" data-close="detailOverlay" data-i18n="vault.common.close">关闭</button>
        <button type="button" id="detailEdit" class="btn-primary" data-i18n="vault.common.edit">编辑</button>
      </div>
    </div>
  </div>

  <div id="groupOverlay" class="overlay hidden">
    <div class="modal small">
      <div class="modal-head">
        <span id="groupTitle" class="modal-title" data-i18n="vault.group.new">新建分组</span>
        <button type="button" class="icon-btn" data-close="groupOverlay">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <label class="field-label" for="groupName" data-i18n="vault.group.name">分组名称</label>
          <input id="groupName" class="text-input" data-i18n-placeholder="vault.group.namePlaceholder" placeholder="例如 生产环境" autocomplete="off" spellcheck="false" />
        </div>
        <div class="form-row">
          <label class="field-label" data-i18n="vault.group.color">颜色</label>
          <div id="groupColors" class="color-row"></div>
        </div>
        <div id="groupError" class="form-error hidden"></div>
      </div>
      <div class="modal-foot">
        <button type="button" id="groupDelete" class="btn-danger hidden" data-i18n="vault.group.delete">删除分组</button>
        <span class="spacer"></span>
        <button type="button" class="btn-plain" data-close="groupOverlay" data-i18n="vault.common.cancel">取消</button>
        <button type="button" id="groupSave" class="btn-primary" data-i18n="vault.common.save">保存</button>
      </div>
    </div>
  </div>

  <div id="passwordOverlay" class="overlay hidden">
    <div class="modal small">
      <div class="modal-head">
        <span class="modal-title" data-i18n="vault.password.title">修改解锁密码</span>
        <button type="button" class="icon-btn" data-close="passwordOverlay">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <label class="field-label" for="pwOld" data-i18n="vault.password.old">当前密码</label>
          <input id="pwOld" class="text-input" type="password" autocomplete="current-password" spellcheck="false" />
        </div>
        <div class="form-row">
          <label class="field-label" for="pwNew" data-i18n="vault.password.new">新密码</label>
          <input id="pwNew" class="text-input" type="password" autocomplete="new-password" spellcheck="false" />
        </div>
        <div class="form-row">
          <label class="field-label" for="pwConfirm" data-i18n="vault.password.confirm">确认新密码</label>
          <input id="pwConfirm" class="text-input" type="password" autocomplete="new-password" spellcheck="false" />
        </div>
        <div class="form-note" data-i18n="vault.password.hint">修改后会用新密码重新加密全部数据，其他已解锁会话将失效。</div>
        <div id="pwError" class="form-error hidden"></div>
      </div>
      <div class="modal-foot">
        <span class="spacer"></span>
        <button type="button" class="btn-plain" data-close="passwordOverlay" data-i18n="vault.common.cancel">取消</button>
        <button type="button" id="pwSave" class="btn-primary" data-i18n="vault.password.submit">修改密码</button>
      </div>
    </div>
  </div>

  <div id="confirmOverlay" class="overlay hidden">
    <div class="modal small">
      <div class="modal-head"><span id="confirmTitle" class="modal-title"></span></div>
      <div class="modal-body"><p id="confirmBody" class="text-area" style="min-height:0;border:0;padding:0;background:transparent;color:var(--muted-2);font-size:12px;line-height:1.65;"></p></div>
      <div class="modal-foot">
        <span class="spacer"></span>
        <button type="button" class="btn-plain" data-close="confirmOverlay" data-i18n="vault.common.cancel">取消</button>
        <button type="button" id="confirmOk" class="btn-danger"></button>
      </div>
    </div>
  </div>

  <div id="popover" class="popover hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="app.js?v=2"></script>
</body>
</html>
