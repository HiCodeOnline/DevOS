<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>笔记</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: {
      sans: ['Inter', 'PingFang SC', 'Microsoft YaHei', 'system-ui', 'sans-serif'],
      mono: ['JetBrains Mono', 'Cascadia Code', 'Consolas', 'monospace']
    } } } };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/ui.css?v=2" />
  <script src="/assets/app-i18n.js?v=3"></script>
  <script src="/assets/locales/apps/notes.js?v=3"></script>
  <!-- 代码高亮、LaTeX 公式、Mermaid 流程图；加载失败时降级显示源码。 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --side: #f7f6f3;
      --border: #e7e4df;
      --border-strong: #dcd9d3;
      --text: #37352f;
      --muted: #9b9a97;
      --muted-2: #787774;
      --hover: #efedeb;
      --active: #e8e5e1;
      --accent: #d97706;
      --accent-soft: #fef3c7;
      --danger: #e11d48;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
    input, textarea { font: inherit; color: inherit; }
    ::selection { background: #fde68a; }
    .hidden { display: none !important; }
    .app { display: flex; height: 100vh; overflow: hidden; }

    /* ---------- 侧边栏 ---------- */
    .sidebar {
      width: 250px; flex: none; display: flex; flex-direction: column;
      background: var(--side); border-right: 1px solid var(--border);
      transition: width .18s ease, transform .18s ease;
    }
    .app.side-collapsed .sidebar { width: 0; border-right-width: 0; overflow: hidden; }
    .side-head { display: flex; align-items: center; gap: 8px; padding: 12px 10px 8px 12px; }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .brand-icon { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); flex: none; }
    .brand-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon-btn { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; color: var(--muted-2); flex: none; transition: background .12s ease, color .12s ease; }
    .icon-btn:hover { background: var(--hover); color: var(--text); }
    .icon-btn.is-on { color: var(--accent); }
    .icon-btn svg { width: 15px; height: 15px; }

    .side-action {
      display: flex; align-items: center; gap: 8px; width: calc(100% - 16px);
      margin: 2px 8px; padding: 6px 8px; border-radius: 7px;
      color: var(--muted-2); font-size: 12px; text-align: left;
    }
    .side-action:hover { background: var(--hover); color: var(--text); }
    .side-action svg { width: 14px; height: 14px; flex: none; }
    .side-action kbd { margin-left: auto; font-family: inherit; font-size: 10px; color: var(--muted); border: 1px solid var(--border-strong); border-radius: 4px; padding: 0 4px; line-height: 15px; }
    .side-action.new { color: var(--text); font-weight: 500; }

    .side-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 0 10px; scrollbar-width: thin; scrollbar-color: #d6d3d1 transparent; }
    .side-scroll::-webkit-scrollbar { width: 8px; }
    .side-scroll::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 6px; }
    .side-section { margin: 2px 0 10px; }
    .section-title { display: flex; align-items: center; gap: 4px; padding: 2px 8px 2px 14px; font-size: 10.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .section-title button { margin-left: 0; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; color: var(--muted); opacity: 0; }
    .section-actions { margin-left: auto; display: flex; align-items: center; gap: 1px; }
    .side-section:hover .section-title button { opacity: 1; }
    .section-title button:hover { background: var(--hover); color: var(--text); }
    .section-title svg { width: 11px; height: 11px; }

    .tree-node { position: relative; }
    .page-row {
      position: relative; display: flex; align-items: center; gap: 5px;
      min-height: 28px; margin: 1px 6px; padding: 3px 6px 3px calc(6px + var(--depth, 0) * 14px);
      border-radius: 6px; cursor: pointer; color: var(--muted-2); user-select: none;
    }
    .page-row:hover { background: var(--hover); }
    .page-row.is-active { background: var(--active); color: var(--text); font-weight: 500; }
    .page-row.drop-child { background: var(--accent-soft); box-shadow: inset 0 0 0 1px #fcd34d; }
    .page-row.drop-before::before, .page-row.drop-after::after {
      content: ""; position: absolute; left: 6px; right: 6px; height: 2px; border-radius: 2px; background: var(--accent);
    }
    .page-row.drop-before::before { top: -2px; }
    .page-row.drop-after::after { bottom: -2px; }
    .page-row.is-folder .tree-icon svg { color: #b45309; }
    #treeRoot.drop-root { border-radius: 8px; box-shadow: inset 0 0 0 1px var(--border-strong); background: #fbfaf9; }
    .tree-chevron { display: grid; place-items: center; width: 16px; height: 16px; flex: none; border-radius: 4px; color: var(--muted); }
    .tree-chevron:hover { background: rgba(0,0,0,.06); }
    .tree-chevron svg { width: 11px; height: 11px; transition: transform .12s ease; }
    .tree-chevron.is-open svg { transform: rotate(90deg); }
    .tree-chevron.is-empty { visibility: hidden; pointer-events: none; }
    .page-icon { width: 18px; height: 18px; display: grid; place-items: center; font-size: 13px; flex: none; border-radius: 4px; }
    .page-icon svg { width: 14px; height: 14px; color: var(--muted); }
    .page-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
    .row-add { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; color: var(--muted); opacity: 0; flex: none; }
    .page-row:hover .row-add { opacity: 1; }
    .row-add:hover { background: rgba(0,0,0,.07); color: var(--text); }
    .row-add svg { width: 12px; height: 12px; }
    .side-nav { display: flex; align-items: center; gap: 8px; width: calc(100% - 16px); margin: 1px 8px; padding: 6px 8px; border-radius: 7px; color: var(--muted-2); font-size: 12px; text-align: left; }
    .side-nav:hover { background: var(--hover); color: var(--text); }
    .side-nav svg { width: 14px; height: 14px; flex: none; }
    .side-nav .count { margin-left: auto; font-size: 10px; color: var(--muted); }
    .side-empty { padding: 6px 16px; font-size: 11px; color: var(--muted); }
    .side-foot { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-top: 1px solid var(--border); font-size: 10.5px; color: var(--muted); }
    .save-dot { width: 6px; height: 6px; border-radius: 999px; background: #10b981; flex: none; }
    .save-dot.saving { background: #f59e0b; }
    .save-dot.error { background: var(--danger); }
    .mask { position: fixed; inset: 0; background: rgba(15,23,42,.24); z-index: 40; }

    /* ---------- 主区域 ---------- */
    .main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
    .topbar { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; flex: none; border-bottom: 1px solid transparent; }
    .topbar.is-stuck { border-bottom-color: var(--border); }
    .crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; }
    .crumb { display: flex; align-items: center; gap: 5px; max-width: 180px; padding: 3px 6px; border-radius: 5px; color: var(--muted-2); font-size: 11.5px; white-space: nowrap; }
    .crumb:hover { background: var(--hover); color: var(--text); }
    .crumb span { overflow: hidden; text-overflow: ellipsis; }
    .crumb svg { width: 12px; height: 12px; color: var(--muted); flex: none; }
    .crumb-sep { color: var(--muted); font-size: 11px; }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 2px; }
    .save-badge { margin-right: 6px; font-size: 10.5px; color: var(--muted); white-space: nowrap; }

    .page-scroll { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #d6d3d1 transparent; }
    .page-scroll::-webkit-scrollbar { width: 10px; }
    .page-scroll::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 6px; }
    .cover-wrap { position: relative; }
    .cover { height: 180px; width: 100%; background-size: cover; background-position: center; }
    .cover-actions { position: absolute; right: 14px; bottom: 10px; display: flex; gap: 6px; opacity: 0; transition: opacity .15s ease; }
    .cover-wrap:hover .cover-actions { opacity: 1; }
    .pill { padding: 3px 9px; border-radius: 6px; background: rgba(255,255,255,.92); box-shadow: 0 1px 3px rgba(15,23,42,.16); font-size: 10.5px; color: var(--muted-2); }
    .pill:hover { background: #fff; color: var(--text); }
    .page { width: min(760px, 100%); margin: 0 auto; padding: 0 56px 120px 56px; }
    .page-head { display: flex; align-items: flex-end; gap: 8px; padding-top: 26px; min-height: 30px; }
    #iconBtn { width: 54px; height: 54px; border-radius: 10px; font-size: 38px; line-height: 1; display: grid; place-items: center; transition: background .12s ease; }
    #iconBtn:hover { background: var(--hover); }
    #iconBtn.empty { color: #d6d3d1; }
    #iconBtn svg { width: 28px; height: 28px; }
    .ghost-chip { padding: 3px 8px; border-radius: 6px; font-size: 10.5px; color: var(--muted); }
    .ghost-chip:hover { background: var(--hover); color: var(--muted-2); }
    .page-title { width: 100%; margin: 10px 0 2px; padding: 2px 2px; border: 0; outline: 0; background: transparent; font-size: 32px; font-weight: 700; line-height: 1.25; color: var(--text); letter-spacing: -.01em; }
    .page-title::placeholder { color: #d6d3d1; }
    .page-meta { display: flex; gap: 14px; margin-top: 26px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 10.5px; color: var(--muted); }
    .child-pages { margin-top: 28px; }
    .child-title { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .child-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; color: var(--muted-2); }
    .child-row:hover { background: var(--hover); color: var(--text); }
    .child-row .page-icon { width: 18px; height: 18px; font-size: 14px; }
    .child-add { margin-top: 2px; display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 6px; color: var(--muted); font-size: 12px; }
    .child-add:hover { background: var(--hover); color: var(--muted-2); }

    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); }
    .empty-state svg { width: 46px; height: 46px; color: #d6d3d1; }
    .empty-state p { margin: 0; font-size: 12px; }
    .btn-accent { border-radius: 7px; background: var(--accent); color: #fff; padding: 7px 14px; font-size: 12px; font-weight: 500; }
    .btn-accent:hover { background: #b45309; }
    .btn-plain { border-radius: 7px; border: 1px solid var(--border); background: #fff; padding: 6px 12px; font-size: 11.5px; color: var(--muted-2); }
    .btn-plain:hover { background: var(--side); }
    .btn-danger { border-radius: 7px; border: 1px solid #fecdd3; background: #fff; padding: 6px 12px; font-size: 11.5px; color: var(--danger); }
    .btn-danger:hover { background: #fff1f2; }

    /* ---------- 编辑器 ---------- */
    .editor { margin-top: 14px; }
    .block { position: relative; display: flex; align-items: flex-start; padding: 1px 0; }
    .block-side { position: absolute; left: -46px; top: 1px; display: flex; align-items: center; gap: 1px; opacity: 0; transition: opacity .12s ease; }
    .block:hover .block-side { opacity: 1; }
    .block-side button { display: grid; place-items: center; width: 21px; height: 24px; border-radius: 5px; color: var(--muted); }
    .block-side button:hover { background: var(--hover); color: var(--muted-2); }
    .block-side svg { width: 13px; height: 13px; }
    .block-handle { cursor: grab; }
    .block-handle:active { cursor: grabbing; }
    .block.drop-before::before, .block.drop-after::after {
      content: ""; position: absolute; left: 0; right: 0; height: 2px; background: var(--accent); border-radius: 2px;
    }
    .block.drop-before::before { top: -2px; }
    .block.drop-after::after { bottom: -2px; }
    .block-body { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 6px; }
    .block-input {
      flex: 1; min-width: 0; outline: none; font-size: 14px; line-height: 1.65; padding: 2px 0; color: var(--text);
      white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; caret-color: #37352f;
    }
    .block-input:empty::before { content: attr(data-placeholder); color: #cbd5e1; pointer-events: none; }
    .block-input a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
    .block-input code { background: #f1f5f9; border-radius: 3px; padding: 1px 4px; font-family: "JetBrains Mono", Consolas, monospace; font-size: .86em; color: #be123c; }
    .block-input mark { background: #fef08a; }

    .blk-heading1 { font-size: 26px; font-weight: 700; line-height: 1.35; margin-top: 18px; }
    .blk-heading2 { font-size: 20px; font-weight: 600; line-height: 1.4; margin-top: 14px; }
    .blk-heading3 { font-size: 16px; font-weight: 600; line-height: 1.45; margin-top: 10px; }
    .marker { flex: none; width: 20px; text-align: center; color: var(--muted-2); font-size: 14px; line-height: 1.65; padding-top: 2px; user-select: none; }
    .marker.num { width: 24px; font-size: 13px; }
    .blk-todo { display: flex; align-items: flex-start; gap: 7px; flex: 1; min-width: 0; }
    .blk-todo input[type="checkbox"] { margin-top: 7px; width: 15px; height: 15px; border-radius: 3px; flex: none; }
    .blk-todo.is-checked .block-input { color: var(--muted); text-decoration: line-through; }
    .blk-quote { border-left: 3px solid #37352f; padding-left: 12px; font-size: 14px; color: var(--text); }
    .blk-callout { display: flex; gap: 8px; width: 100%; padding: 12px 14px; border-radius: 6px; background: #f7f6f3; }
    .callout-icon { font-size: 16px; line-height: 1.65; flex: none; cursor: pointer; }
    .callout-icon:hover { opacity: .75; }
    .callout-blue { background: #eff6ff; }
    .callout-green { background: #ecfdf5; }
    .callout-yellow { background: #fffbeb; }
    .callout-orange { background: #fff7ed; }
    .callout-red { background: #fff1f2; }
    .callout-purple { background: #f5f3ff; }
    .callout-pink { background: #fdf2f8; }
    .callout-brown { background: #fdf8f3; }
    .callout-gray { background: #f4f4f5; }
    .toggle-arrow { display: grid; place-items: center; width: 18px; height: 24px; flex: none; color: var(--muted-2); }
    .toggle-arrow svg { width: 11px; height: 11px; transition: transform .12s ease; }
    .toggle-arrow.is-open svg { transform: rotate(90deg); }
    .block.is-collapsed .block-input { display: none; }

    .blk-code { position: relative; width: 100%; border-radius: 6px; background: #f7f6f3; padding: 12px 14px; }
    .code-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .code-head .code-lang { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .code-head .code-copy { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 10.5px; color: var(--muted); padding: 2px 6px; border-radius: 5px; }
    .code-head .code-copy:hover { background: var(--hover); color: var(--text); }
    .code-head svg { width: 12px; height: 12px; }
    /* 代码块：textarea 编辑层 + pre 高亮层，字体、行高与内边距严格一致 */
    .code-wrap { position: relative; width: 100%; }
    .code-view {
      position: absolute; inset: 0; margin: 0; padding: 0; overflow: hidden; pointer-events: none;
      font-family: "JetBrains Mono", Consolas, monospace; font-size: 12.5px; line-height: 1.7; color: #334155;
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .code-view code.hljs { display: block; padding: 0 !important; background: transparent !important; font: inherit; white-space: inherit; }
    .code-input {
      position: relative; z-index: 1; display: block; width: 100%; min-height: 2.6em; max-height: 480px;
      padding: 0; margin: 0; border: 0; outline: none; resize: none; background: transparent;
      color: transparent; caret-color: #37352f;
      font-family: "JetBrains Mono", Consolas, monospace; font-size: 12.5px; line-height: 1.7;
      white-space: pre-wrap; overflow-wrap: anywhere; overflow: auto; tab-size: 2;
    }
    .code-input::placeholder { color: #cbd5e1; }
    .code-input::selection { background: rgba(35, 131, 226, .22); }

    /* LaTeX 公式与 Mermaid 流程图 */
    .blk-equation, .blk-diagram { position: relative; width: 100%; border-radius: 6px; }
    .equation-view, .diagram-view { position: relative; padding: 8px 4px; min-height: 30px; cursor: text; overflow-x: auto; }
    .equation-view .katex-display { margin: 0; }
    .diagram-view svg { max-width: 100%; height: auto; }
    .rich-empty { color: #cbd5e1; font-size: 12.5px; padding: 6px 2px; }
    .rich-source { margin: 0; padding: 8px 10px; border-radius: 6px; background: #f7f6f3; font-family: "JetBrains Mono", Consolas, monospace; font-size: 11.5px; line-height: 1.6; color: #475569; white-space: pre-wrap; overflow-x: auto; }
    .rich-error { margin-bottom: 6px; padding: 6px 8px; border-radius: 5px; background: #fef2f2; color: #b91c1c; font-size: 11.5px; line-height: 1.5; word-break: break-word; }
    .rich-actions { display: flex; gap: 6px; margin-top: 2px; opacity: 0; transition: opacity .12s ease; }
    .blk-equation:hover .rich-actions, .blk-diagram:hover .rich-actions, .blk-equation .rich-actions:focus-within { opacity: 1; }
    .rich-actions .pill { display: inline-flex; align-items: center; gap: 4px; }
    .rich-actions svg { width: 12px; height: 12px; }
    .rich-edit { margin-top: 6px; }
    .rich-edit textarea {
      width: 100%; min-height: 62px; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 6px;
      outline: none; resize: vertical; background: #fff;
      font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px; line-height: 1.7; color: #334155;
    }
    .rich-edit textarea:focus { border-color: #c7b299; }
    .rich-hint { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 10.5px; color: var(--muted); }
    .rich-hint .pill { margin-left: auto; }

    .blk-divider { width: 100%; padding: 10px 0; }
    .blk-divider hr { border: 0; border-top: 1px solid var(--border-strong); margin: 0; }
    .blk-image { position: relative; width: 100%; }
    .blk-image img { display: block; max-width: 100%; border-radius: 4px; border: 1px solid var(--border); }
    .image-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; opacity: 0; transition: opacity .15s ease; }
    .blk-image:hover .image-actions { opacity: 1; }
    .image-caption { width: 100%; margin-top: 5px; border: 0; outline: 0; background: transparent; font-size: 11px; color: var(--muted); }
    .blk-media { position: relative; width: 100%; }
    .blk-media video { display: block; width: 100%; max-height: 420px; border-radius: 4px; border: 1px solid var(--border); background: #000; }
    .blk-media audio { display: block; width: 100%; }
    .blk-media .image-actions { position: static; opacity: 1; margin-top: 6px; }
    .folder-view { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
    .folder-card { display: flex; align-items: center; gap: 9px; padding: 11px 12px; border: 1px solid var(--border); border-radius: 8px; background: #fff; text-align: left; color: inherit; }
    .folder-card:hover { border-color: var(--border-strong); background: #fbfaf9; }
    .folder-card .page-icon { width: 22px; height: 22px; font-size: 16px; }
    .folder-card-main { min-width: 0; flex: 1; }
    .folder-card-title { font-size: 12.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .folder-card-sub { font-size: 10.5px; color: var(--muted); }
    .folder-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .folder-empty { padding: 18px 4px; font-size: 11.5px; color: var(--muted); }
    .image-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 28px 16px; border: 1px dashed var(--border-strong); border-radius: 6px; color: var(--muted); background: #fbfaf9; }

    .menu-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 8px; border-radius: 6px; font-size: 12px; color: var(--text); text-align: left; }

    .trash-main { min-width: 0; flex: 1; }

    .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 90; padding: 8px 14px; border-radius: 8px; background: rgba(15,23,42,.9); color: #fff; font-size: 11.5px; box-shadow: 0 10px 30px -10px rgba(15,23,42,.5); max-width: 80vw; }

    .ui-select { position: relative; }

    }
  </style>
</head>

        <span class="modal-title" data-i18n="notes.template.title">选择模板</span>
        <button class="icon-btn modal-close" data-close="templateOverlay" data-i18n-title="notes.common.close" title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="templateGrid" class="tpl-grid"></div>
      </div>
    </div>
  </div>

  <div id="moveOverlay" class="overlay hidden">
    <div class="modal small">
      <div class="modal-head">
        <span class="modal-title" data-i18n="notes.move.title">移动到</span>
        <button class="icon-btn modal-close" data-close="moveOverlay" data-i18n-title="notes.common.close" title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="moveList" class="move-list"></div>
      </div>
    </div>
  </div>

  <div id="confirmOverlay" class="overlay hidden">
    <div class="modal small">
      <div class="modal-head"><span id="confirmTitle" class="modal-title"></span></div>
      <div class="modal-body"><p id="confirmBody" class="dialog-body-text"></p></div>
      <div class="modal-foot">
        <button id="confirmCancel" class="btn-plain" data-i18n="notes.common.cancel">取消</button>
        <button id="confirmOk" class="btn-danger"></button>
      </div>
    </div>
  </div>

  <div id="inputOverlay" class="overlay hidden">
    <div class="modal small">
      <div class="modal-head"><span id="inputTitle" class="modal-title"></span></div>
      <div class="modal-body">
        <input id="inputField" class="input-dialog-input" autocomplete="off" />
        <div id="inputHint" class="dialog-hint"></div>
      </div>
      <div class="modal-foot">
        <button id="inputCancel" class="btn-plain" data-i18n="notes.common.cancel">取消</button>
        <button id="inputOk" class="btn-accent" data-i18n="notes.common.confirm">确定</button>
      </div>
    </div>
  </div>

  <div id="popover" class="popover hidden"></div>
  <div id="toast" class="toast hidden"></div>
  <input type="file" id="imageInput" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp" class="hidden" />
  <input type="file" id="audioInput" accept="audio/*" class="hidden" />
  <input type="file" id="videoInput" accept="video/*" class="hidden" />
  <input type="file" id="fileInput" accept=".pdf,.txt,.md,.csv,.json,.zip,.rar,.7z,.epub,.doc,.docx,.xls,.xlsx,.ppt,.pptx" class="hidden" />
  <input type="file" id="mdInput" accept=".md,.markdown,.txt,text/markdown,text/plain" class="hidden" />

  <script src="common.js?v=4"></script>
  <script src="editor.js?v=4"></script>
  <script src="editing.js?v=4"></script>
  <script src="app.js?v=4"></script>
  <script src="views.js?v=4"></script>
  <script src="rich.js?v=4"></script>
</body>
</html>
