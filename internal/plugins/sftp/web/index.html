<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SFTP 文件</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: {
      sans: ['Inter', 'PingFang SC', 'Microsoft YaHei', 'system-ui', 'sans-serif'],
      mono: ['JetBrains Mono', 'Cascadia Code', 'Consolas', 'monospace']
    } } } };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/ui.css?v=2" />
  <script src="/assets/app-i18n.js?v=2"></script>
  <script src="/assets/locales/apps/sftp.js?v=1"></script>
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.45); border-radius: 999px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .pane-row.is-selected { background: #ecfdf5; }
    .pane-row.is-selected td { color: #065f46; }
    .drop-active { outline: 2px dashed #10b981; outline-offset: -4px; background: #ecfdf5; }
  </style>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-slate-50 font-sans text-slate-700 antialiased">
  <header class="flex h-12 flex-none items-center gap-3 border-b border-slate-200 bg-white/85 px-3">
    <span class="grid h-8 w-8 flex-none place-items-center rounded-lg bg-emerald-50 text-emerald-600">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8Z"/><path d="M8 14h8"/><path d="M13 11l3 3-3 3"/></svg>
    </span>
    <div class="flex flex-none items-center gap-2">
      <select id="profileSelect" class="w-56 rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-[11.5px] outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-100">
        <option value="" data-i18n="sftp.profile.choose">选择连接…</option>
      </select>
      <button id="connectBtn" class="rounded-lg bg-slate-900 px-2.5 py-1.5 text-[11px] font-medium text-white hover:bg-slate-700" data-i18n="sftp.conn.connect">连接</button>
      <span id="connBadge" class="flex items-center gap-1.5 rounded-full bg-slate-100 px-2 py-0.5 text-[10px] text-slate-500">
        <span id="connDot" class="h-1.5 w-1.5 rounded-full bg-slate-300"></span><span id="connText" data-i18n="sftp.conn.idle">未连接</span>
      </span>
    </div>
    <div class="ml-auto flex items-center gap-2">
      <button id="queueBtn" class="flex items-center gap-1.5 rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-[11px] text-slate-600 hover:bg-slate-50">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h7"/></svg>
        <span data-i18n="sftp.queue.title">传输队列</span>
        <span id="queueBadge" class="rounded-full bg-emerald-100 px-1.5 text-[9.5px] font-medium text-emerald-700">0</span>
      </button>
    </div>
  </header>

  <main class="flex min-h-0 flex-1 gap-2 p-2">
    <!-- 本地 -->
    <section class="flex min-w-0 flex-1 flex-col overflow-hidden rounded-xl border border-slate-200 bg-white">
      <div class="flex h-9 flex-none items-center gap-1.5 border-b border-slate-200 bg-slate-50/80 px-2">
        <span class="flex-none text-[11px] font-semibold text-slate-700" data-i18n="sftp.local.title">本地</span>
        <button data-act="local-up" class="rounded p-1 text-slate-400 hover:bg-white hover:text-slate-700" title="上一级" data-i18n-title="sftp.local.upTitle">
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
        <input id="localPath" spellcheck="false" class="h-6 min-w-0 flex-1 rounded-md border border-transparent bg-transparent px-1.5 font-mono text-[10.5px] text-slate-600 outline-none hover:border-slate-200 hover:bg-white focus:border-emerald-400 focus:bg-white" />
        <button data-act="local-refresh" class="rounded p-1 text-slate-400 hover:bg-white hover:text-slate-700" title="刷新" data-i18n-title="sftp.local.refreshTitle">
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
        </button>
        <span class="mx-0.5 h-4 w-px bg-slate-200"></span>
        <button data-act="upload" class="rounded-md bg-emerald-600 px-2 py-1 text-[10.5px] font-medium text-white hover:bg-emerald-500 disabled:opacity-40" title="上传选中项到远程目录" data-i18n-title="sftp.local.uploadTitle" data-i18n="sftp.local.upload">上传 →</button>
      </div>
      <div id="localDrop" class="relative min-h-0 flex-1 overflow-auto">
        <table class="w-full table-fixed text-left text-[11px]">
          <thead class="sticky top-0 z-10 bg-white/95 backdrop-blur">
            <tr class="border-b border-slate-200 text-[9.5px] uppercase tracking-wide text-slate-400">
              <th class="w-8 px-2 py-1.5"></th>
              <th data-sort="local-name" class="cursor-pointer px-1 py-1.5 font-medium hover:text-slate-600" data-i18n="sftp.column.name">名称</th>
              <th data-sort="local-size" class="w-20 cursor-pointer px-1 py-1.5 text-right font-medium hover:text-slate-600" data-i18n="sftp.column.size">大小</th>
              <th data-sort="local-time" class="hidden w-32 cursor-pointer px-1 py-1.5 font-medium hover:text-slate-600 md:table-cell" data-i18n="sftp.column.time">修改时间</th>
              <th class="w-24 px-1 py-1.5 font-medium" data-i18n="sftp.column.mode">权限</th>
            </tr>
          </thead>
          <tbody id="localBody" class="divide-y divide-slate-100"></tbody>
        </table>
        <div id="localEmpty" class="pointer-events-none absolute inset-0 flex flex-col items-center justify-center gap-2 text-slate-400">
          <p class="text-[11px]" data-i18n="sftp.local.loading">正在读取本地目录…</p>
        </div>
      </div>
      <div class="flex h-6 flex-none items-center justify-between border-t border-slate-200 px-2 text-[10px] text-slate-400">
        <span id="localCount">—</span><span id="localSel"></span>
      </div>
    </section>

    <!-- 远程 -->
    <section class="flex min-w-0 flex-1 flex-col overflow-hidden rounded-xl border border-slate-200 bg-white">
      <div class="flex h-9 flex-none items-center gap-1.5 border-b border-slate-200 bg-slate-50/80 px-2">
        <span class="flex-none text-[11px] font-semibold text-slate-700" data-i18n="sftp.remote.title">远程</span>
        <button data-act="remote-up" class="rounded p-1 text-slate-400 hover:bg-white hover:text-slate-700" title="上一级" data-i18n-title="sftp.local.upTitle">
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
        <input id="remotePath" spellcheck="false" placeholder="连接后输入远程路径" data-i18n-placeholder="sftp.remote.placeholder" class="h-6 min-w-0 flex-1 rounded-md border border-transparent bg-transparent px-1.5 font-mono text-[10.5px] text-slate-600 outline-none hover:border-slate-200 hover:bg-white focus:border-emerald-400 focus:bg-white" />
        <button data-act="remote-refresh" class="rounded p-1 text-slate-400 hover:bg-white hover:text-slate-700" title="刷新" data-i18n-title="sftp.local.refreshTitle">
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
        </button>
        <span class="mx-0.5 h-4 w-px bg-slate-200"></span>
        <button data-act="download" class="rounded-md bg-emerald-600 px-2 py-1 text-[10.5px] font-medium text-white hover:bg-emerald-500 disabled:opacity-40" title="下载选中项到本地目录" data-i18n-title="sftp.remote.downloadTitle" data-i18n="sftp.remote.download">← 下载</button>
        <button data-act="mkdir" class="rounded-md border border-slate-200 bg-white px-2 py-1 text-[10.5px] text-slate-600 hover:bg-slate-50 disabled:opacity-40" title="新建文件夹" data-i18n-title="sftp.remote.mkdirTitle" data-i18n="sftp.remote.mkdir">新建</button>
        <button data-act="rename" class="rounded-md border border-slate-200 bg-white px-2 py-1 text-[10.5px] text-slate-600 hover:bg-slate-50 disabled:opacity-40" title="重命名" data-i18n-title="sftp.remote.renameTitle" data-i18n="sftp.remote.rename">重命名</button>
        <button data-act="chmod" class="rounded-md border border-slate-200 bg-white px-2 py-1 text-[10.5px] text-slate-600 hover:bg-slate-50 disabled:opacity-40" title="修改权限" data-i18n-title="sftp.remote.chmodTitle" data-i18n="sftp.remote.chmod">权限</button>
        <button data-act="edit" class="rounded-md border border-slate-200 bg-white px-2 py-1 text-[10.5px] text-slate-600 hover:bg-slate-50 disabled:opacity-40" title="在线编辑" data-i18n-title="sftp.remote.editTitle" data-i18n="sftp.remote.edit">编辑</button>
        <button data-act="delete" class="rounded-md border border-rose-200 bg-rose-50 px-2 py-1 text-[10.5px] text-rose-600 hover:bg-rose-100 disabled:opacity-40" title="删除" data-i18n-title="sftp.remote.deleteTitle" data-i18n="sftp.remote.delete">删除</button>
      </div>
      <div id="remoteDrop" class="relative min-h-0 flex-1 overflow-auto">
        <table class="w-full table-fixed text-left text-[11px]">
          <thead class="sticky top-0 z-10 bg-white/95 backdrop-blur">
            <tr class="border-b border-slate-200 text-[9.5px] uppercase tracking-wide text-slate-400">
              <th class="w-8 px-2 py-1.5"></th>
              <th data-sort="remote-name" class="cursor-pointer px-1 py-1.5 font-medium hover:text-slate-600" data-i18n="sftp.column.name">名称</th>
              <th data-sort="remote-size" class="w-20 cursor-pointer px-1 py-1.5 text-right font-medium hover:text-slate-600" data-i18n="sftp.column.size">大小</th>
              <th data-sort="remote-time" class="hidden w-32 cursor-pointer px-1 py-1.5 font-medium hover:text-slate-600 md:table-cell" data-i18n="sftp.column.time">修改时间</th>
              <th class="w-24 px-1 py-1.5 font-medium" data-i18n="sftp.column.mode">权限</th>
            </tr>
          </thead>
          <tbody id="remoteBody" class="divide-y divide-slate-100"></tbody>
        </table>
        <div id="remoteEmpty" class="pointer-events-none absolute inset-0 flex flex-col items-center justify-center gap-2 text-center text-slate-400">
          <div class="grid h-12 w-12 place-items-center rounded-2xl border border-slate-200 bg-white text-emerald-500 shadow-sm">
            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8Z"/></svg>
          </div>
          <p class="text-[11px]" data-i18n="sftp.remote.choose">选择连接以浏览远程文件</p>
          <p class="text-[10px] text-slate-400" data-i18n="sftp.remote.hint">会话配置与 SSH 终端共享，支持跳板机</p>
        </div>
      </div>
      <div class="flex h-6 flex-none items-center justify-between border-t border-slate-200 px-2 text-[10px] text-slate-400">
        <span id="remoteCount">—</span><span id="remoteSel"></span>
      </div>
    </section>
  </main>

  <!-- 传输队列 -->
  <section id="queue" class="flex-none border-t border-slate-200 bg-white/90">
    <div class="flex h-8 items-center gap-2 px-3">
      <button id="queueToggle" class="flex items-center gap-1.5 text-[11px] font-medium text-slate-600">
        <svg id="queueChevron" class="h-3 w-3 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>
        <span data-i18n="sftp.queue.title">传输队列</span>
      </button>
      <span id="queueSummary" class="text-[10px] text-slate-400" data-i18n="sftp.queue.empty">暂无任务</span>
      <button id="clearQueue" class="ml-auto rounded-md px-2 py-0.5 text-[10px] text-slate-400 hover:bg-slate-100 hover:text-slate-700" data-i18n="sftp.queue.clear">清除已完成</button>
    </div>
    <div id="queueBody" class="max-h-36 overflow-y-auto border-t border-slate-100"></div>
  </section>

  <footer class="flex h-6 flex-none items-center gap-3 border-t border-slate-200 bg-slate-50 px-3 text-[10px] text-slate-400">
    <span id="statusText" data-i18n="sftp.status.ready">就绪</span>
    <span id="statusTarget" class="font-mono"></span>
  </footer>

  <!-- 在线编辑 -->
  <div id="editor" class="fixed inset-0 z-40 hidden bg-slate-900/40 p-6 backdrop-blur-sm">
    <div class="mx-auto flex h-full w-full max-w-4xl flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-2xl">
      <div class="flex flex-none items-center gap-2 border-b border-slate-200 px-4 py-2.5">
        <span class="text-[12px] font-semibold text-slate-800" data-i18n="sftp.editor.title">在线编辑</span>
        <span id="editorPath" class="min-w-0 truncate font-mono text-[10.5px] text-slate-400"></span>
        <span id="editorSize" class="ml-auto flex-none text-[10px] text-slate-400"></span>
        <button id="editorClose" class="rounded-lg p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-700">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <textarea id="editorText" spellcheck="false" class="min-h-0 flex-1 resize-none bg-slate-50 p-3 font-mono text-[11.5px] leading-relaxed text-slate-700 outline-none"></textarea>
      <div class="flex flex-none items-center gap-2 border-t border-slate-200 px-4 py-2">
        <span class="text-[10px] text-slate-400" data-i18n="sftp.editor.note">保存后立即写入远程文件</span>
        <div class="ml-auto flex gap-2">
          <button id="editorCancel" class="rounded-lg border border-slate-200 px-3 py-1.5 text-[11px] text-slate-600 hover:bg-slate-50" data-i18n="sftp.editor.cancel">取消</button>
          <button id="editorSave" class="rounded-lg bg-emerald-600 px-3 py-1.5 text-[11px] font-medium text-white hover:bg-emerald-500" data-i18n="sftp.editor.save">保存</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toasts" class="pointer-events-none fixed bottom-6 left-1/2 z-50 flex -translate-x-1/2 flex-col items-center gap-2"></div>

  <script>
    const API = "/api/apps/sftp";
    const $ = (id) => document.getElementById(id);
    const I18N = window.DevOSAppI18n;
    const t = (key, params) => (I18N ? I18N.t(key, params) : key);

    const state = {
      profiles: [],
      profileId: "",
      connStatus: "idle",
      local: { path: "", entries: [], selected: new Set(), sort: { key: "name", dir: 1 }, loading: false, error: "" },
      remote: { path: "/", entries: [], selected: new Set(), sort: { key: "name", dir: 1 }, loading: false, error: "" },
      jobs: new Map(),
      editing: null,
      queueOpen: true,
    };

    document.title = t("sftp.app.title");

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[ch]));
    }

    function toast(text, tone = "info") {
      const node = document.createElement("div");
      node.className = `rounded-xl ${tone === "error" ? "bg-rose-600" : "bg-slate-900"} px-4 py-2 text-[11px] text-white shadow-lg`;
      node.textContent = text;
      $("toasts").appendChild(node);
      setTimeout(() => {
        node.style.transition = "all .25s ease";
        node.style.opacity = "0";
        node.style.transform = "translateY(6px)";
        setTimeout(() => node.remove(), 260);
      }, 2600);
    }

    async function api(path, options = {}) {
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      const resp = await fetch(API + path, { ...options, headers });
      if (!resp.ok) {
        let message = t("sftp.error.requestFailed", { status: resp.status });
        try {
          const data = await resp.json();
          message = data.message || data.error || message;
        } catch (_) {}
        throw new Error(message);
      }
      if (resp.status === 204) return null;
      return resp.json();
    }

    function setStatus(text) {
      $("statusText").textContent = text;
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " " + t("sftp.size.b");
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " " + t("sftp.size.kb");
      if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + " " + t("sftp.size.mb");
      return (bytes / 1024 / 1024 / 1024).toFixed(2) + " " + t("sftp.size.gb");
    }

    function formatTime(raw) {
      if (!raw) return "";
      return raw.replace("T", " ").slice(0, 16);
    }

    function modeToOctal(mode) {
      if (!mode || mode.length < 10) return "644";
      let out = "";
      for (let i = 1; i < 10; i += 3) {
        let v = 0;
        if (mode[i] === "r") v += 4;
        if (mode[i + 1] === "w") v += 2;
        if (mode[i + 2] === "x") v += 1;
        out += v;
      }
      return out;
    }

    function joinRemote(dir, name) {
      if (!dir || dir === "/") return "/" + name;
      return dir.replace(/\/+$/, "") + "/" + name;
    }

    function parentRemote(p) {
      const parts = String(p || "/").split("/").filter(Boolean);
      parts.pop();
      return parts.length ? "/" + parts.join("/") : "/";
    }

    function joinLocal(dir, name) {
      if (!dir || dir === "drives") return name;
      return dir.replace(/[\\/]+$/, "") + "\\" + name;
    }

    function parentLocal(p) {
      if (!p || p === "drives") return "drives";
      if (/^[A-Za-z]:\\?$/.test(p)) return "drives";
      const parts = p.split(/[\\/]+/).filter(Boolean);
      parts.pop();
      if (!parts.length) return "drives";
      return parts.join("\\") + (parts.length === 1 ? "\\" : "");
    }

    // ---------- 目录读取 ----------
    async function loadLocal(path) {
      state.local.loading = true;
      state.local.error = "";
      renderTable("local");
      renderEmptyState("local");
      try {
        const data = await api(`/local/list?path=${encodeURIComponent(path || "drives")}`);
        state.local.path = data.path;
        state.local.entries = data.entries || [];
        state.local.selected.clear();
        state.local.error = "";
        $("localPath").value = data.path === "drives" ? "" : data.path;
        $("localPath").placeholder = t("sftp.local.placeholder");
        setStatus(t("sftp.local.status", { path: data.path === "drives" ? t("sftp.local.drives") : data.path }));
      } catch (err) {
        state.local.entries = [];
        state.local.selected.clear();
        state.local.error = err.message;
        toast(t("sftp.local.loadFailed", { error: err.message }), "error");
      } finally {
        state.local.loading = false;
        renderTable("local");
        renderEmptyState("local");
      }
    }

    async function loadRemote(path) {
      if (!state.profileId) {
        renderTable("remote");
        renderEmptyState("remote");
        return false;
      }
      state.remote.loading = true;
      state.remote.error = "";
      renderTable("remote");
      renderEmptyState("remote");
      let ok = true;
      try {
        const data = await api(`/list?profile=${encodeURIComponent(state.profileId)}&path=${encodeURIComponent(path || "/")}`);
        state.remote.path = data.path;
        state.remote.entries = (data.entries || []).map((item) => ({
          ...item,
          path: joinRemote(data.path, item.name),
        }));
        state.remote.selected.clear();
        state.remote.error = "";
        $("remotePath").value = data.path;
        setStatus(t("sftp.remote.loaded", { count: state.remote.entries.length }));
      } catch (err) {
        ok = false;
        state.remote.entries = [];
        state.remote.selected.clear();
        state.remote.error = err.message;
        setConnBadge("error");
        toast(t("sftp.remote.loadFailed", { error: err.message }), "error");
      } finally {
        state.remote.loading = false;
        renderTable("remote");
        renderEmptyState("remote");
      }
      return ok;
    }

    function renderEmptyState(pane) {
      const node = $(pane === "local" ? "localEmpty" : "remoteEmpty");
      const st = state[pane];
      if (pane === "remote" && !state.profileId) {
        node.style.display = "flex";
        node.innerHTML = `<p class="text-[11px]">${esc(t("sftp.remote.choose"))}</p>
          <p class="text-[10px] text-slate-400">${esc(t("sftp.remote.hint"))}</p>`;
        return;
      }
      if (st.entries.length) {
        node.style.display = "none";
        node.innerHTML = "";
        return;
      }
      node.style.display = "flex";
      if (st.loading) {
        node.innerHTML = `<p class="text-[11px]">${esc(t(pane === "local" ? "sftp.local.loading" : "sftp.remote.loading"))}</p>`;
        return;
      }
      if (st.error) {
        node.innerHTML = `<p class="max-w-[70%] text-center text-[11px] text-rose-500">${esc(t(pane === "local" ? "sftp.local.loadFailed" : "sftp.remote.loadFailed", { error: st.error }))}</p>`;
        return;
      }
      node.innerHTML = `<p class="text-[11px]">${esc(t(pane === "local" ? "sftp.local.empty" : "sftp.remote.empty"))}</p>`;
    }

    // ---------- 渲染 ----------
    function sortEntries(pane) {
      const { key, dir } = state[pane].sort;
      const list = [...state[pane].entries];
      list.sort((a, b) => {
        if (a.isDir !== b.isDir) return a.isDir ? -1 : 1;
        let left;
        let right;
        if (key === "size") {
          left = a.size;
          right = b.size;
        } else if (key === "time") {
          left = a.modTime || "";
          right = b.modTime || "";
        } else {
          left = (a.name || "").toLowerCase();
          right = (b.name || "").toLowerCase();
        }
        if (left === right) return 0;
        return (left < right ? -1 : 1) * dir;
      });
      return list;
    }

    function rowIcon(item) {
      if (item.isDir) {
        return `<span class="grid h-6 w-6 flex-none place-items-center rounded-md bg-amber-50 text-amber-500"><svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8Z"/></svg></span>`;
      }
      return `<span class="grid h-6 w-6 flex-none place-items-center rounded-md bg-slate-100 text-slate-500"><svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/></svg></span>`;
    }

    function renderTable(pane) {
      const body = $(pane === "local" ? "localBody" : "remoteBody");
      const selected = state[pane].selected;
      const list = sortEntries(pane);

      body.innerHTML = list.map((item) => {
        const full = pane === "local" ? (item.path || item.name) : item.path;
        const on = selected.has(full);
        return `<tr class="pane-row group cursor-default transition hover:bg-emerald-50/50 ${on ? "is-selected" : ""}"
          draggable="${!item.isDir}" data-pane="${pane}" data-full="${esc(full)}" data-dir="${item.isDir}" data-name="${esc(item.name)}" data-size="${item.size}" data-mode="${esc(item.mode || "")}" data-time="${esc(item.modTime || "")}">
          <td class="px-2 py-1"><input type="checkbox" ${on ? "checked" : ""} data-check="${esc(full)}" class="rounded border-slate-300" /></td>
          <td class="px-1 py-1">
            <span class="flex min-w-0 items-center gap-1.5">
              ${rowIcon(item)}
              <span class="truncate ${item.isDir ? "font-medium text-slate-800" : "text-slate-700"}">${esc(item.name)}</span>
            </span>
          </td>
          <td class="px-1 py-1 text-right font-mono text-[10px] text-slate-400">${item.isDir ? "—" : formatSize(item.size)}</td>
          <td class="hidden px-1 py-1 text-[10px] text-slate-400 md:table-cell">${formatTime(item.modTime)}</td>
          <td class="px-1 py-1 font-mono text-[9.5px] text-slate-400">${esc(item.mode || "")}</td>
        </tr>`;
      }).join("");

      if (pane === "local") {
        $("localCount").textContent = list.length ? t("sftp.list.count", { count: list.length }) : "";
        $("localSel").textContent = selected.size ? t("sftp.list.selected", { count: selected.size }) : "";
      } else {
        $("remoteCount").textContent = state.profileId ? t("sftp.list.count", { count: list.length }) : "";
        $("remoteSel").textContent = selected.size ? t("sftp.list.selected", { count: selected.size }) : "";
      }

      body.querySelectorAll("tr[data-full]").forEach((row) => {
        const full = row.dataset.full;
        const isDir = row.dataset.dir === "true";
        const check = row.querySelector("[data-check]");
        check.addEventListener("change", () => toggleSelect(pane, full, check.checked));
        row.addEventListener("click", (event) => {
          if (event.target.closest("input[type=checkbox]")) return;
          toggleSelect(pane, full, true, !(event.ctrlKey || event.metaKey));
        });
        row.addEventListener("dblclick", () => {
          if (isDir) {
            if (pane === "local") loadLocal(full);
            else loadRemote(full);
            return;
          }
          if (pane === "remote") openEditor(full);
        });
        row.addEventListener("dragstart", (event) => {
          const items = dragItems(pane, full);
          event.dataTransfer.effectAllowed = "copy";
          event.dataTransfer.setData("text/plain", JSON.stringify(items));
        });
      });

      updateActions();
    }

    function toggleSelect(pane, full, on, replace) {
      const selected = state[pane].selected;
      if (replace) {
        selected.clear();
        selected.add(full);
      } else if (on) {
        if (selected.has(full)) selected.delete(full);
        else selected.add(full);
      } else {
        selected.delete(full);
      }
      renderTable(pane);
    }

    function dragItems(pane, full) {
      const selected = state[pane].selected;
      const list = sortEntries(pane);
      const targets = selected.has(full) ? list.filter((item) => selected.has(pane === "local" ? (item.path || item.name) : item.path)) : list.filter((item) => (pane === "local" ? (item.path || item.name) : item.path) === full);
      return targets.map((item) => ({
        path: pane === "local" ? (item.path || item.name) : item.path,
        name: item.name,
        isDir: item.isDir,
      }));
    }

    function updateActions() {
      const localSel = state.local.selected.size;
      const remoteSel = state.remote.selected.size;
      document.querySelector('[data-act="upload"]').disabled = localSel === 0 || !state.profileId;
      document.querySelector('[data-act="download"]').disabled = remoteSel === 0 || !state.profileId;
      document.querySelector('[data-act="delete"]').disabled = remoteSel === 0 || !state.profileId;
      document.querySelector('[data-act="rename"]').disabled = remoteSel !== 1 || !state.profileId;
      document.querySelector('[data-act="chmod"]').disabled = remoteSel !== 1 || !state.profileId;
      document.querySelector('[data-act="edit"]').disabled = remoteSel !== 1 || !state.profileId || singleDir("remote");
      document.querySelector('[data-act="mkdir"]').disabled = !state.profileId;
    }

    function singleDir(pane) {
      const list = sortEntries(pane);
      return list.find((item) => (pane === "local" ? (item.path || item.name) : item.path) === [...state[pane].selected][0] && item.isDir);
    }

    function setConnBadge(status) {
      const map = {
        idle: ["bg-slate-300", "sftp.conn.idle"],
        connecting: ["bg-amber-400 animate-pulse", "sftp.conn.connecting"],
        ok: ["bg-emerald-500", "sftp.conn.ok"],
        error: ["bg-rose-500", "sftp.conn.error"],
      };
      const info = map[status] || map.idle;
      state.connStatus = map[status] ? status : "idle";
      $("connDot").className = "h-1.5 w-1.5 rounded-full " + info[0];
      $("connText").textContent = t(info[1]);
      $("statusTarget").textContent = status === "ok" ? state.remote.path : "";
    }

    // ---------- 会话 ----------
    async function loadProfiles() {
      state.profiles = await api("/profiles");
      const select = $("profileSelect");
      select.innerHTML = `<option value="">${esc(t("sftp.profile.choose"))}</option>` + state.profiles.map((p) =>
        `<option value="${esc(p.id)}">${esc(p.name)}（${esc(p.user)}@${esc(p.host)}）</option>`
      ).join("");
      if (!state.profiles.length) {
        toast(t("sftp.toast.profileNone"), "error");
      }
    }

    async function connect(id) {
      state.profileId = id || "";
      state.remote.selected.clear();
      if (!state.profileId) {
        state.remote.entries = [];
        state.remote.error = "";
        renderEmptyState("remote");
        setConnBadge("idle");
        renderTable("remote");
        return;
      }
      const prof = state.profiles.find((p) => p.id === state.profileId);
      setConnBadge("connecting");
      $("profileSelect").value = state.profileId;
      const ok = await loadRemote("/");
      setConnBadge(ok ? "ok" : "error");
      if (ok && prof) setStatus(`${prof.user}@${prof.host}:${prof.port} · SFTP`);
    }

    $("connectBtn").addEventListener("click", () => connect($("profileSelect").value));
    $("profileSelect").addEventListener("change", () => connect($("profileSelect").value));

    // ---------- 工具动作 ----------
    document.querySelectorAll("[data-act]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const act = btn.dataset.act;
        if (act === "local-up") loadLocal(parentLocal(state.local.path));
        if (act === "local-refresh") loadLocal(state.local.path || "drives");
        if (act === "remote-up") loadRemote(parentRemote(state.remote.path));
        if (act === "remote-refresh") loadRemote(state.remote.path);
        if (act === "upload") uploadSelection();
        if (act === "download") downloadSelection();
        if (act === "mkdir") makeRemoteDir();
        if (act === "rename") renameRemote();
        if (act === "chmod") chmodRemote();
        if (act === "edit") openEditor([...state.remote.selected][0]);
        if (act === "delete") deleteRemote();
      });
    });

    document.querySelectorAll("[data-sort]").forEach((th) => {
      th.addEventListener("click", () => {
        const [pane, key] = th.dataset.sort.split("-");
        const sort = state[pane].sort;
        if (sort.key === key) sort.dir *= -1;
        else {
          sort.key = key;
          sort.dir = 1;
        }
        renderTable(pane);
      });
    });

    $("localPath").addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      loadLocal($("localPath").value.trim() || "drives");
    });
    $("remotePath").addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || !state.profileId) return;
      event.preventDefault();
      loadRemote($("remotePath").value.trim() || "/");
    });

    // ---------- 远程操作 ----------
    function currentRemoteDir() {
      return state.remote.path || "/";
    }

    function currentLocalDir() {
      return state.local.path && state.local.path !== "drives" ? state.local.path : "";
    }

    async function makeRemoteDir() {
      if (!state.profileId) return toast(t("sftp.toast.notConnected"), "error");
      const name = prompt(t("sftp.prompt.mkdir"));
      if (!name || !name.trim()) return;
      try {
        await api("/mkdir", {
          method: "POST",
          body: JSON.stringify({ profile: state.profileId, path: joinRemote(currentRemoteDir(), name.trim()) }),
        });
        await loadRemote(currentRemoteDir());
        toast(t("sftp.toast.mkdirDone"));
      } catch (err) {
        toast(t("sftp.toast.mkdirFailed", { error: err.message }), "error");
      }
    }

    async function renameRemote() {
      const from = [...state.remote.selected][0];
      if (!from) return;
      const oldName = from.split("/").filter(Boolean).pop() || from;
      const name = prompt(t("sftp.prompt.rename"), oldName);
      if (!name || !name.trim() || name.trim() === oldName) return;
      const to = joinRemote(parentRemote(from), name.trim());
      try {
        await api("/rename", {
          method: "POST",
          body: JSON.stringify({ profile: state.profileId, from, to }),
        });
        await loadRemote(currentRemoteDir());
        toast(t("sftp.toast.renameDone"));
      } catch (err) {
        toast(t("sftp.toast.renameFailed", { error: err.message }), "error");
      }
    }

    async function chmodRemote() {
      const target = [...state.remote.selected][0];
      if (!target) return;
      const item = sortEntries("remote").find((entry) => entry.path === target);
      const mode = prompt(t("sftp.prompt.chmod"), item ? modeToOctal(item.mode) : "644");
      if (!mode) return;
      if (!/^[0-7]{3,4}$/.test(mode.trim())) {
        toast(t("sftp.toast.chmodInvalid"), "error");
        return;
      }
      try {
        await api("/chmod", {
          method: "POST",
          body: JSON.stringify({ profile: state.profileId, path: target, mode: mode.trim() }),
        });
        await loadRemote(currentRemoteDir());
        toast(t("sftp.toast.chmodDone"));
      } catch (err) {
        toast(t("sftp.toast.chmodFailed", { error: err.message }), "error");
      }
    }

    async function deleteRemote() {
      const paths = [...state.remote.selected];
      if (!paths.length) return;
      if (!confirm(t("sftp.confirm.delete", { count: paths.length }))) return;
      try {
        await api("/remove", {
          method: "POST",
          body: JSON.stringify({ profile: state.profileId, paths, recursive: true }),
        });
        await loadRemote(currentRemoteDir());
        toast(t("sftp.toast.deleted"));
      } catch (err) {
        toast(t("sftp.toast.deleteFailed", { error: err.message }), "error");
      }
    }

    // ---------- 传输 ----------
    async function uploadSelection() {
      const items = dragItems("local", [...state.local.selected][0]);
      if (!items.length) return;
      if (!state.profileId) return toast(t("sftp.toast.notConnected"), "error");
      if (state.local.path === "drives") return toast(t("sftp.toast.needLocalDir"), "error");
      await startTransfer("upload", currentRemoteDir(), items);
    }

    async function downloadSelection() {
      const items = dragItems("remote", [...state.remote.selected][0]);
      if (!items.length) return;
      if (!state.profileId) return toast(t("sftp.toast.notConnected"), "error");
      const dir = currentLocalDir();
      if (!dir) return toast(t("sftp.toast.needDownloadDir"), "error");
      await startTransfer("download", dir, items);
    }

    async function startTransfer(direction, targetDir, items) {
      try {
        const data = await api("/transfer", {
          method: "POST",
          body: JSON.stringify({ profile: state.profileId, direction, targetDir, items }),
        });
        const job = data.job;
        state.jobs.set(job.id, job);
        if (!state.queueOpen) toggleQueue(true);
        renderQueue();
        pollJob(job.id);
        setStatus(direction === "upload" ? t("sftp.status.uploading") : t("sftp.status.downloading"));
      } catch (err) {
        toast(t("sftp.toast.transferCreateFailed", { error: err.message }), "error");
      }
    }

    function pollJob(id) {
      const timer = setInterval(async () => {
        try {
          const job = await api(`/transfer/${encodeURIComponent(id)}`);
          state.jobs.set(id, job);
          renderQueue();
          if (job.status !== "running") {
            clearInterval(timer);
            if (job.status === "done") {
              if (job.direction === "upload") await loadRemote(currentRemoteDir());
              else await loadLocal(state.local.path);
              toast(t("sftp.toast.transferDone", { count: job.doneFiles }));
            } else {
              toast(t("sftp.toast.transferFailed", { error: job.error || t("sftp.error.unknown") }), "error");
            }
          }
        } catch (err) {
          clearInterval(timer);
        }
      }, 600);
    }

    function renderQueue() {
      const jobs = [...state.jobs.values()].sort((a, b) => (a.startedAt < b.startedAt ? 1 : -1));
      const running = jobs.filter((job) => job.status === "running").length;
      $("queueBadge").textContent = String(running);
      $("queueBadge").className = "rounded-full px-1.5 text-[9.5px] font-medium " +
        (running ? "bg-emerald-100 text-emerald-700" : "bg-slate-100 text-slate-500");
      $("queueSummary").textContent = jobs.length
        ? t("sftp.queue.summary", { total: jobs.length, running })
        : t("sftp.queue.empty");

      const body = $("queueBody");
      if (!jobs.length) {
        body.innerHTML = `<div class="px-3 py-4 text-center text-[10.5px] text-slate-400">${esc(t("sftp.queue.hint"))}</div>`;
        return;
      }
      body.innerHTML = jobs.map((job) => {
        const percent = job.totalBytes > 0
          ? Math.min(100, Math.round((job.doneBytes / job.totalBytes) * 100))
          : (job.totalFiles > 0 ? Math.round((job.doneFiles / job.totalFiles) * 100) : 0);
        const tone = job.status === "error" ? "bg-rose-500" : job.status === "done" ? "bg-emerald-500" : "bg-sky-500";
        const label = job.status === "running"
          ? t("sftp.job.transferring")
          : job.status === "done"
            ? t("sftp.job.completed")
            : job.status === "waiting"
              ? t("sftp.job.waiting")
              : job.status === "canceled"
                ? t("sftp.job.canceled")
                : t("sftp.job.failed");
        const labelColor = job.status === "error" ? "text-rose-600" : job.status === "done" ? "text-emerald-600" : "text-sky-600";
        const current = (job.current || "").split(/[\\/]/).filter(Boolean).pop() || t(job.direction === "upload" ? "sftp.job.preparingUpload" : "sftp.job.preparingDownload");
        return `<div class="border-b border-slate-100 px-3 py-1.5 last:border-0">
          <div class="flex items-center gap-2 text-[10px]">
            <span class="flex-none rounded bg-slate-100 px-1.5 py-0.5 text-[9.5px] text-slate-500">${t(job.direction === "upload" ? "sftp.direction.upload" : "sftp.direction.download")}</span>
            <span class="min-w-0 flex-1 truncate text-slate-600" title="${esc(job.current || "")}">${esc(current)}</span>
            <span class="flex-none font-mono text-slate-400">${formatSize(job.doneBytes)} / ${formatSize(job.totalBytes)}</span>
            <span class="flex-none ${labelColor}">${label}</span>
          </div>
          <div class="mt-1 flex items-center gap-2">
            <span class="h-1 flex-1 overflow-hidden rounded-full bg-slate-100"><span class="block h-full rounded-full ${tone} transition-all" style="width:${percent}%"></span></span>
            <span class="flex-none font-mono text-[9.5px] text-slate-400">${percent}%</span>
          </div>
          ${job.status === "error" ? `<div class="mt-1 text-[9.5px] text-rose-500">${esc(job.error || "")}</div>` : ""}
        </div>`;
      }).join("");
    }

    function toggleQueue(open) {
      state.queueOpen = open === undefined ? !state.queueOpen : open;
      $("queueBody").style.display = state.queueOpen ? "block" : "none";
      $("queueChevron").style.transform = state.queueOpen ? "" : "rotate(-90deg)";
    }

    $("queueToggle").addEventListener("click", () => toggleQueue());
    $("clearQueue").addEventListener("click", () => {
      for (const [id, job] of state.jobs) {
        if (job.status !== "running") state.jobs.delete(id);
      }
      renderQueue();
    });

    // ---------- 拖放 ----------
    function wireDrop(pane) {
      const zone = $(pane === "local" ? "localDrop" : "remoteDrop");
      zone.addEventListener("dragover", (event) => {
        event.preventDefault();
        zone.classList.add("drop-active");
      });
      zone.addEventListener("dragleave", () => zone.classList.remove("drop-active"));
      zone.addEventListener("drop", async (event) => {
        event.preventDefault();
        zone.classList.remove("drop-active");
        let items = [];
        try {
          items = JSON.parse(event.dataTransfer.getData("text/plain") || "[]");
        } catch (_) {
          return;
        }
        if (!items.length || !state.profileId) return;
        if (pane === "remote") {
          if (state.local.path === "drives") return toast(t("sftp.toast.needLocalDir"), "error");
          await startTransfer("upload", currentRemoteDir(), items);
          return;
        }
        const dir = currentLocalDir();
        if (!dir) return toast(t("sftp.toast.needDownloadDir"), "error");
        await startTransfer("download", dir, items);
      });
    }
    wireDrop("local");
    wireDrop("remote");

    // ---------- 在线编辑 ----------
    async function openEditor(target) {
      if (!target || !state.profileId) return;
      const item = sortEntries("remote").find((entry) => entry.path === target);
      if (item && item.isDir) return;
      try {
        const data = await api(`/read?profile=${encodeURIComponent(state.profileId)}&path=${encodeURIComponent(target)}`);
        if (data.binary) {
          toast(t("sftp.editor.binary"), "error");
          return;
        }
        state.editing = target;
        $("editorPath").textContent = target;
        $("editorPath").title = target;
        $("editorSize").textContent = formatSize(data.size);
        $("editorText").value = data.content || "";
        $("editor").classList.remove("hidden");
        setTimeout(() => $("editorText").focus(), 30);
      } catch (err) {
        toast(t("sftp.editor.openFailed", { error: err.message }), "error");
      }
    }

    function closeEditor() {
      $("editor").classList.add("hidden");
      state.editing = null;
    }

    $("editorClose").addEventListener("click", closeEditor);
    $("editorCancel").addEventListener("click", closeEditor);
    $("editorSave").addEventListener("click", async () => {
      if (!state.editing) return;
      try {
        await api("/write", {
          method: "POST",
          body: JSON.stringify({ profile: state.profileId, path: state.editing, content: $("editorText").value }),
        });
        toast(t("sftp.editor.saved"));
        closeEditor();
        await loadRemote(currentRemoteDir());
      } catch (err) {
        toast(t("sftp.editor.saveFailed", { error: err.message }), "error");
      }
    });

    // ---------- 快捷键 ----------
    document.addEventListener("keydown", (event) => {
      if (event.key === "F5") {
        event.preventDefault();
        loadLocal(state.local.path || "drives");
        if (state.profileId) loadRemote(currentRemoteDir());
      }
      if (event.key === "F7") {
        event.preventDefault();
        makeRemoteDir();
      }
      if (event.key === "Escape") {
        if (!$("editor").classList.contains("hidden")) closeEditor();
      }
    });

    // ---------- 初始化 ----------
    async function init() {
      try {
        await loadProfiles();
      } catch (err) {
        toast(t("sftp.toast.profileLoadFailed", { error: err.message }), "error");
      }
      try {
        const home = await api("/local/home");
        await loadLocal(home.path || "drives");
      } catch (_) {
        await loadLocal("drives");
      }
      const preset = new URLSearchParams(location.search).get("profile");
      if (preset && state.profiles.some((p) => p.id === preset)) {
        await connect(preset);
      } else {
        renderTable("remote");
        renderTable("local");
      }
      renderQueue();
      toggleQueue(true);
      updateActions();
    }

    init();

    // 跟随桌面外壳切换语言时刷新动态文案。
    if (I18N) {
      document.addEventListener("devos:locale-changed", () => {
        document.title = t("sftp.app.title");
        $("localPath").placeholder = t("sftp.local.placeholder");
        renderTable("local");
        renderTable("remote");
        renderEmptyState("local");
        renderEmptyState("remote");
        renderQueue();
        setConnBadge(state.connStatus);
        if (state.profileId) {
          const prof = state.profiles.find((p) => p.id === state.profileId);
          if (prof) setStatus(`${prof.user}@${prof.host}:${prof.port} · SFTP`);
        } else {
          setStatus(t("sftp.status.ready"));
        }
      });
    }
  </script>
</body>
</html>
