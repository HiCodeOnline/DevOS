// 读取表结构（列/索引/外键），供行编辑与结构编辑使用。
async function loadTableMeta(tab) {
  try {
    const params = new URLSearchParams({
      id: tab.connId,
      database: tab.database || '',
      schema: tab.schema || '',
      table: tab.table,
    });
    tab.meta = await api('/table-structure?' + params.toString());
  } catch (err) {
    tab.meta = null;
    tab.metaError = err.message;
  }
  updateDataToolbar(tab);
}

function primaryKeyColumns(tab) {
  const cols = tab.meta?.columns || [];
  return cols.filter((c) => String(c.key || '').toUpperCase() === 'PRI').map((c) => c.name);
}

function updateDataToolbar(tab) {
  const el = tab.el;
  el.querySelectorAll('.view-btn').forEach((b) => {
    b.className = 'view-btn px-2.5 py-1 text-[10.5px] font-medium ' +
      (tab.view === b.dataset.view ? 'bg-slate-900 text-white' : 'text-slate-500 hover:bg-slate-50');
    if (b.dataset.view === 'structure') b.classList.add('border-l', 'border-slate-200');
  });
  const isData = tab.view === 'data';
  $('.pager', el).style.display = isData ? 'flex' : 'none';
  $('.row-tools', el).style.display = isData ? 'flex' : 'none';
  $('.export-btn', el).style.display = isData ? 'flex' : 'none';
  $('.export-sql-btn', el).style.display = isData ? 'flex' : 'none';
  $('.alter-tools', el).classList.toggle('hidden', isData);
  const conn = findConn(tab.connId);
  const writable = !conn?.readOnly && !!tab.meta;
  const hasPK = primaryKeyColumns(tab).length > 0;
  const selected = tab.selected != null && tab.data?.rows?.[tab.selected];
  $('.add-row-btn', el).disabled = !writable;
  $('.edit-row-btn', el).disabled = !writable || !hasPK || !selected;
  $('.del-row-btn', el).disabled = !writable || !hasPK || !selected;
  $('.import-btn', el).disabled = !writable;
  el.querySelectorAll('.alter-tools button').forEach((b) => { b.disabled = !writable; });
  $('.alter-tools', el).querySelectorAll('button').forEach((b) => b.classList.toggle('opacity-40', !writable));
}

async function loadTableData(tab) {
  const el = tab.el;
  const wrap = $('.grid-wrap', el);
  setStatus(tab, () => tr('db.common.loading'));
  try {
    const params = new URLSearchParams({
      id: tab.connId,
      database: tab.database || '',
      schema: tab.schema || '',
      table: tab.table,
      page: String(tab.page),
      pageSize: String(tab.pageSize),
    });
    if (tab.sort) {
      params.set('sort', tab.sort);
      params.set('dir', tab.dir);
    }
    const res = await api('/table-data?' + params.toString());
    tab.data = res;
    tab.selected = null;
    wrap.innerHTML = renderGrid(res.columns, res.rows, { sortable: true, sort: tab.sort, dir: tab.dir, selectable: !connReadOnly(tab.connId) });
    bindSortHeaders(tab);
    updateDataToolbar(tab);
    const pages = res.total >= 0 ? Math.max(1, Math.ceil(res.total / tab.pageSize)) : '?';
    $('.page-label', el).textContent = `${tab.page} / ${pages}`;
    setStatus(tab, () => tr('db.data.status', {
      total: res.total >= 0 ? res.total : tr('db.common.unknown'),
      rows: res.rowCount,
      ms: res.durationMs,
    }) + (res.total >= 0
      ? ' · ' + tr('db.data.range', { from: (tab.page - 1) * tab.pageSize + 1, to: (tab.page - 1) * tab.pageSize + res.rowCount })
      : ''));
  } catch (err) {
    tab.data = null;
    wrap.innerHTML = `<div class="m-3 rounded-lg border border-rose-200 bg-rose-50 p-3 text-[11px] text-rose-600 whitespace-pre-wrap">${esc(err.message)}</div>`;
    setStatus(tab, () => tr('db.common.loadFailedShort'));
  }
}

function bindSortHeaders(tab) {
  tab.el.querySelectorAll('.grid-table th[data-col]').forEach((th) => {
    th.classList.add('cursor-pointer');
    th.onclick = () => {
      const col = th.dataset.col;
      if (tab.sort === col) tab.dir = tab.dir === 'asc' ? 'desc' : 'asc';
      else { tab.sort = col; tab.dir = 'asc'; }
      tab.page = 1;
      loadTableData(tab);
    };
  });
}

function structureColumns() {
  return [
    tr('db.grid.field'),
    tr('db.grid.type'),
    tr('db.grid.nullable'),
    tr('db.grid.key'),
    tr('db.grid.default'),
    tr('db.grid.extra'),
    tr('db.grid.comment'),
  ];
}

async function loadStructure(tab) {
  const el = tab.el;
  const wrap = $('.grid-wrap', el);
  setStatus(tab, () => tr('db.common.loading'));
  try {
    const params = new URLSearchParams({
      id: tab.connId,
      database: tab.database || '',
      schema: tab.schema || '',
      table: tab.table,
    });
    const res = await api('/table-structure?' + params.toString());
    tab.meta = res;
    tab.structure = res.columns || [];
    const rows = (res.columns || []).map((c) => [c.name, c.type, c.nullable, c.key || '', c.default || '', c.extra || '', c.comment || '']);
    let html = renderGrid(structureColumns(), rows, {});
    const idx = res.indexes || [];
    if (idx.length) {
      html += `<div class="border-t border-slate-200 bg-slate-50 px-3 py-2 text-[10.5px] font-semibold text-slate-500">${esc(tr('db.structure.indexes'))}</div>`;
      html += renderGrid([tr('db.structure.indexName'), tr('db.structure.indexCols'), tr('db.structure.indexKind')],
        idx.map((i) => [i.name, (i.columns || []).join(', '), i.primary ? tr('db.structure.primary') : i.unique ? tr('db.structure.unique') : tr('db.structure.normal')]), {});
    }
    const fks = res.foreignKeys || [];
    if (fks.length) {
      html += `<div class="border-t border-slate-200 bg-slate-50 px-3 py-2 text-[10.5px] font-semibold text-slate-500">${esc(tr('db.structure.fks'))}</div>`;
      html += renderGrid([tr('db.structure.fkName'), tr('db.structure.fkCols'), tr('db.structure.fkRef')],
        fks.map((f) => [f.name, (f.columns || []).join(', '), `${f.refTable}(${(f.refColumns || []).join(', ')})`]), {});
    }
    wrap.innerHTML = html;
    setStatus(tab, () => tr('db.structure.status', { count: rows.length }));
  } catch (err) {
    tab.structure = null;
    wrap.innerHTML = `<div class="m-3 rounded-lg border border-rose-200 bg-rose-50 p-3 text-[11px] text-rose-600 whitespace-pre-wrap">${esc(err.message)}</div>`;
    setStatus(tab, () => tr('db.common.loadFailedShort'));
  }
}

/* ---------- 行编辑 ---------- */
let rowCtx = null;

function openRowEditor(tab, mode) {
  if (!tab.meta?.columns?.length) { toast(tr('db.data.needStructure'), 'err'); return; }
  const sel = tab.data?.rows?.[tab.selected];
  if (mode === 'update' && !sel) { toast(tr('db.rows.selectFirst'), 'err'); return; }
  if (mode === 'update' && primaryKeyColumns(tab).length === 0) { toast(tr('db.rows.needPk'), 'err'); return; }
  const columns = tab.meta.columns;
  const idxOf = new Map((tab.data?.columns || []).map((name, i) => [name, i]));
  rowCtx = { tab, mode };
  $('#rowTitle').textContent = mode === 'insert' ? tr('db.rows.insertTitle', { table: tab.table }) : tr('db.rows.editTitle', { table: tab.table });
  $('#rowBadge').innerHTML = dbBadge(typeOf(findConn(tab.connId)), 'lg');
  $('#rowError').textContent = '';
  $('#rowFields').innerHTML = columns.map((col) => {
    const pos = idxOf.get(col.name);
    const raw = sel && pos != null ? sel[pos] : null;
    const nullable = String(col.nullable || '').toUpperCase() !== 'NO';
    const isNull = raw === null;
    const value = raw === null || raw === undefined ? '' : String(raw);
    const mono = col.name.replace(/[^\w]/g, '_');
    return `<div class="editor-field">
      <label title="${esc(col.type || '')}">${esc(col.name)}${col.key === 'PRI' ? ' <span class="text-emerald-600">*</span>' : ''}</label>
      <input type="text" data-col="${esc(col.name)}" data-mono="${esc(mono)}" value="${esc(value)}" spellcheck="false" ${isNull ? 'disabled' : ''} />
      ${nullable ? `<label class="flex items-center gap-1 text-[10px] text-slate-400"><input type="checkbox" class="null-toggle accent-emerald-500" data-mono="${esc(mono)}" ${isNull ? 'checked' : ''} />${esc(tr('db.rows.null'))}</label>` : ''}
    </div>`;
  }).join('');
  $('#rowFields').querySelectorAll('.null-toggle').forEach((cb) => {
    cb.addEventListener('change', () => {
      const input = $('#rowFields').querySelector(`input[data-mono="${cb.dataset.mono}"]`);
      if (!input) return;
      input.disabled = cb.checked;
      if (cb.checked) input.value = '';
    });
  });
  $('#rowModal').classList.remove('hidden');
}

function closeRowModal() {
  $('#rowModal').classList.add('hidden');
  rowCtx = null;
}

function collectRowValues() {
  const values = {};
  const nulls = new Set();
  $('#rowFields').querySelectorAll('.null-toggle').forEach((cb) => { if (cb.checked) nulls.add(cb.dataset.mono); });
  $('#rowFields').querySelectorAll('input[data-col]').forEach((input) => {
    if (nulls.has(input.dataset.mono)) values[input.dataset.col] = null;
    else values[input.dataset.col] = input.value;
  });
  return values;
}

async function submitRow() {
  if (!rowCtx) return;
  const { tab, mode } = rowCtx;
  const values = collectRowValues();
  $('#rowError').textContent = '';
  try {
    if (mode === 'insert') {
      const res = await api('/table-rows', {
        method: 'POST',
        body: JSON.stringify({ id: tab.connId, database: tab.database, schema: tab.schema, table: tab.table, action: 'insert', values }),
      });
      toast(tr('db.rows.inserted', { count: res.inserted || 1 }));
    } else {
      const sel = tab.data.rows[tab.selected];
      const idxOf = new Map(tab.data.columns.map((name, i) => [name, i]));
      const pk = {};
      primaryKeyColumns(tab).forEach((col) => {
        const pos = idxOf.get(col);
        if (pos != null) pk[col] = sel[pos];
      });
      await api('/table-rows', {
        method: 'POST',
        body: JSON.stringify({ id: tab.connId, database: tab.database, schema: tab.schema, table: tab.table, action: 'update', pk, values }),
      });
      toast(tr('db.rows.updated'));
    }
    closeRowModal();
    await loadTableData(tab);
    if (tab.view === 'structure') loadStructure(tab);
  } catch (err) {
    $('#rowError').textContent = err.message;
  }
}

async function deleteSelectedRow(tab) {
  const sel = tab.data?.rows?.[tab.selected];
  if (!sel) { toast(tr('db.rows.selectFirst'), 'err'); return; }
  const pkCols = primaryKeyColumns(tab);
  if (!pkCols.length) { toast(tr('db.rows.needPk'), 'err'); return; }
  if (!window.confirm(tr('db.rows.deleteConfirm', { table: tab.table }))) return;
  const idxOf = new Map(tab.data.columns.map((name, i) => [name, i]));
  const pk = {};
  pkCols.forEach((col) => {
    const pos = idxOf.get(col);
    if (pos != null) pk[col] = sel[pos];
  });
  try {
    const res = await api('/table-rows', {
      method: 'POST',
      body: JSON.stringify({ id: tab.connId, database: tab.database, schema: tab.schema, table: tab.table, action: 'delete', pk }),
    });
    toast(tr('db.rows.deleted', { count: res.affected || 0 }));
    await loadTableData(tab);
  } catch (err) {
    toast(err.message, 'err');
  }
}

/* ---------- 表结构变更 ---------- */
let alterCtx = null;

function openAlterModal(tab, op) {
  if (!tab.meta?.columns?.length) { toast(tr('db.data.needStructure'), 'err'); return; }
  alterCtx = { tab };
  $('#alterOp').value = op;
  $('#alterName').value = '';
  $('#alterNewName').value = '';
  $('#alterType').value = '';
  $('#alterDefault').value = '';
  $('#alterColumns').value = '';
  $('#alterNotNull').checked = false;
  $('#alterUnique').checked = false;
  $('#alterPreview').classList.add('hidden');
  $('#alterPreview').textContent = '';
  $('#alterError').textContent = '';
  $('#alterTitle').textContent = tr('db.alter.title') + ' · ' + tab.table;
  syncAlterFields();
  $('#alterModal').classList.remove('hidden');
}

function syncAlterFields() {
  const op = $('#alterOp').value;
  $('#alterName').disabled = false;
  $('#alterNewName').disabled = op !== 'rename';
  $('#alterType').disabled = !(op === 'add' || op === 'modify');
  $('#alterDefault').disabled = op !== 'add';
  $('#alterNotNull').disabled = !(op === 'add' || op === 'modify');
  $('#alterUnique').disabled = op !== 'addIndex';
  $('#alterColumns').disabled = op !== 'addIndex';
  $('#alterColsWrap').style.display = op === 'addIndex' ? 'flex' : 'none';
}

function collectAlterOp() {
  const op = $('#alterOp').value;
  const columns = $('#alterColumns').value.split(',').map((s) => s.trim()).filter(Boolean);
  return {
    kind: op,
    name: $('#alterName').value.trim(),
    newName: $('#alterNewName').value.trim(),
    type: $('#alterType').value.trim(),
    default: $('#alterDefault').value.trim(),
    notNull: $('#alterNotNull').checked,
    unique: $('#alterUnique').checked,
    columns,
  };
}

async function runAlter(preview) {
  if (!alterCtx) return;
  const tab = alterCtx.tab;
  $('#alterError').textContent = '';
  const body = {
    id: tab.connId,
    database: tab.database,
    schema: tab.schema,
    table: tab.table,
    ops: [collectAlterOp()],
    preview,
  };
  try {
    const res = await api('/table-alter', { method: 'POST', body: JSON.stringify(body) });
    if (preview) {
      $('#alterPreview').textContent = (res.statements || []).join('\n');
      $('#alterPreview').classList.remove('hidden');
      return;
    }
    const failed = (res.results || []).find((r) => r.error);
    if (failed) {
      $('#alterError').textContent = failed.error;
      return;
    }
    toast(tr('db.alter.done'));
    $('#alterModal').classList.add('hidden');
    alterCtx = null;
    await loadTableMeta(tab);
    if (tab.view === 'structure') loadStructure(tab);
    else loadTableData(tab);
  } catch (err) {
    $('#alterError').textContent = err.message;
  }
}

/* ---------- 导入 / 导出 ---------- */
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let quoted = false;
  const src = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    if (quoted) {
      if (ch === '"') {
        if (src[i + 1] === '"') { field += '"'; i++; }
        else quoted = false;
      } else {
        field += ch;
      }
      continue;
    }
    if (ch === '"') { quoted = true; continue; }
    if (ch === ',') { row.push(field); field = ''; continue; }
    if (ch === '\r') continue;
    if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; continue; }
    field += ch;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter((r) => r.length > 1 || (r[0] || '').trim() !== '');
}

async function importCSV(tab, file) {
  const text = await file.text();
  const matrix = parseCSV(text);
  if (matrix.length < 2) throw new Error(tr('db.import.empty'));
  const header = matrix[0].map((h) => h.trim());
  const colNames = (tab.meta?.columns || []).map((c) => c.name);
  const lower = new Map(colNames.map((n) => [n.toLowerCase(), n]));
  const mapped = header.map((h) => lower.get(h.toLowerCase()) || null);
  const useHeader = mapped.filter(Boolean).length >= Math.min(header.length, colNames.length) && mapped.some(Boolean);
  const columns = useHeader ? mapped.filter(Boolean) : colNames;
  const dataRows = useHeader ? matrix.slice(1) : matrix;
  const rows = dataRows.map((cells) => {
    const item = {};
    columns.forEach((col, i) => {
      if (!useHeader) { item[col] = cells[i] ?? null; return; }
      const hIdx = mapped.indexOf(col);
      const v = hIdx >= 0 ? cells[hIdx] : null;
      item[col] = v === '' ? null : v;
    });
    return item;
  });
  let inserted = 0;
  for (let i = 0; i < rows.length; i += 200) {
    const chunk = rows.slice(i, i + 200);
    const res = await api('/table-rows', {
      method: 'POST',
      body: JSON.stringify({ id: tab.connId, database: tab.database, schema: tab.schema, table: tab.table, action: 'insert', columns, rows: chunk }),
    });
    inserted += res.inserted || chunk.length;
  }
  return inserted;
}

function exportSQL(tab) {
  if (!tab.table) { toast(tr('db.export.failed', { error: tr('db.data.exportSqlNeedTable') }), 'err'); return; }
  toast(tr('db.export.exporting'));
  fetch(API + '/export', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: tab.connId, database: tab.database, schema: tab.schema, table: tab.table, format: 'sql' }),
  }).then(async (res) => {
    if (!res.ok) {
      let msg = 'HTTP ' + res.status;
      try { const j = await res.json(); if (j.error) msg = j.error; } catch {}
      throw new Error(msg);
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = tab.table + '.sql';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    toast(tr('db.export.done'));
  }).catch((err) => toast(tr('db.export.failed', { error: err.message }), 'err'));
}

/* ---------- 结果表格 ---------- */
function renderGrid(columns, rows, opts = {}) {
  if (!columns || !columns.length) {
    return `<div class="p-8 text-center text-[11px] text-slate-400">${esc(tr('db.grid.empty'))}</div>`;
  }
  const head = columns.map((c) => {
    let arrow = '';
    if (opts.sortable && opts.sort === c) arrow = opts.dir === 'desc' ? ' ↓' : ' ↑';
    return `<th ${opts.sortable ? `data-col="${esc(c)}"` : ''}>${esc(c)}${arrow}</th>`;
  }).join('');
  const body = rows.map((row, ri) => `<tr class="${opts.selectable ? 'selectable' : ''}${opts.selected === ri ? ' row-selected' : ''}" data-row="${ri}">${row.map((v) => cellHtml(v)).join('')}</tr>`).join('');
  return `<table class="grid-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function cellHtml(v) {
  if (v === null || v === undefined) return `<td class="null">NULL</td>`;
  let str;
  if (typeof v === 'object') {
    try { str = JSON.stringify(v); } catch { str = String(v); }
  } else {
    str = String(v);
  }
  const cls = typeof v === 'number' ? 'num' : '';
  const display = str.length > 500 ? str.slice(0, 500) + '…' : str;
  return `<td class="${cls}" title="${esc(str)}">${esc(display)}</td>`;
}

function copyResult(tab) {
  let columns = [];
  let rows = [];
  if (tab.type === 'query' && tab.result && tab.result.kind === 'rows') {
    columns = tab.result.columns;
    rows = tab.result.rows;
  } else if (tab.type === 'data' && tab.view === 'data' && tab.data) {
    columns = tab.data.columns;
    rows = tab.data.rows;
  } else if (tab.type === 'data' && tab.structure) {
    columns = structureColumns();
    rows = tab.structure.map((c) => [c.name, c.type, c.nullable, c.key || '', c.default || '', c.extra || '', c.comment || '']);
  }
  if (!columns.length) { toast(tr('db.common.noResult')); return; }
  const text = [columns.join('\t'), ...rows.map((r) => r.map((v) => v === null ? 'NULL' : String(v)).join('\t'))].join('\n');
  navigator.clipboard.writeText(text)
    .then(() => toast(tr('db.data.copiedRows', { count: rows.length })))
    .catch(() => toast(tr('db.common.copyFailed'), 'err'));
}

async function exportCSV(tab) {
  const body = { id: tab.connId, database: tab.database };
  if (tab.type === 'data') {
    body.schema = tab.schema;
    body.table = tab.table;

      body: JSON.stringify(body),
    });

      try { const j = await res.json(); if (j.error) msg = j.error; } catch {}
      throw new Error(msg);
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (tab.type === 'data' ? tab.table : 'query') + '.csv';
    document.body.appendChild(a);
    a.click();

    setTimeout(() => URL.revokeObjectURL(url), 3000);

    toast(tr('db.export.failed', { error: err.message }), 'err');
  }
}

/* ---------- 连接编辑 ---------- */
let editingDriver = 'mysql';
let driverQuery = '';

// 匹配数据库类型：名称、ID 与分组名都参与搜索（忽略大小写）。
function driverMatch(t, q) {
  if (t.name.toLowerCase().includes(q) || t.id.toLowerCase().includes(q)) return true;
  return driverGroupLabel(t.group).toLowerCase().includes(q);
}

// 可键盘操作的候选项（跳过「待支持」的禁用项）。
function driverItems() {
  return [...$('#fDriverList').querySelectorAll('[data-driver]:not(.is-disabled)')];
}

function focusDriverItem(delta) {
  const items = driverItems();
  if (!items.length) return;
  const idx = items.indexOf(document.activeElement);
  const next = idx < 0
    ? (delta > 0 ? 0 : items.length - 1)
    : (idx + delta + items.length) % items.length;
  items[next].focus();
}

// 按搜索词重绘类型列表。
function renderDriverList() {
  const list = $('#fDriverList');
  const q = driverQuery.trim().toLowerCase();
  const matched = q ? TYPES.filter((t) => driverMatch(t, q)) : TYPES.slice();
  if (!matched.length) {
    list.innerHTML = `<div class="ui-select-empty">${esc(tr('db.type.noMatch'))}</div>`;
    return;
  }
  const groups = new Map();
  for (const t of matched) {
    if (!groups.has(t.group)) groups.set(t.group, []);
    groups.get(t.group).push(t);
  }
  list.innerHTML = [...groups.entries()].map(([group, items]) =>
    `<div class="ui-select-group">${esc(driverGroupLabel(group))}</div>` +
    items.map((t) => `
      <button type="button" class="ui-select-item${isPlanned(t) ? ' is-disabled' : ''}" data-driver="${esc(t.id)}" title="${esc(t.name)}${isPlanned(t) ? ' · ' + esc(tr('db.type.plannedShort')) : ''}">
        ${dbBadge(t, 'lg')}
        <span class="ui-select-name">${esc(t.name)}</span>
        ${isPlanned(t) ? `<span class="ui-select-tag">${esc(tr('db.type.plannedShort'))}</span>` : ''}
        <svg class="ui-select-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4 10-10"/></svg>
      </button>`).join('')
  ).join('');
  list.querySelectorAll('[data-driver]').forEach((item) => {
    item.addEventListener('click', () => {
      setDriver(item.dataset.driver);
      closeDriverMenu();
      $('#fDriverBtn').focus();
    });
  });
  syncDriverLabel();
}

function fillDriverOptions() {
  const menu = $('#fDriverMenu');
  driverQuery = '';
  menu.innerHTML = `
    <div class="ui-select-search-wrap">
      <input id="fDriverSearch" class="ui-select-search" type="search" autocomplete="off" spellcheck="false" placeholder="${esc(tr('db.type.searchPlaceholder'))}" aria-label="${esc(tr('db.type.searchPlaceholder'))}" />
    </div>
    <div id="fDriverList" class="ui-select-list"></div>`;
  const search = $('#fDriverSearch');
  search.addEventListener('input', () => {
    driverQuery = search.value;
    renderDriverList();
  });
  search.addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowDown') {
      ev.preventDefault();
      focusDriverItem(1);
    } else if (ev.key === 'ArrowUp') {
      ev.preventDefault();
      focusDriverItem(-1);
    } else if (ev.key === 'Enter') {
      const items = driverItems();
      if (!items.length) return;
      ev.preventDefault();
      if (items.length === 1) items[0].click();
      else focusDriverItem(1);
    } else if (ev.key === 'Escape') {
      ev.stopPropagation();
      closeDriverMenu();
      $('#fDriverBtn').focus();
    }
  });
  $('#fDriverList').addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowDown') {
      ev.preventDefault();
      focusDriverItem(1);
    } else if (ev.key === 'ArrowUp') {
      ev.preventDefault();
      focusDriverItem(-1);
    } else if (ev.key === 'Escape') {
      ev.stopPropagation();
      closeDriverMenu();
      $('#fDriverBtn').focus();
    }
  });
  renderDriverList();
  applyDriverLabels();
}

// 同步下拉按钮文案与列表选中态。
function syncDriverLabel() {
  const t = TYPE_MAP[editingDriver] || FALLBACK_TYPES[0];
  $('#fDriverLabel').textContent = t.name;
  $('#fDriverMenu').querySelectorAll('[data-driver]').forEach((item) => {
    item.classList.toggle('is-active', item.dataset.driver === editingDriver);
  });
}

function closeDriverMenu() {
  const menu = $('#fDriverMenu');
  if (menu.classList.contains('hidden')) return;
  menu.classList.add('hidden');
  $('#fDriverBtn').setAttribute('aria-expanded', 'false');
}

// 菜单使用 fixed 定位，避免被弹窗的滚动容器裁切。
function openDriverMenu() {
  const menu = $('#fDriverMenu');
  const btn = $('#fDriverBtn');
  const search = $('#fDriverSearch');
  menu.classList.remove('hidden');
  btn.setAttribute('aria-expanded', 'true');
  // 每次打开都回到完整列表，避免沿用上次的过滤词。
  driverQuery = '';
  if (search) search.value = '';
  renderDriverList();
  const rect = btn.getBoundingClientRect();
  const gap = 6;
  const height = Math.min(menu.scrollHeight, 300);
  const up = rect.bottom + gap + height > window.innerHeight && rect.top - gap - height > 0;
  menu.style.width = `${Math.round(rect.width)}px`;
  menu.style.left = `${Math.round(rect.left)}px`;
  if (up) {
    menu.style.top = 'auto';
    menu.style.bottom = `${Math.round(window.innerHeight - rect.top + gap)}px`;
  } else {
    menu.style.bottom = 'auto';
    menu.style.top = `${Math.round(rect.bottom + gap)}px`;
  }
  const active = menu.querySelector('.ui-select-item.is-active');
  if (active) active.scrollIntoView({ block: 'nearest' });
  // 打开即可直接输入搜索词。
  if (search) {
    search.focus({ preventScroll: true });
    search.select();
  }
}

// 同步按当前语言生成的驱动提示、默认库标签与占位符。
function applyDriverLabels() {
  const t = TYPE_MAP[editingDriver] || FALLBACK_TYPES[0];
  $('#fDriverLabel').textContent = t.name;
  $('#driverHint').textContent = isPlanned(t) ? unsupportedMsg(t) : driverHint(t);

    $('#fDatabase').placeholder = (t.id === 'dameng' || t.id === 'dm') ? tr('db.form.dbPlaceholderSchema') : tr('db.form.dbPlaceholderService');

    $('#fDatabase').placeholder = '0';

    $('#fDatabase').placeholder = tr('db.form.databasePlaceholder');
  }
}

function setDriver(driver) {
  const t = TYPE_MAP[driver] || FALLBACK_TYPES[0];
  const prevDefault = TYPE_MAP[editingDriver]?.defaultPort ? String(TYPE_MAP[editingDriver].defaultPort) : '';
  editingDriver = t.id;
  $('#fDriver').value = t.id;
  syncDriverLabel();
  applyDriverLabels();

  const isFile = !!t.file;
  $('#serverFields').classList.toggle('hidden', isFile);
  $('#dbFieldWrap').classList.toggle('hidden', isFile);
  $('#sqliteFields').classList.toggle('hidden', !isFile);
  $('#charsetWrap').classList.toggle('hidden', t.family !== 'mysql');
  $('#sslWrap').classList.toggle('hidden', !['postgres', 'redis', 'mongo'].includes(t.family));

  const portText = t.defaultPort ? String(t.defaultPort) : '';
  $('#fPort').placeholder = portText;
  const current = $('#fPort').value;
  if (!current || current === prevDefault) $('#fPort').value = portText;
}

    toast(tr('db.import.failed', { error: err.message }), 'err');
  }
});
$('#sqlFile').addEventListener('change', (ev) => {
  const file = ev.target.files?.[0];
  const tab = S.tabs.find((t) => String(t.id) === $('#sqlFile').dataset.tab);
  ev.target.value = '';
  if (file && tab) loadSQLFile(tab, file);
});

/* ---------- 启动 ---------- */
(async () => {
  await loadTypes();
  fillDriverOptions();
  await loadConnections();
})();

/* ---------- 语言切换后重绘动态区域 ---------- */
function refreshPaneTexts(tab) {
  const el = tab.el;
  if (!el) return;
  refreshStatus(tab);
  if (tab.type === 'query') {
    $('.exec-btn', el).innerHTML = `${iconSvg('play', 'h-3 w-3')} ${esc(tr('db.query.exec'))} <span class="kbd !text-white/80 !border-white/30 !bg-white/10">Ctrl+Enter</span>`;
    if (tab.fam !== 'redis' && tab.fam !== 'mongo') {
      $('.sql-input', el).placeholder = queryPlaceholder(tab);
      $('.rows-label', el).textContent = tr('db.query.maxRows');
      $('.export-btn', el).innerHTML = `${iconSvg('download', 'h-3 w-3')} ${esc(tr('db.common.exportCsv'))}`;
      $('.copy-btn', el).textContent = tr('db.common.copyResult');
      $('.open-sql-btn', el).innerHTML = `${iconSvg('folder', 'h-3 w-3')} ${esc(tr('db.query.openFile'))}`;
      $('.run-file-btn', el).innerHTML = `${iconSvg('file', 'h-3 w-3')} ${esc(tr('db.query.runScript'))}`;
      $('.explain-btn', el).innerHTML = `${iconSvg('plan', 'h-3 w-3')} ${esc(tr('db.query.explain'))}`;
      const opt = $('.db-select option[value=""]', el);
      if (opt) opt.textContent = tr('db.query.defaultDb');
      if (tab.dbListError) $('.query-hint', el).textContent = tr('db.query.dbListFailed', { error: tab.dbListError });
      else $('.query-hint', el).textContent = queryHint(tab);
      if (tab.script) renderScriptOutput(tab);
      else if (tab.result || tab.error) renderQueryOutput(tab);
    } else {
      $('.copy-btn', el).textContent = tr('db.common.copyResult');
      $('.query-hint', el).textContent = tab.dbListError
        ? tr('db.query.dbListFailed', { error: tab.dbListError })
        : (tab.fam === 'redis' ? tr('db.cmd.redisHint') : tr('db.cmd.mongoHint'));
      const opt = $('.db-select option[value=""]', el);
      if (opt) opt.textContent = tr('db.cmd.selectDb');
    }
    return;
  }
  if (tab.type === 'rkey') {
    $('.refresh-btn', el).title = tr('db.common.refresh');
    $('.copy-btn', el).textContent = tr('db.common.copy');
    $('.del-btn', el).textContent = tr('db.redis.deleteKey');
    if (tab.detail) renderRedisKeyDetail(tab);
    return;
  }
  if (tab.type === 'mongo') {
    $('.filter-input', el).placeholder = tr('db.mongo.filterPlaceholder');
    $('.apply-btn', el).textContent = tr('db.common.apply');
    $('.refresh-btn', el).title = tr('db.common.refresh');
    $('.prev-btn', el).textContent = tr('db.common.prev');
    $('.next-btn', el).textContent = tr('db.common.next');
    $('.copy-btn', el).textContent = tr('db.common.copy');
    el.querySelectorAll('.page-size option').forEach((opt) => {
      opt.textContent = tr('db.mongo.rowsOption', { count: Number(opt.value) });
    });
    if (tab.data) {
      $('.grid-wrap', el).innerHTML = renderGrid(tab.data.columns, tab.data.rows, {});
    }
    return;
  }
  if (tab.type === 'data') {
    el.querySelectorAll('.view-btn').forEach((b) => {
      b.textContent = b.dataset.view === 'structure' ? tr('db.data.tabStructure') : tr('db.data.tabData');
    });
    $('.refresh-btn', el).title = tr('db.common.refresh');
    $('.export-btn', el).innerHTML = `${iconSvg('download', 'h-3 w-3')} ${esc(tr('db.common.exportCsv'))}`;
    $('.copy-btn', el).textContent = tr('db.common.copy');
    $('.export-sql-btn', el).innerHTML = `${iconSvg('file', 'h-3 w-3')} ${esc(tr('db.data.exportSql'))}`;
    $('.import-btn', el).innerHTML = `${iconSvg('upload', 'h-3 w-3')} ${esc(tr('db.data.import'))}`;
    $('.prev-btn', el).textContent = tr('db.common.prev');
    $('.next-btn', el).textContent = tr('db.common.next');
    el.querySelectorAll('.page-size option').forEach((opt) => {
      opt.textContent = tr('db.data.rowsOption', { count: Number(opt.value) });
    });
    el.querySelectorAll('.alter-tools button[data-op]').forEach((b) => {
      const map = { add: 'db.alter.add', modify: 'db.alter.modify', rename: 'db.alter.rename', drop: 'db.alter.drop', addIndex: 'db.alter.addIndex' };
      b.textContent = tr(map[b.dataset.op] || 'db.alter.add');
    });
    if (tab.view === 'structure' && tab.meta) loadStructure(tab);
    else if (tab.view === 'structure' && tab.structure) loadStructure(tab);
    else if (tab.data) {
      $('.grid-wrap', el).innerHTML = renderGrid(tab.data.columns, tab.data.rows, { sortable: true, sort: tab.sort, dir: tab.dir, selectable: !connReadOnly(tab.connId), selected: tab.selected });
      bindSortHeaders(tab);
    }
    updateDataToolbar(tab);
  }
}

function refreshAppTexts() {
  document.title = tr('db.app.title');
  if (AppI18n) AppI18n.apply(document);
  renderConnCount();
  renderTree();
  renderTabs();
  fillDriverOptions();
  applyDriverLabels();
  $('#connTitle').textContent = $('#fId').value ? tr('db.conn.editTitle') : tr('db.conn.newTitle');
  renderConnTestResult();
  for (const tab of S.tabs) refreshPaneTexts(tab);
}

document.addEventListener('devos:locale-changed', (ev) => {
  if (!ev || !ev.detail || !ev.detail.changed) return;
  refreshAppTexts();
});
</script>
