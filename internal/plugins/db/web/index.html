﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="db.app.title">数据库</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: {
      sans: ['Inter', 'PingFang SC', 'Microsoft YaHei', 'system-ui', 'sans-serif'],
      mono: ['JetBrains Mono', 'Cascadia Code', 'Consolas', 'monospace']
    } } } };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/ui.css?v=2" />
  <script src="/assets/app-i18n.js?v=2"></script>
  <script src="/assets/locales/apps/db.js?v=4"></script>
  <script src="/assets/secure-ui.js?v=2"></script>
  <style>
    .pane { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; }
    .pane.hidden { display: none; }
    .modal.hidden { display: none; }
    .modal { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; }
    #tree::-webkit-scrollbar, .grid-wrap::-webkit-scrollbar, .sql-input::-webkit-scrollbar { width: 9px; height: 9px; }
    #tree::-webkit-scrollbar-thumb, .grid-wrap::-webkit-scrollbar-thumb, .sql-input::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
    #tree::-webkit-scrollbar-track, .grid-wrap::-webkit-scrollbar-track { background: transparent; }
    .kbd { border: 1px solid #e2e8f0; border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font-size: 9px; color: #64748b; background: #fff; }
    .grid-table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
    .grid-table th, .grid-table td { border-bottom: 1px solid #e2e8f0; border-right: 1px solid #f1f5f9; padding: 5px 10px; font-size: 11px; white-space: nowrap; }
    .grid-table thead th { position: sticky; top: 0; z-index: 2; background: #f8fafc; text-align: left; font-weight: 600; color: #475569; }
    .grid-table tbody tr:hover td { background: #f8fafc; }
    .grid-table td.null { color: #94a3b8; font-style: italic; }
    .grid-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .tree-row { user-select: none; }
    .tree-row:hover { background: #f1f5f9; }
    .tree-row.active { background: #ecfdf5; }
    .tree-actions { display: none; }
    .tree-row:hover .tree-actions { display: flex; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 自绘下拉：替代原生 select 弹出层，保证与页面其他控件一致 */
    .ui-select-trigger { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; color: #334155; font-size: 12px; line-height: 1.4; text-align: left; transition: border-color .15s ease, box-shadow .15s ease; }
    .ui-select-trigger:hover { border-color: #cbd5e1; }
    .ui-select-trigger[aria-expanded="true"] { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, .14); }
    .ui-select-value { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .ui-select-caret { width: 12px; height: 12px; flex: none; color: #94a3b8; }
    .ui-select-menu { position: fixed; z-index: 80; display: flex; flex-direction: column; max-height: 300px; overflow: hidden; padding: 0; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; box-shadow: 0 24px 50px -22px rgba(15, 23, 42, .4), 0 2px 8px rgba(15, 23, 42, .06); }
    .ui-select-menu.hidden { display: none; }
    .ui-select-search-wrap { flex: none; padding: 6px; border-bottom: 1px solid #e2e8f0; }
    .ui-select-search { width: 100%; padding: 6px 10px; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; font-size: 11.5px; color: #334155; outline: none; transition: border-color .15s ease, box-shadow .15s ease; }
    .ui-select-search::placeholder { color: #94a3b8; }
    .ui-select-search:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, .14); }
    .ui-select-search::-webkit-search-cancel-button { cursor: pointer; }
    .ui-select-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px; }
    .ui-select-list::-webkit-scrollbar { width: 8px; }
    .ui-select-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
    .ui-select-empty { padding: 14px 8px; text-align: center; font-size: 11px; color: #94a3b8; }
    .ui-select-group { padding: 6px 8px 3px; font-size: 10px; font-weight: 600; letter-spacing: .04em; color: #94a3b8; }
    .ui-select-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 8px; font-size: 11.5px; color: #334155; text-align: left; }
    .ui-select-item:hover { background: #f1f5f9; }
    .ui-select-item.is-active { background: #ecfdf5; color: #047857; font-weight: 600; }
    .ui-select-dot { width: 7px; height: 7px; border-radius: 999px; flex: none; }
    .ui-select-name { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .ui-select-check { width: 13px; height: 13px; flex: none; color: #059669; opacity: 0; }
    .ui-select-item.is-active .ui-select-check { opacity: 1; }
    .ui-select-item.is-disabled { opacity: .45; }
    .ui-select-tag { flex: none; border-radius: 999px; padding: 1px 5px; font-size: 9px; background: #f1f5f9; color: #64748b; }

    /* 数据库类型徽标：用品牌色块承载类型缩写，未知类型回退首字母 */
    .db-badge { display: inline-grid; place-items: center; flex: none; width: 18px; height: 18px; border-radius: 5px; border: 1px solid; font-size: 8px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
    .db-badge.lg { width: 24px; height: 24px; border-radius: 7px; font-size: 9.5px; }

    .grid-table tbody tr.row-selected td { background: #ecfdf5 !important; }
    .grid-table tbody tr { cursor: default; }
    .grid-table tbody tr.selectable { cursor: pointer; }

    .editor-field { display: flex; flex-direction: column; gap: 4px; }
    .editor-field > label { font-size: 10.5px; color: #64748b; }
    .editor-field input[type="text"], .editor-field input[type="number"], .editor-field select {
      width: 100%; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff;
      padding: 6px 9px; font-size: 11.5px; color: #334155; outline: none;
    }
    .editor-field input:focus, .editor-field select:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,.14); }
    .result-card { border: 1px solid #e2e8f0; border-radius: 10px; margin: 8px; overflow: hidden; background: #fff; }
    .result-card-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-size: 10.5px; color: #475569; }
  </style>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-slate-50 font-sans text-slate-700 antialiased">
  <header class="flex flex-none items-center gap-2 border-b border-slate-200 bg-white/85 px-3 py-2">
    <span class="grid h-8 w-8 place-items-center rounded-lg bg-emerald-50 text-emerald-600">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/><path d="M4 11.5v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/></svg>
    </span>
    <div class="mr-2 leading-tight">
      <div class="text-[12px] font-semibold text-slate-800" data-i18n="db.app.name">数据库</div>
      <div class="text-[10px] text-slate-400">MySQL · PostgreSQL · SQLite</div>
    </div>
    <button id="newConnBtn" class="rounded-lg bg-slate-900 px-3 py-1.5 text-[11px] font-medium text-white hover:bg-slate-700" data-i18n="db.conn.new">新建连接</button>
    <button id="importBtn" class="rounded-lg border border-slate-200 px-3 py-1.5 text-[11px] text-slate-600 hover:bg-slate-50" data-i18n="db.conn.import">导入连接</button>
    <button id="exportBtn" class="rounded-lg border border-slate-200 px-3 py-1.5 text-[11px] text-slate-600 hover:bg-slate-50" data-i18n="db.conn.export">导出连接</button>
    <input id="importFile" type="file" accept=".json" class="hidden" />
    <span class="ml-auto flex items-center gap-1.5 text-[10px] text-slate-400">
      <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
      <span id="connCount" data-i18n="db.conn.countZero">0 个连接</span>
    </span>
  </header>

  <div class="flex min-h-0 flex-1">
    <aside class="flex w-[276px] flex-none flex-col border-r border-slate-200 bg-white/80">
      <div class="flex-none p-2">
        <div class="relative">
          <svg class="pointer-events-none absolute left-2.5 top-2 h-3.5 w-3.5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="searchInput" placeholder="搜索连接…" data-i18n-placeholder="db.tree.searchPlaceholder" class="w-full rounded-lg border border-slate-200 bg-white py-1.5 pl-8 pr-2 text-[11px] outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-50" />
        </div>
      </div>
      <div id="tree" class="min-h-0 flex-1 overflow-y-auto px-1 pb-3"></div>
    </aside>

    <main class="relative flex min-w-0 flex-1 flex-col">
      <div id="tabbar" class="flex flex-none items-end gap-1 border-b border-slate-200 bg-white/60 px-2 pt-1.5 empty:hidden"></div>
      <div id="panes" class="relative min-h-0 flex-1"></div>
      <div id="emptyState" class="flex min-h-0 flex-1 flex-col items-center justify-center gap-3 text-center">
        <span class="grid h-14 w-14 place-items-center rounded-2xl bg-emerald-50 text-emerald-500">
          <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/><path d="M4 11.5v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/></svg>
        </span>
        <div>
          <p class="text-[13px] font-medium text-slate-600" data-i18n="db.empty.title">选择左侧连接开始使用</p>
          <p class="mt-1 text-[11px] text-slate-400" data-i18n="db.empty.hint">双击表名浏览数据，或在连接上新建查询</p>
        </div>
        <button id="emptyNewBtn" class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-[11px] text-slate-600 hover:bg-slate-50" data-i18n="db.empty.new">新建数据库连接</button>
      </div>
    </main>
  </div>

  <!-- 连接编辑弹窗 -->
  <div id="connModal" class="modal hidden bg-slate-900/30 p-4 backdrop-blur-sm">
    <div class="max-h-[92vh] w-[600px] overflow-y-auto rounded-2xl border border-white/70 bg-white p-5 shadow-2xl">
      <div class="mb-4 flex items-center justify-between">
        <h2 id="connTitle" class="text-sm font-semibold text-slate-900" data-i18n="db.conn.newTitle">新建连接</h2>
        <button id="closeConnModal" class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <form id="connForm" class="space-y-3">
        <input type="hidden" id="fId" />
        <div class="grid grid-cols-3 gap-2">
          <label class="col-span-2 block">
            <span class="mb-1 block text-[10.5px] font-medium text-slate-500" data-i18n="db.form.name">连接名称</span>
            <input id="fName" placeholder="例如：本地 MySQL" data-i18n-placeholder="db.form.namePlaceholder" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-xs outline-none focus:border-emerald-400" />
          </label>
          <label class="block">
            <span class="mb-1 block text-[10.5px] font-medium text-slate-500" data-i18n="db.form.group">分组</span>
            <input id="fGroup" placeholder="未分组" data-i18n-placeholder="db.form.groupPlaceholder" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-xs outline-none focus:border-emerald-400" />
          </label>
        </div>
        <div class="block">
          <span class="mb-1 block text-[10.5px] font-medium text-slate-500" data-i18n="db.form.driver">数据库类型</span>
          <div id="driverSelect">
            <button type="button" id="fDriverBtn" class="ui-select-trigger" aria-haspopup="listbox" aria-expanded="false">
              <span id="fDriverLabel" class="ui-select-value"></span>
              <svg class="ui-select-caret" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>
            </button>
            <input type="hidden" id="fDriver" />
            <div id="fDriverMenu" class="ui-select-menu hidden" role="listbox"></div>
          </div>
          <span id="driverHint" class="mt-1 block text-[10px] text-slate-400"></span>
        </div>

        <div id="serverFields" class="space-y-3">
          <div class="grid grid-cols-3 gap-2">
            <label class="col-span-2 block">
              <span class="mb-1 block text-[10.5px] font-medium text-slate-500" data-i18n="db.form.host">主机</span>
              <input id="fHost" placeholder="127.0.0.1" class="w-full rounded-lg border border-slate-200 px-3 py-2 font-mono text-[11px] outline-none focus:border-emerald-400" />
            </label>
            <label class="block">
              <span class="mb-1 block text-[10.5px] font-medium text-slate-500" data-i18n="db.form.port">端口</span>
              <input id="fPort" type="number" placeholder="3306" class="w-full rounded-lg border border-slate-200 px-3 py-2 font-mono text-[11px] outline-none focus:border-emerald-400" />
            </label>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <label class="block">
              <span class="mb-1 block text-[10.5px] font-medium text-slate-500" data-i18n="db.form.user">用户名</span>
              <input id="fUser" autocomplete="off" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-xs outline-none focus:border-emerald-400" />
            </label>
            <label class="block">
              <span class="mb-1 block text-[10.5px] font-medium text-slate-500" data-i18n="db.form.password">密码</span>
              <input id="fPassword" type="password" autocomplete="new-password" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-xs outline-none focus:border-emerald-400" />
            </label>
          </div>
          <label class="block" id="dbFieldWrap">
            <span id="dbLabelText" class="mb-1 block text-[10.5px] font-medium text-slate-500" data-i18n="db.type.dbLabel.default">默认数据库（可选）</span>
            <input id="fDatabase" placeholder="不填则连接后选择" data-i18n-placeholder="db.form.databasePlaceholder" class="w-full rounded-lg border border-slate-200 px-3 py-2 font-mono text-[11px] outline-none focus:border-emerald-400" />
          </label>
        </div>

        <div id="sqliteFields" class="hidden">
          <label class="block">
            <span class="mb-1 block text-[10.5px] font-medium text-slate-500" data-i18n="db.form.file">数据库文件路径</span>
            <input id="fFile" placeholder="D:\data\demo.db（不存在将自动创建）" data-i18n-placeholder="db.form.filePlaceholder" class="w-full rounded-lg border border-slate-200 px-3 py-2 font-mono text-[11px] outline-none focus:border-emerald-400" />
            <span class="mt-1 block text-[10px] text-slate-400" data-i18n="db.form.fileHint">支持绝对路径；文件不存在时会在首次连接时自动创建。</span>
          </label>
        </div>

        <details class="rounded-lg border border-slate-200 bg-slate-50/60 px-3 py-2">
          <summary class="cursor-pointer text-[11px] font-medium text-slate-600" data-i18n="db.form.advanced">高级选项</summary>
          <div class="mt-2 space-y-2">
            <div class="grid grid-cols-2 gap-2">
              <label id="charsetWrap" class="block">
                <span class="mb-1 block text-[10.5px] font-medium text-slate-500" data-i18n="db.form.charset">字符集</span>
                <input id="fCharset" placeholder="utf8mb4" class="w-full rounded-lg border border-slate-200 px-3 py-1.5 font-mono text-[11px] outline-none focus:border-emerald-400" />
              </label>
              <label id="sslWrap" class="block">
                <span class="mb-1 block text-[10.5px] font-medium text-slate-500" data-i18n="db.form.sslMode">SSL 模式</span>
                <select id="fSSLMode" class="w-full rounded-lg border border-slate-200 bg-white px-2 py-1.5 text-[11px] outline-none focus:border-emerald-400">
                  <option value="disable">disable</option>
                  <option value="require">require</option>
                  <option value="verify-full">verify-full</option>
                </select>
              </label>
            </div>
            <label class="block">
              <span class="mb-1 block text-[10.5px] font-medium text-slate-500" data-i18n="db.form.params">附加参数（k=v&amp;k2=v2）</span>
              <input id="fParams" placeholder="例如 timezone=Local" data-i18n-placeholder="db.form.paramsPlaceholder" class="w-full rounded-lg border border-slate-200 px-3 py-1.5 font-mono text-[11px] outline-none focus:border-emerald-400" />
            </label>
            <label class="flex items-center gap-2 pt-1">
              <input id="fReadOnly" type="checkbox" class="rounded border-slate-300 text-emerald-600 focus:ring-emerald-400" />
              <span class="text-[11px] text-slate-600" data-i18n="db.form.readOnly">只读模式（拒绝执行写操作）</span>
            </label>
          </div>
        </details>

        <p id="connError" class="hidden rounded-lg bg-rose-50 px-3 py-2 text-[11px] text-rose-600"></p>
        <p id="connTestResult" class="hidden rounded-lg px-3 py-2 text-[11px]"></p>

        <div class="flex items-center gap-2 pt-1">
          <button type="button" id="testConnBtn" class="rounded-lg border border-slate-200 px-3 py-2 text-[11.5px] text-slate-600 hover:bg-slate-50" data-i18n="db.form.test">测试连接</button>
          <button type="button" id="cancelConnBtn" class="ml-auto rounded-lg border border-slate-200 px-4 py-2 text-[11.5px] text-slate-600 hover:bg-slate-50" data-i18n="db.common.cancel">取消</button>
          <button type="submit" class="rounded-lg bg-emerald-500 px-5 py-2 text-[11.5px] font-semibold text-white hover:bg-emerald-400" data-i18n="db.common.save">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 行编辑 -->
  <div id="rowModal" class="modal hidden bg-slate-900/30 p-4 backdrop-blur-sm">
    <form id="rowForm" class="flex max-h-[82vh] w-[600px] flex-col overflow-hidden rounded-2xl bg-white shadow-2xl">
      <div class="flex flex-none items-center justify-between border-b border-slate-100 px-5 py-3">
        <div class="flex items-center gap-2">
          <span id="rowBadge"></span>
          <div id="rowTitle" class="text-[13px] font-semibold text-slate-800"></div>
        </div>
        <button type="button" id="closeRowModal" class="grid h-7 w-7 place-items-center rounded-lg text-slate-400 hover:bg-slate-100"><svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="min-h-0 flex-1 overflow-y-auto px-5 py-4">
        <div id="rowFields" class="grid grid-cols-2 gap-3"></div>
      </div>
      <div class="flex flex-none items-center gap-2 border-t border-slate-100 px-5 py-3">
        <span id="rowError" class="text-[11px] text-rose-600"></span>
        <button type="button" id="cancelRowBtn" class="ml-auto rounded-lg border border-slate-200 px-4 py-2 text-[11.5px] text-slate-600 hover:bg-slate-50" data-i18n="db.common.cancel">取消</button>
        <button type="submit" class="rounded-lg bg-emerald-500 px-5 py-2 text-[11.5px] font-semibold text-white hover:bg-emerald-400" data-i18n="db.common.save">保存</button>
      </div>
    </form>
  </div>

  <!-- 表结构变更 -->
  <div id="alterModal" class="modal hidden bg-slate-900/30 p-4 backdrop-blur-sm">
    <form id="alterForm" class="flex max-h-[82vh] w-[620px] flex-col overflow-hidden rounded-2xl bg-white shadow-2xl">
      <div class="flex flex-none items-center justify-between border-b border-slate-100 px-5 py-3">
        <div id="alterTitle" class="text-[13px] font-semibold text-slate-800" data-i18n="db.alter.title">表结构变更</div>
        <button type="button" id="closeAlterModal" class="grid h-7 w-7 place-items-center rounded-lg text-slate-400 hover:bg-slate-100"><svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="min-h-0 flex-1 space-y-3 overflow-y-auto px-5 py-4">
        <div class="editor-field">
          <label data-i18n="db.alter.op">操作类型</label>
          <select id="alterOp">
            <option value="add" data-i18n="db.alter.add">新增列</option>
            <option value="modify" data-i18n="db.alter.modify">修改列</option>
            <option value="rename" data-i18n="db.alter.rename">重命名列</option>
            <option value="drop" data-i18n="db.alter.drop">删除列</option>
            <option value="addIndex" data-i18n="db.alter.addIndex">新增索引</option>
            <option value="dropIndex" data-i18n="db.alter.dropIndex">删除索引</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="editor-field"><label data-i18n="db.alter.name">列名</label><input id="alterName" type="text" spellcheck="false" /></div>
          <div class="editor-field"><label data-i18n="db.alter.newName">新列名</label><input id="alterNewName" type="text" spellcheck="false" /></div>
          <div class="editor-field"><label data-i18n="db.alter.type">列类型</label><input id="alterType" type="text" spellcheck="false" placeholder="VARCHAR(255)" /></div>
          <div class="editor-field"><label data-i18n="db.alter.default">默认值</label><input id="alterDefault" type="text" spellcheck="false" placeholder="NULL" /></div>
        </div>
        <div class="editor-field" id="alterColsWrap">
          <label data-i18n="db.alter.columns">索引列（逗号分隔）</label>
          <input id="alterColumns" type="text" spellcheck="false" placeholder="col1, col2" />
        </div>
        <div class="flex items-center gap-4">
          <label class="flex items-center gap-1.5 text-[11px] text-slate-600"><input id="alterNotNull" type="checkbox" class="accent-emerald-500" /><span data-i18n="db.alter.notNull">非空</span></label>
          <label class="flex items-center gap-1.5 text-[11px] text-slate-600"><input id="alterUnique" type="checkbox" class="accent-emerald-500" /><span data-i18n="db.alter.unique">唯一索引</span></label>
        </div>
        <pre id="alterPreview" class="hidden max-h-56 overflow-auto whitespace-pre-wrap rounded-lg bg-slate-50 p-3 font-mono text-[10.5px] leading-relaxed text-slate-600"></pre>
        <div id="alterError" class="text-[11px] text-rose-600"></div>
      </div>
      <div class="flex flex-none items-center gap-2 border-t border-slate-100 px-5 py-3">
        <button type="button" id="previewAlterBtn" class="rounded-lg border border-slate-200 px-3 py-2 text-[11.5px] text-slate-600 hover:bg-slate-50" data-i18n="db.alter.preview">预览 SQL</button>
        <button type="button" id="cancelAlterBtn" class="ml-auto rounded-lg border border-slate-200 px-4 py-2 text-[11.5px] text-slate-600 hover:bg-slate-50" data-i18n="db.common.cancel">取消</button>
        <button type="submit" class="rounded-lg bg-emerald-500 px-5 py-2 text-[11.5px] font-semibold text-white hover:bg-emerald-400" data-i18n="db.alter.execute">执行</button>
      </div>
    </form>
  </div>

  <input id="csvFile" type="file" accept=".csv,text/csv" class="hidden" />
  <input id="sqlFile" type="file" accept=".sql,text/plain" class="hidden" />

  <div id="toast" class="pointer-events-none fixed bottom-5 left-1/2 z-50 hidden -translate-x-1/2 rounded-lg bg-slate-900 px-4 py-2 text-[11.5px] text-white shadow-lg"></div>

<script>
const API = '/api/apps/db';
const AppI18n = window.DevOSAppI18n;
const tr = (key, params) => (AppI18n ? AppI18n.t(key, params) : key);
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const keyOf = (...parts) => JSON.stringify(parts);

document.title = tr('db.app.title');

const S = {
  connections: [],
  expanded: new Set(),
  cache: new Map(),
  loading: new Set(),
  tabs: [],
  active: null,
  seq: 0,
  search: '',
  nodeMap: new Map(),
};

/* ---------- 通用 ---------- */
async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text }; }
  if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

let toastTimer = null;
function toast(msg, type = 'ok') {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'pointer-events-none fixed bottom-5 left-1/2 z-50 -translate-x-1/2 rounded-lg px-4 py-2 text-[11.5px] text-white shadow-lg ' +
    (type === 'err' ? 'bg-rose-600' : 'bg-slate-900');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2600);
}

// 状态栏文案保存为可重新求值的函数，语言切换后按当前语言重算。
function setStatus(tab, fn) {
  tab.statusFn = fn;
  refreshStatus(tab);
}

function refreshStatus(tab) {
  if (!tab.el) return;
  const node = $('.query-status', tab.el) || $('.data-status', tab.el);
  if (!node) return;
  node.textContent = tab.statusFn ? tab.statusFn() : tr('db.common.ready');
}

function renderConnCount() {
  const node = $('#connCount');
  if (!node) return;
  node.textContent = S.connections.length ? tr('db.conn.count', { count: S.connections.length }) : tr('db.conn.countZero');
}

function iconSvg(name, cls = 'h-3.5 w-3.5') {
  const map = {
    chevron: '<path d="m9 6 6 6-6 6"/>',
    chevronDown: '<path d="m6 9 6 6 6-6"/>',
    db: '<ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/><path d="M4 11.5v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/>',
    table: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/>',
    view: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
    column: '<path d="M4 6h16M4 12h10M4 18h13"/>',
    schema: '<path d="M3 7h6l2 3h10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/>',
    sql: '<path d="M8 4H6a2 2 0 0 0-2 2v4a2 2 0 0 1-2 2 2 2 0 0 1 2 2v4a2 2 0 0 0 2 2h2"/><path d="M16 4h2a2 2 0 0 1 2 2v4a2 2 0 0 0 2 2 2 2 0 0 0-2 2v4a2 2 0 0 1-2 2h-2"/>',
    edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
    trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
    plug: '<path d="M9 2v6M15 2v6"/><path d="M7 8h10v3a5 5 0 0 1-10 0V8Z"/><path d="M12 16v6"/>',
    refresh: '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>',
    download: '<path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    play: '<path d="m6 4 14 8-14 8V4Z"/>',
    key: '<circle cx="7.5" cy="15.5" r="4.5"/><path d="m11 12 8-8M17 6l2 2M19 4l2 2"/>',
    collection: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 15h18"/>',
    message: '<path d="M4 5h16v11H8l-4 3V5Z"/><path d="M8 9h8M8 12h5"/>',
    directory: '<path d="M3 6h6l2 2h10v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z"/><path d="M3 10h18"/>',
    terminal: '<path d="m4 17 6-6-6-6"/><path d="M12 19h8"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    minus: '<path d="M5 12h14"/>',
    save: '<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/>',
    upload: '<path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 21h14"/>',
    plan: '<path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="16" r="3"/>',
    file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/>',
    folder: '<path d="M3 7h6l2 3h10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/>',
    alert: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>',
    check: '<path d="m5 13 4 4L19 7"/>',
  };
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${map[name] || ''}</svg>`;
}

// 类型图标缩写：优先使用后端下发的 icon 键，未命中的类型回退名称首字母。
const TYPE_MONOGRAM = {
  mysql: 'My', postgres: 'PG', sqlite: 'SQ', sqlserver: 'MS', oracle: 'Or',
  redis: 'Re', mongo: 'Mo', clickhouse: 'CH', analytics: 'AN', cloud: 'CL',
  database: 'DB', file: 'FI', document: 'DO', widecolumn: 'HC', graph: 'GR',
  search: 'SE', vector: 'VE', timeseries: 'TS', message: 'MQ', keyvalue: 'KV',
  directory: 'DS', generic: 'DB',
};

function dbBadge(t, size = '') {
  const color = t?.color || '#64748b';
  const key = t?.icon || '';
  const text = TYPE_MONOGRAM[key] || (t?.name ? String(t.name).trim().slice(0, 2) : 'DB');
  return `<span class="db-badge ${size}" style="background:${color}1f;color:${color};border-color:${color}59" title="${esc(t?.name || '')}">${esc(text)}</span>`;
}

const isPlanned = (t) => !!t && t.support === 'planned';
function unsupportedMsg(t) {
  return tr('db.type.unsupported', { name: t?.name || '' });
}

const FALLBACK_TYPES = [
  { id: 'mysql', name: 'MySQL', family: 'mysql', group: '常用', defaultPort: 3306, color: '#00758f', icon: 'mysql', sql: true, support: 'native', databaseLabel: '默认数据库（可选）' },
  { id: 'postgres', name: 'PostgreSQL', family: 'postgres', group: '常用', defaultPort: 5432, schemaLevel: true, color: '#336791', icon: 'postgres', sql: true, support: 'native', databaseLabel: '默认数据库（可选）' },
  { id: 'sqlite', name: 'SQLite', family: 'sqlite', group: '常用', file: true, color: '#10b981', icon: 'sqlite', sql: true, support: 'native' },
  { id: 'redis', name: 'Redis', family: 'redis', group: 'NoSQL', defaultPort: 6379, color: '#dc382d', icon: 'redis', support: 'native', databaseLabel: '默认库号（0-15）' },
  { id: 'mongodb', name: 'MongoDB', family: 'mongo', group: 'NoSQL', defaultPort: 27017, color: '#10aa50', icon: 'mongo', support: 'native', databaseLabel: '默认数据库（可选）' },
];
let TYPES = FALLBACK_TYPES;
let TYPE_MAP = Object.fromEntries(FALLBACK_TYPES.map((t) => [t.id, t]));

// 数据库类型的分组名与提示文案属于界面文案，按 id / 分组名映射到词典。
const DRIVER_GROUP_KEYS = {
  '常用': 'db.type.group.common',
  '关系型': 'db.type.group.relational',
  'NoSQL': 'db.type.group.nosql',
  '国产化': 'db.type.group.domestic',
  '云与分布式': 'db.type.group.cloud',
  '搜索与向量': 'db.type.group.search',
  '大数据': 'db.type.group.bigdata',
  '时序与流': 'db.type.group.timeseries',
  '目录与服务': 'db.type.group.infra',
  '其他': 'db.type.group.other',
};

function driverGroupLabel(group) {
  const key = DRIVER_GROUP_KEYS[group];
  return key ? tr(key) : group;
}

function driverHint(t) {
  if (!t || !t.id) return '';
  const key = 'db.type.hint.' + t.id;
  const text = tr(key);
  return text === key ? (t.hint || '') : text;
}

function driverDatabaseLabel(t) {
  if (!t) return tr('db.type.dbLabel.default');
  if (t.family === 'redis') return tr('db.type.dbLabel.redisNum');
  if (t.family === 'oracle') return (t.id === 'dameng' || t.id === 'dm') ? tr('db.type.dbLabel.schema') : tr('db.type.dbLabel.serviceName');
  if (t.family === 'sqlserver') return tr('db.type.dbLabel.database');
  return tr('db.type.dbLabel.default');
}

const TYPE_ALIAS = { dm: 'dameng', gbase8a: 'gbase' };
function typeOf(conn) {
  const id = TYPE_ALIAS[conn?.driver] || conn?.driver;
  return TYPE_MAP[id] || FALLBACK_TYPES[0];
}
// 是否具备 SQL 工作区（NoSQL 与待支持类型使用各自的交互）。
const hasSQL = (conn) => !!typeOf(conn).sql;
function objectSchema(conn, database) {
  return typeOf(conn).family === 'sqlite' ? 'main' : (database || '');
}
// NoSQL 连接使用各自的浏览方式。
const isRedis = (conn) => typeOf(conn).family === 'redis';
const isMongo = (conn) => typeOf(conn).family === 'mongo';
const isNoSQL = (conn) => isRedis(conn) || isMongo(conn);
// 这些协议族没有传统表结构，树上的对象直接以查询面板打开。
const NO_TABLE_FAMILIES = ['http', 'cassandra', 'zookeeper', 'mqtt', 'nebula'];
const isObjectOnly = (conn) => NO_TABLE_FAMILIES.includes(typeOf(conn).family);

// 查询面板：非 SQL 协议族使用各自的示例与提示。
const QUERY_PLACEHOLDER_KEYS = {
  http: 'db.query.placeholder.http',
  cassandra: 'db.query.placeholder.cassandra',
  zookeeper: 'db.query.placeholder.zookeeper',
  mqtt: 'db.query.placeholder.mqtt',
  nebula: 'db.query.placeholder.nebula',
};
const QUERY_HINT_KEYS = {
  http: 'db.query.hint.http',
  cassandra: 'db.query.hint.cassandra',
  zookeeper: 'db.query.hint.zookeeper',
  mqtt: 'db.query.hint.mqtt',
  nebula: 'db.query.hint.nebula',
};
function queryPlaceholder(tab) {
  const key = QUERY_PLACEHOLDER_KEYS[tab.fam];
  return key ? tr(key) : tr('db.query.sqlPlaceholder');
}
function queryHint(tab) {
  const key = QUERY_HINT_KEYS[tab.fam];
  return key ? tr(key) : '';
}

// 对象节点对应的初始语句，方便在查询面板中直接执行。
function objectQueryText(conn, node) {
  const fam = typeOf(conn).family;
  const db = node.database || '';
  const name = node.table || '';
  if (fam === 'cassandra') return `SELECT * FROM ${db}.${name} LIMIT 100`;
  if (fam === 'nebula') {
    return node.kind === 'edge'
      ? `MATCH ()-[e:${name}]->() RETURN e LIMIT 100`
      : `MATCH (n:${name}) RETURN n LIMIT 100`;
  }
  if (fam === 'zookeeper') return `ls /${[db, name].filter(Boolean).join('/')}`;
  return '';
}
async function loadTypes() {
  try {
    const list = await api('/types');
    if (Array.isArray(list) && list.length) TYPES = list;
  } catch {
    TYPES = FALLBACK_TYPES;
  }
  TYPE_MAP = Object.fromEntries(TYPES.map((t) => [t.id, t]));
}

const findConn = (id) => S.connections.find((c) => c.id === id);

/* ---------- 连接列表 ---------- */
async function loadConnections() {
  try {
    S.connections = await api('/connections');
  } catch (err) {
    toast(tr('db.conn.loadFailed', { error: err.message }), 'err');
    S.connections = [];
  }
  renderConnCount();
  renderTree();
}

/* ---------- 对象树 ---------- */
function renderTree() {
  S.nodeMap.clear();
  const tree = $('#tree');
  if (!S.connections.length) {
    tree.innerHTML = `<div class="px-3 py-10 text-center text-[11px] text-slate-400">${esc(tr('db.tree.empty'))}<br/>${esc(tr('db.tree.emptyHint'))}</div>`;
    return;
  }
  const kw = S.search.toLowerCase();
  const visible = S.connections.filter((c) => {
    if (!kw) return true;
    return [c.name, c.host, c.group, c.database, c.file, c.driver].filter(Boolean).some((v) => String(v).toLowerCase().includes(kw));
  });
  if (!visible.length) {
    tree.innerHTML = `<div class="px-3 py-10 text-center text-[11px] text-slate-400">${esc(tr('db.tree.noMatch'))}</div>`;
    return;
  }
  const groups = new Map();
  for (const c of visible) {
    const g = c.group || tr('db.tree.ungrouped');
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(c);
  }
  let html = '';
  for (const [group, conns] of [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0], 'zh'))) {
    html += `<div class="mt-1 px-2 pb-0.5 pt-2 text-[10px] font-semibold uppercase tracking-wide text-slate-400">${esc(group)}</div>`;
    for (const conn of conns) html += renderConn(conn);
  }
  tree.innerHTML = html;
}

function renderConn(conn) {
  const p = keyOf('conn', conn.id);
  S.nodeMap.set(p, { kind: 'conn', path: p, connId: conn.id });
  const t = typeOf(conn);
  const planned = isPlanned(t);
  const sqlMode = !!t.sql;
  const consoleTitle = planned ? unsupportedMsg(t) : (sqlMode ? tr('db.tree.newQuery') : tr('db.tree.console'));
  const consoleIcon = sqlMode ? 'sql' : 'terminal';
  const open = S.expanded.has(p);
  const loading = S.loading.has(p);
  const dbs = S.cache.get(p);
  const active = S.tabs.some((t2) => t2.connId === conn.id && t2.id === S.active) ? ' active' : '';
  return `
    <div class="tree-row${active} mx-1 flex items-center gap-1 rounded-md px-1 py-1" data-node="${esc(p)}">
      <button data-act="toggle" class="grid h-4 w-4 flex-none place-items-center rounded text-slate-400 hover:bg-slate-200">
        ${loading ? iconSvg('refresh', 'h-3 w-3 spin') : iconSvg(open ? 'chevronDown' : 'chevron', 'h-3 w-3')}
      </button>
      ${dbBadge(t)}
      <span class="min-w-0 flex-1 truncate text-[11.5px] font-medium text-slate-700" data-act="toggle" title="${esc(conn.name)} · ${esc(t.name)}${planned ? ' · ' + esc(tr('db.type.plannedShort')) : ''}">${esc(conn.name)}</span>
      ${planned ? `<span class="ui-select-tag flex-none">${esc(tr('db.type.plannedShort'))}</span>` : ''}
      <span class="tree-actions flex-none items-center gap-0.5">
        <button data-act="query" title="${esc(consoleTitle)}" class="grid h-5 w-5 place-items-center rounded text-slate-400 hover:bg-white hover:text-emerald-600 ${planned ? 'opacity-40' : ''}">${iconSvg(consoleIcon, 'h-3 w-3')}</button>
        <button data-act="ping" title="${esc(tr('db.form.test'))}" class="grid h-5 w-5 place-items-center rounded text-slate-400 hover:bg-white hover:text-sky-600">${iconSvg('plug', 'h-3 w-3')}</button>
        <button data-act="edit" title="${esc(tr('db.tree.edit'))}" class="grid h-5 w-5 place-items-center rounded text-slate-400 hover:bg-white hover:text-slate-700">${iconSvg('edit', 'h-3 w-3')}</button>
        <button data-act="dup" title="${esc(tr('db.common.copy'))}" class="grid h-5 w-5 place-items-center rounded text-slate-400 hover:bg-white hover:text-slate-700">${iconSvg('copy', 'h-3 w-3')}</button>
        <button data-act="del" title="${esc(tr('db.tree.delete'))}" class="grid h-5 w-5 place-items-center rounded text-slate-400 hover:bg-white hover:text-rose-600">${iconSvg('trash', 'h-3 w-3')}</button>
      </span>
    </div>
    ${open ? renderConnChildren(conn, dbs, loading) : ''}`;
}

function renderConnChildren(conn, dbs, loading) {
  if (loading) return `<div class="pl-9 py-1 text-[10.5px] text-slate-400">${esc(tr('db.common.loading'))}</div>`;
  if (!dbs || !dbs.length) return `<div class="pl-9 py-1 text-[10.5px] text-slate-400">${esc(isRedis(conn) ? tr('db.tree.noDb') : tr('db.tree.noDatabases'))}</div>`;
  return dbs.map((db) => renderDb(conn, db)).join('');
}

function renderDb(conn, db) {
  const t = typeOf(conn);
  const p = keyOf('db', conn.id, db);
  S.nodeMap.set(p, { kind: 'db', path: p, connId: conn.id, database: db });
  const open = S.expanded.has(p);
  const loading = S.loading.has(p);
  const children = S.cache.get(p);
  let suffix = '';
  let icon = 'db';
  if (t.schemaLevel) suffix = ' ' + tr('db.tree.suffix.database');
  else if (t.family === 'oracle') suffix = ' ' + tr('db.tree.suffix.schema');
  else if (t.family === 'redis') { suffix = ' ' + tr('db.tree.suffix.redisDb'); icon = 'key'; }
  else if (t.family === 'mongo') icon = 'collection';
  else if (t.family === 'cassandra') suffix = ' ' + tr('db.tree.suffix.keyspace');
  else if (t.family === 'nebula') suffix = ' ' + tr('db.tree.suffix.space');
  else if (t.family === 'mqtt') { suffix = ' ' + tr('db.tree.suffix.topic'); icon = 'message'; }
  else if (t.family === 'zookeeper') { suffix = ' ' + tr('db.tree.suffix.path'); icon = 'directory'; }
  const consoleTitle = isNoSQL(conn) ? tr('db.tree.consoleHere') : tr('db.tree.queryHere');
  return `
    <div class="tree-row mx-1 flex items-center gap-1 rounded-md py-0.5 pl-3 pr-1" data-node="${esc(p)}">
      <button data-act="toggle" class="grid h-4 w-4 flex-none place-items-center rounded text-slate-400 hover:bg-slate-200">
        ${loading ? iconSvg('refresh', 'h-3 w-3 spin') : iconSvg(open ? 'chevronDown' : 'chevron', 'h-3 w-3')}
      </button>
      ${iconSvg(icon, 'h-3.5 w-3.5 flex-none text-slate-400')}
      <span class="min-w-0 flex-1 truncate text-[11px] text-slate-600" data-act="toggle" title="${esc(db)}">${esc(db + suffix)}</span>
      <span class="tree-actions flex-none items-center">
        <button data-act="query" title="${consoleTitle}" class="grid h-5 w-5 place-items-center rounded text-slate-400 hover:bg-white hover:text-emerald-600">${iconSvg(typeOf(conn).sql ? 'sql' : 'terminal', 'h-3 w-3')}</button>
      </span>
    </div>
    ${open ? renderDbChildren(conn, db, children, loading) : ''}`;
}

function renderDbChildren(conn, db, children, loading) {
  if (loading) return `<div class="pl-12 py-1 text-[10.5px] text-slate-400">${esc(tr('db.common.loading'))}</div>`;
  if (isRedis(conn)) return renderRedisKeys(conn, db, children);
  if (isMongo(conn)) {
    if (!children || !children.length) return `<div class="pl-12 py-1 text-[10.5px] text-slate-400">${esc(tr('db.tree.noCollections'))}</div>`;
    return children.map((name) => renderCollection(conn, db, name)).join('');
  }
  if (typeOf(conn).schemaLevel) {
    if (!children || !children.length) return `<div class="pl-12 py-1 text-[10.5px] text-slate-400">${esc(tr('db.tree.noSchemas'))}</div>`;
    return children.map((s) => renderSchema(conn, db, s)).join('');
  }
  return renderObjects(conn, db, objectSchema(conn, db), children, 4);
}

/* Redis：键列表与 MongoDB：集合列表 */
function renderRedisKeys(conn, db, data) {
  if (!data) return `<div class="pl-12 py-1 text-[10.5px] text-slate-400">${esc(tr('db.common.loading'))}</div>`;
  const rows = data.keys.map((item) => {
    const p = keyOf('rkey', conn.id, db, item.key);
    S.nodeMap.set(p, { kind: 'rkey', path: p, connId: conn.id, database: db, key: item.key });
    const ttl = item.ttl >= 0 ? `${item.ttl}s` : '';
    return `
      <div class="tree-row mx-1 flex items-center gap-1 rounded-md py-0.5 pl-7 pr-1 cursor-pointer hover:bg-slate-100" data-node="${esc(p)}" data-act="open" title="${esc(item.key)} · ${esc(item.type)}">
        ${iconSvg('key', 'h-3.5 w-3.5 flex-none text-rose-400/80')}
        <span class="min-w-0 flex-1 truncate font-mono text-[10.5px] text-slate-600">${esc(item.key)}</span>
        <span class="flex-none rounded bg-slate-100 px-1 text-[9px] text-slate-500">${esc(item.type)}</span>
        ${ttl ? `<span class="flex-none text-[9px] text-amber-500">${esc(ttl)}</span>` : ''}
      </div>`;
  }).join('');
  const empty = data.keys.length ? '' : `<div class="pl-12 py-1 text-[10.5px] text-slate-400">${esc(tr('db.tree.noKeys'))}</div>`;
  const morePath = keyOf('rmore', conn.id, db);
  S.nodeMap.set(morePath, { kind: 'more', path: morePath, connId: conn.id, database: db });
  const more = data.more ? `
    <div class="mx-1 flex items-center gap-1 rounded-md py-0.5 pl-7 pr-1" data-node="${esc(morePath)}" data-act="more">
      <button class="text-[10.5px] text-sky-600 hover:underline">${esc(tr('db.tree.loadMoreKeys'))}</button>
    </div>` : '';
  return empty + rows + more;
}

function renderCollection(conn, db, name) {
  const p = keyOf('coll', conn.id, db, name);
  S.nodeMap.set(p, { kind: 'coll', path: p, connId: conn.id, database: db, table: name });
  return `
    <div class="tree-row mx-1 flex cursor-pointer items-center gap-1 rounded-md py-0.5 pl-7 pr-1 hover:bg-slate-100" data-node="${esc(p)}" data-act="open" title="${esc(name)}">
      ${iconSvg('collection', 'h-3.5 w-3.5 flex-none text-emerald-500/80')}
      <span class="min-w-0 flex-1 truncate font-mono text-[10.5px] text-slate-600">${esc(name)}</span>
    </div>`;
}

function renderSchema(conn, db, schema) {
  const p = keyOf('schema', conn.id, db, schema);
  S.nodeMap.set(p, { kind: 'schema', path: p, connId: conn.id, database: db, schema });
  const open = S.expanded.has(p);
  const loading = S.loading.has(p);
  return `
    <div class="tree-row mx-1 flex items-center gap-1 rounded-md py-0.5 pl-7 pr-1" data-node="${esc(p)}">
      <button data-act="toggle" class="grid h-4 w-4 flex-none place-items-center rounded text-slate-400 hover:bg-slate-200">
        ${loading ? iconSvg('refresh', 'h-3 w-3 spin') : iconSvg(open ? 'chevronDown' : 'chevron', 'h-3 w-3')}
      </button>
      ${iconSvg('schema', 'h-3.5 w-3.5 flex-none text-amber-500/70')}
      <span class="min-w-0 flex-1 truncate text-[11px] text-slate-600" data-act="toggle" title="${esc(schema)}">${esc(schema)}</span>
      <span class="tree-actions flex-none items-center">
        <button data-act="query" title="${esc(tr('db.tree.queryInSchema'))}" class="grid h-5 w-5 place-items-center rounded text-slate-400 hover:bg-white hover:text-emerald-600">${iconSvg('sql', 'h-3 w-3')}</button>
      </span>
    </div>
    ${open ? renderObjects(conn, db, schema, S.cache.get(p), 6) : ''}`;
}

function renderObjects(conn, db, schema, objects, indent) {
  if (!objects) return `<div class="pl-${indent * 3} py-1" style="padding-left:${indent * 12 + 20}px"><span class="text-[10.5px] text-slate-400">${esc(tr('db.common.loading'))}</span></div>`;
  if (!objects.length) return `<div style="padding-left:${indent * 12 + 20}px" class="py-1 text-[10.5px] text-slate-400">${esc(tr('db.tree.noTables'))}</div>`;
  return objects.map((obj) => renderObject(conn, db, schema, obj, indent)).join('');
}

function renderObject(conn, db, schema, obj, indent) {
  const p = keyOf(obj.type, conn.id, db, schema, obj.name);
  S.nodeMap.set(p, { kind: obj.type, path: p, connId: conn.id, database: db, schema, table: obj.name });
  const open = S.expanded.has(p);
  const loading = S.loading.has(p);
  const cols = S.cache.get(p);
  const sqlMode = !!typeOf(conn).sql;
  return `
    <div class="tree-row mx-1 flex items-center gap-1 rounded-md py-0.5 pr-1" style="padding-left:${indent * 12 + 12}px" data-node="${esc(p)}">
      <button data-act="toggle" class="grid h-4 w-4 flex-none place-items-center rounded text-slate-400 hover:bg-slate-200">
        ${loading ? iconSvg('refresh', 'h-3 w-3 spin') : iconSvg(open ? 'chevronDown' : 'chevron', 'h-3 w-3')}
      </button>
      ${iconSvg(obj.type === 'view' ? 'view' : (obj.type === 'tag' || obj.type === 'edge' ? 'collection' : (obj.type === 'node' ? 'directory' : 'table')), 'h-3.5 w-3.5 flex-none ' + (obj.type === 'view' ? 'text-violet-400' : 'text-emerald-500/80'))}
      <span class="min-w-0 flex-1 truncate text-[11px] text-slate-600" data-act="open" title="${esc(obj.name)}">${esc(obj.name)}</span>
      <span class="tree-actions flex-none items-center">
        <button data-act="query" title="${esc(tr(sqlMode ? 'db.tree.newQuery' : 'db.tree.console'))}" class="grid h-5 w-5 place-items-center rounded text-slate-400 hover:bg-white hover:text-emerald-600">${iconSvg(sqlMode ? 'sql' : 'terminal', 'h-3 w-3')}</button>
      </span>
    </div>
    ${open ? renderColumns(cols, indent + 1) : ''}`;
}

function renderColumns(cols, indent) {
  if (!cols) return `<div style="padding-left:${indent * 12 + 30}px" class="py-0.5 text-[10.5px] text-slate-400">${esc(tr('db.common.loading'))}</div>`;
  if (!cols.length) return '';
  return cols.map((col) => `
    <div class="mx-1 flex items-center gap-1 rounded-md py-0.5" style="padding-left:${indent * 12 + 20}px">
      ${iconSvg('column', 'h-3 w-3 flex-none text-slate-300')}
      <span class="truncate text-[10.5px] text-slate-500" title="${esc(col.type)} ${esc(col.comment || '')}">${esc(col.name)}</span>
      <span class="ml-auto truncate pl-1 text-[9.5px] text-slate-400">${esc(col.type)}</span>
    </div>`).join('');
}

/* ---------- 树交互 ---------- */
async function toggleNode(node) {
  const p = node.path;
  if (S.expanded.has(p)) {
    S.expanded.delete(p);
    renderTree();
    return;
  }
  S.expanded.add(p);
  renderTree();
  if (S.cache.has(p) || S.loading.has(p)) return;
  S.loading.add(p);
  renderTree();
  try {
    const conn = findConn(node.connId);
    let data = null;
    if (node.kind === 'conn') {
      data = await api('/databases?id=' + encodeURIComponent(node.connId));
    } else if (node.kind === 'db') {
      if (isRedis(conn)) {
        data = await api(`/redis/keys?id=${encodeURIComponent(node.connId)}&db=${encodeURIComponent(node.database)}&cursor=0`);
      } else if (isMongo(conn)) {
        data = await api(`/mongo/collections?id=${encodeURIComponent(node.connId)}&database=${encodeURIComponent(node.database)}`);
      } else if (typeOf(conn).schemaLevel) {
        data = await api(`/schemas?id=${encodeURIComponent(node.connId)}&database=${encodeURIComponent(node.database)}`);
      } else {
        const schema = objectSchema(conn, node.database);
        data = await api(`/objects?id=${encodeURIComponent(node.connId)}&database=${encodeURIComponent(node.database)}&schema=${encodeURIComponent(schema)}`);
      }
    } else if (node.kind === 'schema') {
      data = await api(`/objects?id=${encodeURIComponent(node.connId)}&database=${encodeURIComponent(node.database)}&schema=${encodeURIComponent(node.schema)}`);
    } else if (node.kind === 'table' || node.kind === 'view') {
      data = await api(`/columns?id=${encodeURIComponent(node.connId)}&database=${encodeURIComponent(node.database || '')}&schema=${encodeURIComponent(node.schema || '')}&table=${encodeURIComponent(node.table)}`);
    } else if (node.kind === 'tag' || node.kind === 'edge' || node.kind === 'node') {
      // 图标签、边与目录节点没有列信息，按空列处理避免一直在加载。
      data = [];
    }
    S.cache.set(p, data);
  } catch (err) {
    toast(tr('db.tree.loadFailed', { error: err.message }), 'err');
    S.expanded.delete(p);
  } finally {
    S.loading.delete(p);
    renderTree();
  }
}

async function ensureDatabases(conn) {
  const p = keyOf('conn', conn.id);
  if (!S.cache.has(p)) {
    S.cache.set(p, await api('/databases?id=' + encodeURIComponent(conn.id)));
  }
  return S.cache.get(p) || [];
}

// Redis 键空间按游标增量加载。
async function loadMoreRedisKeys(node) {
  const cacheKey = keyOf('db', node.connId, node.database);
  const current = S.cache.get(cacheKey);
  if (!current || !current.more) return;
  try {
    const res = await api(`/redis/keys?id=${encodeURIComponent(node.connId)}&db=${encodeURIComponent(node.database)}&cursor=${encodeURIComponent(current.cursor)}`);
    S.cache.set(cacheKey, { keys: [...current.keys, ...res.keys], cursor: res.cursor, more: res.more });
    renderTree();
  } catch (err) {
    toast(tr('db.tree.loadFailed', { error: err.message }), 'err');
  }
}

$('#tree').addEventListener('click', async (ev) => {
  const row = ev.target.closest('[data-node]');
  if (!row) return;
  const node = S.nodeMap.get(row.dataset.node);
  if (!node) return;
  const actEl = ev.target.closest('[data-act]');
  const act = actEl ? actEl.dataset.act : 'toggle';
  const conn = findConn(node.connId);
  if (!conn) return;

  if (act === 'toggle') {
    ev.stopPropagation();
    if (node.kind === 'table' || node.kind === 'view') {
      await toggleNode(node);
    } else {
      await toggleNode(node);
    }
    return;
  }
  if (act === 'open') {
    if (node.kind === 'rkey') openRedisKeyTab(node);
    else if (node.kind === 'coll') openMongoTab(node);
    else if (isObjectOnly(conn)) openQueryTab(node.connId, node.database || '', objectQueryText(conn, node));
    else openDataTab(node);
    return;
  }
  if (act === 'more') {
    loadMoreRedisKeys(node);
    return;
  }
  if (act === 'query') {
    if (isPlanned(typeOf(conn))) { toast(unsupportedMsg(typeOf(conn)), 'err'); return; }
    const seed = node.table ? objectQueryText(conn, node) : '';
    openQueryTab(node.connId, node.database || conn.database || '', seed);
    return;
  }
  if (act === 'ping') {
    if (isPlanned(typeOf(conn))) { toast(unsupportedMsg(typeOf(conn)), 'err'); return; }
    toast(tr('db.ping.testing'));
    try {
      const res = await api('/ping?id=' + encodeURIComponent(node.connId));
      toast(res.ok
        ? (res.version
          ? tr('db.ping.ok', { ms: res.latencyMs, version: res.version })
          : tr('db.ping.okNoVersion', { ms: res.latencyMs }))
        : tr('db.ping.failed'));
    } catch (err) {
      toast(tr('db.ping.failedWithError', { error: err.message }), 'err');
    }
    return;
  }
  if (act === 'edit') {
    openConnModal(conn);
    return;
  }
  if (act === 'dup') {
    try {
      await api('/connections/' + encodeURIComponent(conn.id) + '/duplicate', { method: 'POST' });
      await loadConnections();
      toast(tr('db.conn.duplicated'));
    } catch (err) {
      toast(tr('db.conn.dupFailed', { error: err.message }), 'err');
    }
    return;
  }
  if (act === 'del') {
    if (!confirm(tr('db.conn.confirmDelete', { name: conn.name }))) return;
    try {
      await api('/connections/' + encodeURIComponent(conn.id), { method: 'DELETE' });
      S.cache.delete(keyOf('conn', conn.id));
      await loadConnections();
      toast(tr('db.conn.deleted'));
    } catch (err) {
      toast(tr('db.conn.deleteFailed', { error: err.message }), 'err');
    }
  }
});

/* ---------- 标签页 ---------- */
function tabTitle(tab) {
  if (tab.type === 'query') {
    if (tab.fam === 'redis') return `Redis · ${tab.database || '0'}`;
    if (tab.fam === 'mongo') return `Mongo · ${tab.database || ''}`;
    const conn = findConn(tab.connId);
    if (conn && !typeOf(conn).sql) return `${typeOf(conn).name} · ${tab.database || ''}`;
    return tr('db.tab.query', { db: tab.database || (conn?.name ?? '') });
  }
  if (tab.type === 'rkey') return tab.key;
  if (tab.type === 'mongo') return `${tab.database}.${tab.table}`;
  return tab.table;
}

function tabIcon(tab) {
  if (tab.type === 'rkey') return iconSvg('key', 'h-3 w-3');
  if (tab.type === 'mongo') return iconSvg('collection', 'h-3 w-3');
  if (tab.type === 'data') return iconSvg(S.nodeMap.get(tab.path)?.kind === 'view' ? 'view' : 'table', 'h-3 w-3');
  const conn = findConn(tab.connId);
  return iconSvg(conn && typeOf(conn).sql ? 'sql' : 'terminal', 'h-3 w-3');
}

function renderTabs() {
  const bar = $('#tabbar');
  bar.innerHTML = S.tabs.map((t) => `
    <div data-tab="${t.id}" class="group flex cursor-pointer items-center gap-1.5 rounded-t-lg border border-b-0 px-3 py-1.5 text-[11px] ${t.id === S.active ? 'border-slate-200 bg-white font-medium text-slate-800' : 'border-transparent text-slate-500 hover:bg-slate-100'}">
      ${tabIcon(t)}
      <span class="max-w-[160px] truncate">${esc(tabTitle(t))}</span>
      <button data-close="${t.id}" class="ml-1 grid h-4 w-4 place-items-center rounded text-slate-400 hover:bg-slate-200 hover:text-slate-700">${iconSvg('close', 'h-2.5 w-2.5')}</button>
    </div>`).join('');
  $('#emptyState').style.display = S.tabs.length ? 'none' : 'flex';
  for (const t of S.tabs) if (t.el) t.el.classList.toggle('hidden', t.id !== S.active);
}

$('#tabbar').addEventListener('click', (ev) => {
  const closeBtn = ev.target.closest('[data-close]');
  if (closeBtn) {
    ev.stopPropagation();
    closeTab(Number(closeBtn.dataset.close));
    return;
  }
  const tabEl = ev.target.closest('[data-tab]');
  if (tabEl) activateTab(Number(tabEl.dataset.tab));
});

function activateTab(id) {
  S.active = id;
  renderTabs();
  renderTree();
}

function closeTab(id) {
  const idx = S.tabs.findIndex((t) => t.id === id);
  if (idx < 0) return;
  const [tab] = S.tabs.splice(idx, 1);
  tab.el?.remove();
  if (S.active === id) S.active = S.tabs.length ? S.tabs[Math.max(0, idx - 1)].id : null;
  renderTabs();
  renderTree();
}

function openQueryTab(connId, database, sql) {
  const fam = typeOf(findConn(connId)).family;
  const tab = {
    id: ++S.seq,
    type: 'query',
    fam,
    connId,
    database: database || '',
    sql: sql || '',
    result: null,
    error: '',
    busy: false,
    status: '',
    output: '',
  };
  S.tabs.push(tab);
  if (fam === 'redis' || fam === 'mongo') createCommandPane(tab);
  else createQueryPane(tab);
  S.active = tab.id;
  renderTabs();
  renderTree();
  setTimeout(() => tab.el?.querySelector('.sql-input, .cmd-input')?.focus(), 30);
}

function openDataTab(node) {
  const existing = S.tabs.find((t) => t.type === 'data' && t.connId === node.connId && t.database === node.database && t.schema === node.schema && t.table === node.table);
  if (existing) {
    activateTab(existing.id);
    return;
  }
  const tab = {
    id: ++S.seq,
    type: 'data',
    path: node.path,
    connId: node.connId,
    database: node.database || '',
    schema: node.schema || '',
    table: node.table,
    view: 'data',
    page: 1,
    pageSize: 100,
    total: -1,
    sort: '',
    dir: 'asc',
    data: null,
    structure: null,
    error: '',
    busy: false,
    status: '',
  };
  S.tabs.push(tab);
  createDataPane(tab);
  S.active = tab.id;
  renderTabs();
  renderTree();
  loadTableData(tab);
}

/* ---------- 查询面板 ---------- */
function createQueryPane(tab) {
  const el = document.createElement('section');
  el.className = 'pane hidden';
  el.innerHTML = `
    <div class="flex flex-none flex-wrap items-center gap-2 border-b border-slate-200 bg-white/70 px-3 py-2">
      <select class="db-select rounded-lg border border-slate-200 bg-white px-2 py-1.5 font-mono text-[11px] outline-none focus:border-emerald-400">
        <option value="">${esc(tr('db.query.defaultDb'))}</option>
      </select>
      <button class="exec-btn flex items-center gap-1.5 rounded-lg bg-emerald-500 px-3 py-1.5 text-[11.5px] font-semibold text-white hover:bg-emerald-400 disabled:opacity-50">
        ${iconSvg('play', 'h-3 w-3')} ${esc(tr('db.query.exec'))} <span class="kbd !text-white/80 !border-white/30 !bg-white/10">Ctrl+Enter</span>
      </button>
      <label class="flex items-center gap-1 text-[10.5px] text-slate-500"><span class="rows-label">${esc(tr('db.query.maxRows'))}</span>
        <input class="max-rows w-16 rounded-md border border-slate-200 px-1.5 py-1 font-mono text-[10.5px] outline-none focus:border-emerald-400" type="number" min="1" max="20000" value="1000" />
      </label>
      <button class="export-btn flex items-center gap-1 rounded-lg border border-slate-200 px-2 py-1.5 text-[10.5px] text-slate-600 hover:bg-slate-50">${iconSvg('download', 'h-3 w-3')} ${esc(tr('db.common.exportCsv'))}</button>
      <button class="copy-btn rounded-lg border border-slate-200 px-2 py-1.5 text-[10.5px] text-slate-600 hover:bg-slate-50">${esc(tr('db.common.copyResult'))}</button>
      <button class="open-sql-btn flex items-center gap-1 rounded-lg border border-slate-200 px-2 py-1.5 text-[10.5px] text-slate-600 hover:bg-slate-50">${iconSvg('folder', 'h-3 w-3')} ${esc(tr('db.query.openFile'))}</button>
      <button class="run-file-btn flex items-center gap-1 rounded-lg border border-slate-200 px-2 py-1.5 text-[10.5px] text-slate-600 hover:bg-slate-50">${iconSvg('file', 'h-3 w-3')} ${esc(tr('db.query.runScript'))}</button>
      <button class="explain-btn flex items-center gap-1 rounded-lg border border-slate-200 px-2 py-1.5 text-[10.5px] text-slate-600 hover:bg-slate-50">${iconSvg('plan', 'h-3 w-3')} ${esc(tr('db.query.explain'))}</button>
      <span class="query-hint ml-auto text-[10px] text-slate-400"></span>
    </div>
    <textarea class="sql-input min-h-0 flex-none resize-none border-b border-slate-200 bg-white p-3 font-mono text-[11.5px] leading-relaxed text-slate-700 outline-none" style="height:38%;flex:0 0 38%" spellcheck="false" placeholder="${esc(queryPlaceholder(tab))}"></textarea>
    <div class="query-status flex-none border-b border-slate-200 bg-slate-50 px-3 py-1 text-[10px] text-slate-500">${esc(tr('db.common.ready'))}</div>
    <div class="grid-wrap min-h-0 flex-1 overflow-auto bg-white"></div>`;
  $('#panes').appendChild(el);
  tab.el = el;

  const conn = findConn(tab.connId);
  const select = $('.db-select', el);
  const input = $('.sql-input', el);
  input.value = tab.sql || '';
  const hintKey = QUERY_HINT_KEYS[tab.fam];
  if (hintKey) $('.query-hint', el).textContent = tr(hintKey);
  // 非 SQL 协议族不支持脚本执行、执行计划与 .sql 文件载入。
  if (!typeOf(conn).sql) {
    for (const selector of ['.open-sql-btn', '.run-file-btn', '.explain-btn']) {
      $(selector, el)?.classList.add('hidden');
    }
  }

  (async () => {
    try {
      const dbs = await ensureDatabases(conn);
      for (const db of dbs) {
        const opt = document.createElement('option');
        opt.value = db;
        opt.textContent = db;
        select.appendChild(opt);
      }
      if (tab.database && dbs.includes(tab.database)) select.value = tab.database;
      else if (!tab.database && conn.database && dbs.includes(conn.database)) {
        tab.database = conn.database;
        select.value = tab.database;
      } else if (!tab.database && dbs.length) {
        tab.database = dbs[0];
        select.value = tab.database;
      }
    } catch (err) {
      tab.dbListError = err.message;
      $('.query-hint', el).textContent = tr('db.query.dbListFailed', { error: err.message });
    }
  })();

  select.addEventListener('change', () => { tab.database = select.value; renderTabs(); });
  input.addEventListener('input', () => { tab.sql = input.value; });
  input.addEventListener('keydown', (ev) => {
    if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') {
      ev.preventDefault();
      execQuery(tab);
    }
  });
  $('.exec-btn', el).addEventListener('click', () => execQuery(tab));
  $('.export-btn', el).addEventListener('click', () => exportCSV(tab));
  $('.copy-btn', el).addEventListener('click', () => copyResult(tab));
  $('.open-sql-btn', el).addEventListener('click', () => {
    $('#sqlFile').dataset.tab = String(tab.id);
    $('#sqlFile').click();
  });
  $('.run-file-btn', el).addEventListener('click', () => execScript(tab));
  $('.explain-btn', el).addEventListener('click', () => execExplain(tab));
}

// 打开 SQL 文件：载入编辑器并可直接执行脚本。
function loadSQLFile(tab, file) {
  file.text().then((text) => {
    tab.sql = text;
    tab.sqlName = file.name;
    const input = $('.sql-input', tab.el);
    if (input) input.value = text;
    toast(tr('db.query.fileLoaded', { name: file.name }));
  }).catch((err) => toast(err.message, 'err'));
}

async function execScript(tab) {
  if (tab.busy) return;
  const el = tab.el;
  const sql = $('.sql-input', el).value;
  if (!sql.trim()) { toast(tr('db.query.emptySql')); return; }
  tab.busy = true;
  $('.run-file-btn', el).disabled = true;
  setStatus(tab, () => tr('db.query.running'));
  try {
    const res = await api('/sqlfile', {
      method: 'POST',
      body: JSON.stringify({ id: tab.connId, database: tab.database, sql, maxRows: Number($('.max-rows', el).value) || 200 }),
    });
    tab.script = res;
    tab.result = null;
    tab.error = '';
    renderScriptOutput(tab);
  } catch (err) {
    tab.script = null;
    tab.error = err.message;
    renderQueryOutput(tab);
  } finally {
    tab.busy = false;
    $('.run-file-btn', el).disabled = false;
  }
}

function renderScriptOutput(tab) {
  const el = tab.el;
  const wrap = $('.grid-wrap', el);
  const res = tab.script;
  if (!res) return;
  const cards = (res.results || []).map((item) => {
    const head = `<div class="result-card-head">
      <span class="rounded bg-slate-200 px-1.5 py-0.5 font-mono text-[10px] text-slate-600">#${item.index}</span>
      <code class="min-w-0 flex-1 truncate font-mono text-[10px] text-slate-500">${esc(item.statement || '')}</code>
      ${item.error ? `<span class="text-rose-600">${esc(tr('db.query.failedShort'))}</span>` : item.kind === 'rows' ? `<span>${esc(tr('db.query.rowsCount', { rows: item.rowCount }))}</span>` : `<span>${esc(tr('db.query.affectedShort', { rows: item.affected }))}</span>`}
      <span class="text-slate-400">${item.durationMs || 0} ms</span>
    </div>`;
    if (item.error) {
      return `<div class="result-card">${head}<div class="whitespace-pre-wrap p-2 text-[11px] text-rose-600">${esc(item.error)}</div></div>`;
    }
    if (item.kind === 'rows') {
      return `<div class="result-card">${head}<div class="max-h-72 overflow-auto">${renderGrid(item.columns, item.rows, {})}</div></div>`;
    }
    return `<div class="result-card">${head}<div class="p-2 text-[11px] text-slate-500">${esc(tr('db.query.execOk', { affected: item.affected }))}</div></div>`;
  }).join('');
  wrap.innerHTML = cards || `<div class="p-8 text-center text-[11px] text-slate-400">${esc(tr('db.common.noResult'))}</div>`;
  setStatus(tab, () => tr('db.query.scriptStatus', { total: res.total, executed: res.executed, failed: res.failed }));
}

async function execExplain(tab) {
  if (tab.busy) return;
  const el = tab.el;
  const sql = $('.sql-input', el).value;
  if (!sql.trim()) { toast(tr('db.query.emptySql')); return; }
  tab.busy = true;
  $('.explain-btn', el).disabled = true;
  setStatus(tab, () => tr('db.query.running'));

    });

    tab.error = err.message;
    renderQueryOutput(tab);
  } finally {
    tab.busy = false;

}

async function execQuery(tab) {
  if (tab.busy) return;
  const el = tab.el;
  const sql = $('.sql-input', el).value;
  if (!sql.trim()) { toast(tr('db.query.emptySql')); return; }
  tab.busy = true;
  const btn = $('.exec-btn', el);
  btn.disabled = true;
  setStatus(tab, () => tr('db.query.running'));
  $('.query-hint', el).textContent = '';
  try {
    const res = await api('/query', {
      method: 'POST',
      body: JSON.stringify({
        id: tab.connId,
        database: tab.database,
        sql,
        maxRows: Number($('.max-rows', el).value) || 1000,
      }),
    });
    tab.result = res;
    tab.error = '';
    renderQueryOutput(tab);
  } catch (err) {
    tab.error = err.message;
    tab.result = null;
    renderQueryOutput(tab);
  } finally {
    tab.busy = false;
    btn.disabled = false;
  }
}

// 按当前语言重绘查询结果与状态栏，语言切换时复用。
function renderQueryOutput(tab) {
  const el = tab.el;
  if (!el) return;
  const wrap = $('.grid-wrap', el);
  if (tab.error) {
    wrap.innerHTML = `<div class="m-3 rounded-lg border border-rose-200 bg-rose-50 p-3 text-[11px] text-rose-600 whitespace-pre-wrap">${esc(tab.error)}</div>`;
    setStatus(tab, () => tr('db.query.execFailed'));
    return;
  }
  const res = tab.result;
  if (!res) return;
  if (res.kind === 'exec') {
    const html = res.lastId
      ? tr('db.query.execOkLastId', { affected: res.affected, lastId: res.lastId })
      : tr('db.query.execOk', { affected: res.affected });
    wrap.innerHTML = `<div class="p-8 text-center text-[11.5px] text-slate-500">${html}</div>`;
    setStatus(tab, () => tr('db.query.affectedStatus', { rows: res.affected, ms: res.durationMs }));
  } else {
    wrap.innerHTML = renderGrid(res.columns, res.rows, {});
    setStatus(tab, () => tr(res.truncated ? 'db.query.rowsStatusTruncated' : 'db.query.rowsStatus', { rows: res.rowCount, ms: res.durationMs }));
  }
}

  input.value = tab.sql || '';
  input.placeholder = redisMode ? 'SET user:1 "Alice"\nGET user:1\nKEYS *' : '{"find": "users", "filter": {}, "limit": 20}';

  (async () => {
    try {
      const dbs = await ensureDatabases(conn);
      for (const db of dbs) {

        opt.value = db;
        opt.textContent = redisMode ? `db${db}` : db;
        select.appendChild(opt);
      }

      select.value = tab.database || '';
      renderTabs();

      tab.dbListError = err.message;
      $('.query-hint', el).textContent = tr('db.query.dbListFailed', { error: err.message });
    }
  })();

  select.addEventListener('change', () => { tab.database = select.value; renderTabs(); });

      ev.preventDefault();

    }
  });

    navigator.clipboard.writeText(tab.output).then(() => toast(tr('db.common.copiedResult'))).catch(() => toast(tr('db.common.copyFailed'), 'err'));
  });
}

async function execCommand(tab) {
  if (tab.busy) return;
  const el = tab.el;
  const command = $('.cmd-input', el).value;
  if (!command.trim()) {
    toast(tr(tab.fam === 'redis' ? 'db.cmd.emptyRedis' : 'db.cmd.emptyJson'));
    return;
  }
  tab.busy = true;
  const btn = $('.exec-btn', el);
  const resultEl = $('.cmd-result', el);
  btn.disabled = true;
  setStatus(tab, () => tr('db.query.running'));
  resultEl.classList.remove('text-rose-600');
  try {
    if (tab.fam === 'redis') {
      const res = await api('/redis/command', {
        method: 'POST',
        body: JSON.stringify({ id: tab.connId, db: tab.database, command }),
      });
      const lines = [];
      for (const item of res.results) {
        lines.push('> ' + item.command);
        lines.push(item.error ? '(error) ' + item.error : formatRedisValue(item.value));
      }
      tab.output = lines.join('\n');
      resultEl.textContent = tab.output;
      setStatus(tab, () => tr('db.cmd.resultsStatus', { count: res.results.length, ms: res.durationMs }));
    } else {
      const res = await api('/mongo/command', {
        method: 'POST',
        body: JSON.stringify({ id: tab.connId, database: tab.database, command }),
      });
      tab.output = JSON.stringify(res.result, null, 2);
      resultEl.textContent = tab.output;
      setStatus(tab, () => tr('db.cmd.successStatus', { ms: res.durationMs }));
    }
  } catch (err) {
    tab.output = err.message;
    resultEl.textContent = err.message;
    resultEl.classList.add('text-rose-600');
    setStatus(tab, () => tr('db.query.execFailed'));
  } finally {
    tab.busy = false;
    btn.disabled = false;
  }
}

function formatRedisValue(v) {
  if (v === null || v === undefined) return '(nil)';
  if (typeof v === 'string') return v;
  if (typeof v === 'number' || typeof v === 'boolean') return String(v);
  try { return JSON.stringify(v, null, 2); } catch { return String(v); }
}

function ttlLabel(ttl) {
  if (ttl === -1) return tr('db.redis.ttlForever');
  if (ttl === -2) return tr('db.redis.ttlExpired');
  if (ttl === null || ttl === undefined) return '-';
  return `${ttl}s`;
}

/* ---------- Redis 键详情 ---------- */
function openRedisKeyTab(node) {
  const existing = S.tabs.find((t) => t.type === 'rkey' && t.connId === node.connId && t.database === node.database && t.key === node.key);

  }

function createRedisKeyPane(tab) {
  const el = document.createElement('section');
  el.className = 'pane hidden';
  el.innerHTML = `
    <div class="flex flex-none flex-wrap items-center gap-2 border-b border-slate-200 bg-white/70 px-3 py-2">
      <span class="key-name min-w-0 max-w-[360px] truncate font-mono text-[11.5px] font-medium text-slate-800"></span>

      <button class="copy-btn rounded-lg border border-slate-200 px-2 py-1.5 text-[10.5px] text-slate-600 hover:bg-slate-50">${esc(tr('db.common.copy'))}</button>
      <button class="del-btn ml-auto rounded-lg border border-rose-200 px-2 py-1.5 text-[10.5px] text-rose-600 hover:bg-rose-50">${esc(tr('db.redis.deleteKey'))}</button>
    </div>
    <div class="grid-wrap min-h-0 flex-1 overflow-auto bg-white"></div>
    <div class="data-status flex-none border-t border-slate-200 bg-slate-50 px-3 py-1 text-[10px] text-slate-500">${esc(tr('db.common.ready'))}</div>`;
  $('#panes').appendChild(el);
  tab.el = el;
  $('.key-name', el).textContent = tab.key;

  $('.refresh-btn', el).addEventListener('click', () => loadRedisKey(tab));
  $('.copy-btn', el).addEventListener('click', () => {
    if (!tab.output) { toast(tr('db.common.noContent')); return; }
    navigator.clipboard.writeText(tab.output).then(() => toast(tr('db.common.copied'))).catch(() => toast(tr('db.common.copyFailed'), 'err'));
  });
  $('.del-btn', el).addEventListener('click', async () => {
    if (!confirm(tr('db.redis.confirmDelete', { key: tab.key }))) return;
    try {
      await api(`/redis/key?id=${encodeURIComponent(tab.connId)}&db=${encodeURIComponent(tab.database)}&key=${encodeURIComponent(tab.key)}`, { method: 'DELETE' });
      const cacheKey = keyOf('db', tab.connId, tab.database);
      const cached = S.cache.get(cacheKey);
      if (cached) S.cache.set(cacheKey, { ...cached, keys: cached.keys.filter((k) => k.key !== tab.key) });
      toast(tr('db.redis.deleted'));
      closeTab(tab.id);
      renderTree();
    } catch (err) {
      toast(tr('db.redis.deleteFailed', { error: err.message }), 'err');
    }
  });
}

async function loadRedisKey(tab) {
  const el = tab.el;
  setStatus(tab, () => tr('db.common.loading'));
  try {
    const params = new URLSearchParams({ id: tab.connId, db: tab.database, key: tab.key });
    const res = await api('/redis/key?' + params.toString());
    tab.detail = res;
    renderRedisKeyDetail(tab);
  } catch (err) {
    tab.detail = null;
    $('.grid-wrap', el).innerHTML = `<div class="m-3 rounded-lg border border-rose-200 bg-rose-50 p-3 text-[11px] text-rose-600 whitespace-pre-wrap">${esc(err.message)}</div>`;
    setStatus(tab, () => tr('db.common.loadFailedShort'));
  }
}

// 按当前语言重绘 Redis 键详情，语言切换时复用。
function renderRedisKeyDetail(tab) {
  const el = tab.el;
  const res = tab.detail;
  if (!el || !res) return;
  const value = res.value;
  const lengthSuffix = res.length >= 0 ? ' · ' + tr('db.redis.length', { length: res.length }) : '';
  $('.key-type', el).textContent = res.type;
  $('.key-meta', el).textContent = `TTL ${ttlLabel(res.ttl)}${lengthSuffix}`;

  let html = '';
  if (res.type === 'string') {
    tab.output = String(value ?? '');
    html = `<pre class="whitespace-pre-wrap break-words p-3 font-mono text-[11.5px] leading-relaxed text-slate-700">${esc(tab.output)}</pre>`;
  } else if (res.type === 'hash') {
    tab.output = JSON.stringify(value || {}, null, 2);
    html = renderGrid([tr('db.grid.field'), tr('db.grid.value')], Object.entries(value || {}), {});
  } else if (res.type === 'list') {
    tab.output = JSON.stringify(value || [], null, 2);
    html = renderGrid([tr('db.grid.index'), tr('db.grid.value')], (value || []).map((v, i) => [i + 1, v]), {});
  } else if (res.type === 'set') {
    tab.output = JSON.stringify(value || [], null, 2);
    html = renderGrid([tr('db.grid.member')], (value || []).map((v) => [v]), {});
  } else if (res.type === 'zset') {
    tab.output = JSON.stringify(value || [], null, 2);
    html = renderGrid([tr('db.grid.member'), tr('db.grid.score')], value || [], {});
  } else if (res.type === 'stream') {
    tab.output = JSON.stringify(value || [], null, 2);
    html = renderGrid(['ID', tr('db.grid.fieldValue')], (value || []).map((m) => [m.id, JSON.stringify(m.values)]), {});
  } else {
    tab.output = JSON.stringify(value, null, 2);
    html = `<pre class="whitespace-pre-wrap break-words p-3 font-mono text-[11.5px] leading-relaxed text-slate-700">${esc(tab.output)}</pre>`;
  }
  $('.grid-wrap', el).innerHTML = html;
  setStatus(tab, () => tr('db.redis.status', { type: res.type, ttl: ttlLabel(res.ttl) }) + lengthSuffix);
}

    if (!tab.data) { toast(tr('db.common.noResult')); return; }
    const { columns, rows } = tab.data;
    const text = [columns.join('\t'), ...rows.map((r) => r.map((v) => v === null ? 'NULL' : (typeof v === 'object' ? JSON.stringify(v) : String(v))).join('\t'))].join('\n');
    navigator.clipboard.writeText(text).then(() => toast(tr('db.mongo.copied', { count: rows.length }))).catch(() => toast(tr('db.common.copyFailed'), 'err'));
  });
}

async function loadMongoDocs(tab) {
  const el = tab.el;
  const wrap = $('.grid-wrap', el);
  setStatus(tab, () => tr('db.common.loading'));
  try {
    const params = new URLSearchParams({
      id: tab.connId,
      database: tab.database,
      collection: tab.table,
      page: String(tab.page),
      pageSize: String(tab.pageSize),
    });
    if (tab.filter.trim()) params.set('filter', tab.filter.trim());
    const res = await api('/mongo/documents?' + params.toString());
    tab.data = res;
    tab.total = res.total;
    wrap.innerHTML = renderGrid(res.columns, res.rows, {});
    const pages = res.total >= 0 ? Math.max(1, Math.ceil(res.total / tab.pageSize)) : '?';
    $('.page-label', el).textContent = `${tab.page} / ${pages}`;
    setStatus(tab, () => tr('db.mongo.status', {
      total: res.total >= 0 ? res.total : tr('db.common.unknown'),
      rows: res.rowCount,
      ms: res.durationMs,
    }));
  } catch (err) {
    tab.data = null;
    wrap.innerHTML = `<div class="m-3 rounded-lg border border-rose-200 bg-rose-50 p-3 text-[11px] text-rose-600 whitespace-pre-wrap">${esc(err.message)}</div>`;
    setStatus(tab, () => tr('db.common.loadFailedShort'));
  }
}

      <button class="export-btn ml-auto flex items-center gap-1 rounded-lg border border-slate-200 px-2 py-1.5 text-[10.5px] text-slate-600 hover:bg-slate-50">${iconSvg('download', 'h-3 w-3')} ${esc(tr('db.common.exportCsv'))}</button>

    else loadStructure(tab);
  }));

  $('.prev-btn', el).addEventListener('click', () => {
    if (tab.page <= 1) return;
    tab.page--;
    loadTableData(tab);
  });
  $('.next-btn', el).addEventListener('click', () => {
    const pages = tab.total >= 0 ? Math.max(1, Math.ceil(tab.total / tab.pageSize)) : Infinity;
    if (tab.page >= pages) return;
    tab.page++;
    loadTableData(tab);
  });
  $('.page-size', el).addEventListener('change', (ev) => {
    tab.pageSize = Number(ev.target.value) || 100;
    tab.page = 1;

  });

    $('#csvFile').dataset.tab = String(tab.id);
    $('#csvFile').click();
  });

    b.addEventListener('click', () => openAlterModal(tab, b.dataset.op));
  });
  $('.grid-wrap', el).addEventListener('click', (ev) => {
    const tr = ev.target.closest('tr[data-row]');
    if (!tr || tab.view !== 'data') return;
    tab.selected = Number(tr.dataset.row);
    updateDataToolbar(tab);
    $('.grid-wrap', el).querySelectorAll('tbody tr').forEach((r) => r.classList.toggle('row-selected', r === tr));

  updateDataToolbar(tab);
  loadTableMeta(tab);
